id: java.prot.tls.context
kind: source
language: java
name: TLS context usage in Java
description: >-
  Detects TLS context creation without a statically pinned protocol version: SSLContext.getInstance("TLS"),
  default socket factories, Apache HttpClient SSLContexts/SSLContextBuilder and Netty SslContextBuilder.
asset:
  type: protocol
  protocol: tls
match:
- call: javax.net.ssl.SSLContext.getInstance
  firstString: (TLS|SSL|Default|DTLS)$
- call: javax.net.ssl.SSLContext.getInstance
- call: javax.net.ssl.SSLContext.getDefault
- call: javax.net.ssl.SSLSocketFactory.getDefault
- call: javax.net.ssl.SSLServerSocketFactory.getDefault
- call: org.apache.http.ssl.SSLContexts.custom
- call: org.apache.http.ssl.SSLContexts.createDefault
- call: org.apache.http.ssl.SSLContexts.createSystemDefault
- call: org.apache.hc.core5.ssl.SSLContexts.custom
- call: org.apache.hc.core5.ssl.SSLContexts.createDefault
- call: org.apache.hc.core5.ssl.SSLContexts.createSystemDefault
- call: org.apache.http.ssl.SSLContextBuilder.create
- call: org.apache.hc.core5.ssl.SSLContextBuilder.create
- call: io.netty.handler.ssl.SslContextBuilder.forClient
- call: io.netty.handler.ssl.SslContextBuilder.forServer
