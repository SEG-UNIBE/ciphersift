id: java.prot.tls.context
kind: source
language: java
name: TLS context usage in Java
description: >-
  Detects TLS context creation without a statically pinned protocol version: SSLContext.getInstance("TLS"),
  default socket factories, Apache HttpClient SSLContexts/SSLContextBuilder and Netty SslContextBuilder.
asset:
  type: protocol
  protocol: tls
match:
- call: javax.net.ssl.SSLContext.getInstance
  firstString: (TLS|SSL|Default|DTLS)$
- call: javax.net.ssl.SSLContext.getInstance
- call: javax.net.ssl.SSLContext.getDefault
- call: javax.net.ssl.SSLSocketFactory.getDefault
- call: javax.net.ssl.SSLServerSocketFactory.getDefault
- call: org.apache.http.ssl.SSLContexts.custom
- call: org.apache.http.ssl.SSLContexts.createDefault
- call: org.apache.http.ssl.SSLContexts.createSystemDefault
- call: org.apache.hc.core5.ssl.SSLContexts.custom
- call: org.apache.hc.core5.ssl.SSLContexts.createDefault
- call: org.apache.hc.core5.ssl.SSLContexts.createSystemDefault
- call: org.apache.http.ssl.SSLContextBuilder.create
- call: org.apache.hc.core5.ssl.SSLContextBuilder.create
- call: io.netty.handler.ssl.SslContextBuilder.forClient
- call: io.netty.handler.ssl.SslContextBuilder.forServer
- new: okhttp3.ConnectionSpec.Builder
- field: okhttp3.ConnectionSpec.MODERN_TLS
- field: okhttp3.ConnectionSpec.COMPATIBLE_TLS
- field: okhttp3.ConnectionSpec.RESTRICTED_TLS
- field: okhttp3.CipherSuite.TLS_*
- field: okhttp3.CipherSuite.SSL_*
- call: okhttp3.CipherSuite.forJavaName
- call: okhttp3.TlsVersion.forJavaName
- method: cipherSuites
- method: tlsVersions
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:(?:TLS|SSL)_[A-Z0-9_]+|DTLSv1\.0|DTLSv1\.2|TLSv1\.1|TLSv1\.2|TLSv1\.3|SSLv3|TLSv1)$'
  feature: java-any-call
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:(?:TLS|SSL)_[A-Z0-9_]+|DTLS|SSL|TLS)$'
  feature: java-any-call-short
