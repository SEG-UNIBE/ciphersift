id: java.hash.sha1
kind: source
language: java
name: SHA-1 hash usage in Java
description: >-
  Detects SHA-1 via JCA MessageDigest, BouncyCastle SHA1Digest, commons-codec DigestUtils, Guava Hashing
  and Spring Security LdapShaPasswordEncoder / legacy ShaPasswordEncoder.
asset:
  type: algorithm
  primitive: hash
  family: SHA1
  securityLevel: 80
match:
- call: java.security.MessageDigest.getInstance
  firstString: SHA(-?1)?$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: SHA(-?1)?$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: SHA(-?1)?$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: SHA(-?1)?$
- new: org.bouncycastle.crypto.digests.SHA1Digest
- call: org.bouncycastle.crypto.digests.SHA1Digest.newInstance
- call: org.apache.commons.codec.digest.DigestUtils.sha1*
- call: org.apache.commons.codec.digest.DigestUtils.sha
- call: org.apache.commons.codec.digest.DigestUtils.shaHex
- call: org.apache.commons.codec.digest.DigestUtils.getSha1Digest
- call: org.apache.commons.codec.digest.DigestUtils.getShaDigest
- call: com.google.common.hash.Hashing.sha1
- new: org.springframework.security.crypto.password.LdapShaPasswordEncoder
- new: org.springframework.security.authentication.encoding.ShaPasswordEncoder
- new: org.bouncycastle.jcajce.provider.digest.SHA1.Digest
- new: java.security.spec.MGF1ParameterSpec
  firstString: SHA(-?1)?$
- field: java.security.spec.MGF1ParameterSpec.SHA1
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (SHA-1)$
