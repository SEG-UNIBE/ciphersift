id: java.hash.sha1
kind: source
language: java
name: SHA-1 hash usage in Java
description: >-
  Detects SHA-1 via JCA MessageDigest, BouncyCastle SHA1Digest, commons-codec DigestUtils, Guava Hashing
  and Spring Security LdapShaPasswordEncoder / legacy ShaPasswordEncoder.
asset:
  type: algorithm
  primitive: hash
  family: SHA1
  securityLevel: 80
match:
- call: java.security.MessageDigest.getInstance
  firstString: SHA(-?1)?$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: SHA(-?1)?$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: SHA(-?1)?$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: SHA(-?1)?$
- new: org.bouncycastle.crypto.digests.SHA1Digest
- call: org.bouncycastle.crypto.digests.SHA1Digest.newInstance
- call: org.apache.commons.codec.digest.DigestUtils.sha1*
- call: org.apache.commons.codec.digest.DigestUtils.sha
- call: org.apache.commons.codec.digest.DigestUtils.shaHex
- call: org.apache.commons.codec.digest.DigestUtils.getSha1Digest
- call: org.apache.commons.codec.digest.DigestUtils.getShaDigest
- call: com.google.common.hash.Hashing.sha1
- new: org.springframework.security.crypto.password.LdapShaPasswordEncoder
- new: org.springframework.security.authentication.encoding.ShaPasswordEncoder
- new: org.bouncycastle.jcajce.provider.digest.SHA1.Digest
- new: java.security.spec.MGF1ParameterSpec
  firstString: SHA(-?1)?$
- field: java.security.spec.MGF1ParameterSpec.SHA1
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (SHA-1)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.digests.SHA1InterleaveDigest
- call: org.bouncycastle.crypto.digests.SHA1InterleaveDigest.newInstance
- new: org.bouncycastle.jcajce.provider.digest.SHA1.SHA1Mac
- call: org.bouncycastle.crypto.util.DigestFactory.createSHA1
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2007/05/xmldsig-more\#sha1-rsa-MGF1|http://www\.w3\.org/2001/04/xmldsig-more\#ecdsa-sha1|http://www\.w3\.org/2001/04/xmldsig-more\#esign-sha1|http://www\.w3\.org/2000/09/xmldsig\#dsa-sha1|http://www\.w3\.org/2000/09/xmldsig\#rsa-sha1|http://www\.w3\.org/2009/xmlenc11\#mgf1sha1|http://www\.w3\.org/2000/09/xmldsig\#sha1|SHA1withECDSAinP1363Format|SHA1withDSAinP1363Format|SHA1withRSA/PSS|SHA1withECDSA|SHA1withDSA|SHA1withRSA|SHA-1)$'
  feature: java-any-call
