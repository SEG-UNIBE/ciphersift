id: java.sym.rc4
kind: source
language: java
name: RC4 usage in Java
description: Detects RC4/ARCFOUR via JCA and BouncyCastle RC4Engine.
asset:
  type: algorithm
  primitive: stream-cipher
  family: RC4
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (RC4|ARCFOUR|ARC4)(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: (RC4|ARCFOUR|ARC4)(/.*)?$
- new: javax.crypto.spec.SecretKeySpec
  firstString: (RC4|ARCFOUR|ARC4)(/.*)?$
- new: org.bouncycastle.crypto.engines.RC4Engine
- call: org.bouncycastle.crypto.engines.RC4Engine.newInstance
