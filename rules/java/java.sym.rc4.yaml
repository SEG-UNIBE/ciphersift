id: java.sym.rc4
kind: source
language: java
name: RC4 usage in Java
description: Detects RC4/ARCFOUR via JCA and BouncyCastle RC4Engine.
asset:
  type: algorithm
  primitive: stream-cipher
  family: RC4
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (RC4|ARCFOUR|ARC4)(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: (RC4|ARCFOUR|ARC4)(/.*)?$
- new: javax.crypto.spec.SecretKeySpec
  firstString: (RC4|ARCFOUR|ARC4)(/.*)?$
- new: org.bouncycastle.crypto.engines.RC4Engine
- call: org.bouncycastle.crypto.engines.RC4Engine.newInstance
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (RC4)$
# DECISIONS B-A3 (JCA standard-name gaps): Java SE 25 Standard Algorithm Names
# (https://docs.oracle.com/en/java/javase/25/docs/specs/security/standard-names.html)
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: (RC4|ARCFOUR|ARC4)$
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.rc4
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd128BitRC4
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd40BitRC4
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2001/04/xmldsig-more\#arcfour)$'
  feature: java-any-call
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:ARCFOUR|RC4)$'
  feature: java-any-call-short
