id: java.sym.aes.cfb
kind: source
language: java
name: AES-CFB usage in Java
description: Detects AES in CFB mode via JCA and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CFB
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)/CFB\d*(/.*)?$
- new: org.bouncycastle.crypto.modes.CFBBlockCipher
  argsText: AES|Rijndael
- call: org.bouncycastle.crypto.modes.CFBBlockCipher.newInstance
  argsText: AES|Rijndael
