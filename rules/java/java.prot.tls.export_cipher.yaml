id: java.prot.tls.export_cipher
kind: source
language: java
name: EXPORT TLS cipher suite in Java
description: Detects export-grade TLS cipher suites enabled via setEnabledCipherSuites/setCipherSuites.
asset:
  type: protocol
  subtype: export-cipher
  protocol: tls
match:
- method: setEnabledCipherSuites
  anyString: .*_EXPORT.*
- method: setCipherSuites
  anyString: .*_EXPORT.*
- method: ciphers
  anyString: .*_EXPORT.*
- method: cipherSuites
  anyString: .*_EXPORT.*
