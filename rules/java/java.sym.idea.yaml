id: java.sym.idea
kind: source
language: java
name: IDEA usage in Java
description: Detects the IDEA cipher via JCA (Cipher, KeyGenerator, SecretKeySpec) and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: IDEA
match:
- call: javax.crypto.Cipher.getInstance
  firstString: IDEA(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: IDEA$
- new: javax.crypto.spec.SecretKeySpec
  firstString: IDEA$
- new: org.bouncycastle.crypto.engines.IDEAEngine
- call: org.bouncycastle.crypto.engines.IDEAEngine.newInstance
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (IDEA/CBC/NoPadding)$
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.misc.MiscObjectIdentifiers.as_sys_sec_alg_ideaCBC
- field: org.bouncycastle.asn1.x509.X509ObjectIdentifiers.id_ea_rsa
- field: org.bouncycastle.cms.CMSAlgorithm.IDEA_CBC
