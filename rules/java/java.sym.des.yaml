id: java.sym.des
kind: source
language: java
name: DES usage in Java
description: >-
  Detects single DES via JCA (Cipher with non-ECB mode, KeyGenerator, SecretKeyFactory, SecretKeySpec,
  DESKeySpec), BouncyCastle DESEngine and commons-codec UnixCrypt.
asset:
  type: algorithm
  primitive: block-cipher
  family: DES
  securityLevel: 56
match:
- call: javax.crypto.Cipher.getInstance
