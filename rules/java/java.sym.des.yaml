id: java.sym.des
kind: source
language: java
name: DES usage in Java
description: >-
  Detects single DES via JCA (Cipher with non-ECB mode, KeyGenerator, SecretKeyFactory, SecretKeySpec,
  DESKeySpec), BouncyCastle DESEngine and commons-codec UnixCrypt.
asset:
  type: algorithm
  primitive: block-cipher
  family: DES
  securityLevel: 56
match:
- call: javax.crypto.Cipher.getInstance
  firstString: DES/(?!ECB(/|$))
- call: javax.crypto.KeyGenerator.getInstance
  firstString: DES$
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: DES$
- new: javax.crypto.spec.SecretKeySpec
  firstString: DES$
- new: javax.crypto.spec.DESKeySpec
- new: org.bouncycastle.crypto.engines.DESEngine
- call: org.bouncycastle.crypto.engines.DESEngine.newInstance
- call: org.apache.commons.codec.digest.UnixCrypt.crypt
- call: java.security.AlgorithmParameters.getInstance
  firstString: DES$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (DES/CBC/NoPadding)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.generators.DESKeyGenerator
- call: org.bouncycastle.crypto.generators.DESKeyGenerator.newInstance
- new: org.bouncycastle.crypto.params.DESParameters
- call: org.bouncycastle.crypto.params.DESParameters.newInstance
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.BrokePBEWithMD5AndDES
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.BrokePBEWithSHA1AndDES
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:DES)$'
  feature: java-any-call-short
