id: java.prot.tls.key_management
kind: source
language: java
name: TLS key / trust manager setup in Java
description: >-
  Detects JSSE key and trust manager factories (KeyManagerFactory / TrustManagerFactory, "PKIX", "SunX509"),
  which provide the key material and the certificate trust decisions of an SSLContext. They are TLS configuration,
  not certificate operations, so they are reported as a TLS protocol asset (version unknown).
asset:
  type: protocol
  protocol: tls
match:
- call: javax.net.ssl.KeyManagerFactory.getInstance
- call: javax.net.ssl.TrustManagerFactory.getInstance
