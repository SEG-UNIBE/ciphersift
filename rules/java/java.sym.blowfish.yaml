id: java.sym.blowfish
kind: source
language: java
name: Blowfish usage in Java
description: Detects the Blowfish cipher via JCA (Cipher, KeyGenerator, SecretKeySpec) and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: Blowfish
match:
- call: javax.crypto.Cipher.getInstance
  firstString: Blowfish(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: Blowfish$
- new: javax.crypto.spec.SecretKeySpec
  firstString: Blowfish$
- new: org.bouncycastle.crypto.engines.BlowfishEngine
- call: org.bouncycastle.crypto.engines.BlowfishEngine.newInstance
- call: java.security.AlgorithmParameters.getInstance
  firstString: Blowfish$
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.misc.MiscObjectIdentifiers.cryptlib_algorithm_blowfish_ECB
- field: org.bouncycastle.asn1.misc.MiscObjectIdentifiers.cryptlib_algorithm_blowfish_CBC
- field: org.bouncycastle.asn1.misc.MiscObjectIdentifiers.cryptlib_algorithm_blowfish_CFB
- field: org.bouncycastle.asn1.misc.MiscObjectIdentifiers.cryptlib_algorithm_blowfish_OFB
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:Blowfish)$'
  feature: java-any-call-short
