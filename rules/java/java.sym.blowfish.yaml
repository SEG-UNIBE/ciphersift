id: java.sym.blowfish
kind: source
language: java
name: Blowfish usage in Java
description: Detects the Blowfish cipher via JCA (Cipher, KeyGenerator, SecretKeySpec) and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: Blowfish
match:
- call: javax.crypto.Cipher.getInstance
  firstString: Blowfish(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: Blowfish$
- new: javax.crypto.spec.SecretKeySpec
  firstString: Blowfish$
- new: org.bouncycastle.crypto.engines.BlowfishEngine
- call: org.bouncycastle.crypto.engines.BlowfishEngine.newInstance
- call: java.security.AlgorithmParameters.getInstance
  firstString: Blowfish$
