id: java.kdf.pbe
kind: source
language: java
name: Password-based encryption (PBES1/PBES2) in Java
description: >-
  Detects JCA password-based encryption schemes (PBEWith<digest>And<cipher>, PBEWithHmac<sha>And<cipher>)
  via Cipher and SecretKeyFactory, and BouncyCastle PKCS12/OpenSSL PBE parameter generators.
asset:
  type: algorithm
  primitive: kdf
  family: PBE
match:
- call: javax.crypto.Cipher.getInstance
  firstString: PBEWith(MD[25]|SHA1?)And.*$
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: PBEWith(MD[25]|SHA1?)And.*$
- call: javax.crypto.Cipher.getInstance
  firstString: PBEWithHmacSHA.*$
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: PBEWithHmacSHA.*$
- new: org.bouncycastle.crypto.generators.PKCS12ParametersGenerator
- call: org.bouncycastle.crypto.generators.PKCS12ParametersGenerator.newInstance
- new: org.bouncycastle.crypto.generators.OpenSSLPBEParametersGenerator
- call: org.bouncycastle.crypto.generators.OpenSSLPBEParametersGenerator.newInstance
- new: org.bouncycastle.crypto.generators.PKCS5S1ParametersGenerator
- call: org.bouncycastle.crypto.generators.PKCS5S1ParametersGenerator.newInstance
- call: java.security.AlgorithmParameters.getInstance
  firstString: (PBE|PBES2|PBEWith.*)$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (PBES2)$
# DECISIONS B-J-JDK: remaining Java SE crypto classes and constants (Java SE 21 API); sources per entry in spec/java-api-additions.csv
- new: javax.crypto.spec.PBEParameterSpec
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.jcajce.provider.digest.GOST3411.PBEWithMacKeyFactory
- new: org.bouncycastle.jcajce.provider.digest.RIPEMD160.PBEWithHmac
- new: org.bouncycastle.jcajce.provider.digest.RIPEMD160.PBEWithHmacKeyFactory
- new: org.bouncycastle.jcajce.provider.digest.SHA1.PBEWithMacKeyFactory
- new: org.bouncycastle.jcajce.provider.digest.SHA256.PBEWithMacKeyFactory
- new: org.bouncycastle.jcajce.provider.digest.Tiger.PBEWithHashMac
- new: org.bouncycastle.jcajce.provider.digest.Tiger.PBEWithMacKeyFactory
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.BrokePBEWithMD5AndDES
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.BrokePBEWithSHA1AndDES
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.BrokePBEWithSHAAndDES2Key
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.BrokePBEWithSHAAndDES3Key
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.OldPBEWithSHAAndDES3Key
- new: org.bouncycastle.jce.provider.BrokenJCEBlockCipher.OldPBEWithSHAAndTwofish
- new: org.bouncycastle.jce.provider.BrokenPBE
- new: org.bouncycastle.operator.PBEMacCalculatorProvider
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithMD2AndDES_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithMD2AndRC2_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithMD5AndDES_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithMD5AndRC2_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHA1AndDES_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHA1AndRC2_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.id_PBES2
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pkcs_12PbeIds
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd128BitRC4
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd40BitRC4
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd3_KeyTripleDES_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd2_KeyTripleDES_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd128BitRC2_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd40BitRC2_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbewithSHAAnd40BitRC2_CBC
# DECISIONS B-J-JWT: JWT library algorithm constants and classes (jjwt 0.12.6, nimbus-jose-jwt 9.40, java-jwt 4.4.0); sources per entry in spec/java-api-additions.csv
- field: com.nimbusds.jose.JWEAlgorithm.PBES2_HS256_A128KW
- field: com.nimbusds.jose.JWEAlgorithm.PBES2_HS384_A192KW
- field: com.nimbusds.jose.JWEAlgorithm.PBES2_HS512_A256KW
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:PBES2-HS256\+A128KW|PBES2-HS384\+A192KW|PBES2-HS512\+A256KW|PBE)$'
  feature: java-any-call-short
