id: java.asym.ec
kind: source
language: java
name: Elliptic curve key usage in Java
description: >-
  Detects EC key pair generation, key factories and curve parameters (ECGenParameterSpec, ECParameterSpec,
  BouncyCastle ECKeyPairGenerator / named curve tables) where the use (ECDSA vs ECDH) is not determined
  by the call.
asset:
  type: algorithm
  family: EC
match:
- call: java.security.KeyPairGenerator.getInstance
  firstString: EC$
- call: java.security.KeyFactory.getInstance
  firstString: EC$
- call: java.security.AlgorithmParameters.getInstance
  firstString: EC$
- new: java.security.spec.ECGenParameterSpec
- new: java.security.spec.ECParameterSpec
- new: java.security.spec.ECPublicKeySpec
- new: java.security.spec.ECPrivateKeySpec
- new: org.bouncycastle.crypto.generators.ECKeyPairGenerator
- call: org.bouncycastle.crypto.generators.ECKeyPairGenerator.newInstance
- call: org.bouncycastle.jce.ECNamedCurveTable.getParameterSpec
- call: org.bouncycastle.asn1.x9.ECNamedCurveTable.getByName
- call: org.bouncycastle.crypto.ec.CustomNamedCurves.getByName
- call: org.bouncycastle.asn1.sec.SECNamedCurves.getByName
