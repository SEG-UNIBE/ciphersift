id: java.asym.ec
kind: source
language: java
name: Elliptic curve key usage in Java
description: >-
  Detects EC key pair generation, key factories and curve parameters (ECGenParameterSpec, ECParameterSpec,
  BouncyCastle ECKeyPairGenerator / named curve tables) where the use (ECDSA vs ECDH) is not determined
  by the call.
asset:
  type: algorithm
  family: EC
match:
- call: java.security.KeyPairGenerator.getInstance
  firstString: EC$
- call: java.security.KeyFactory.getInstance
  firstString: EC$
- call: java.security.AlgorithmParameters.getInstance
  firstString: EC$
- new: java.security.spec.ECGenParameterSpec
- new: java.security.spec.ECParameterSpec
- new: java.security.spec.ECPublicKeySpec
- new: java.security.spec.ECPrivateKeySpec
- new: org.bouncycastle.crypto.generators.ECKeyPairGenerator
- call: org.bouncycastle.crypto.generators.ECKeyPairGenerator.newInstance
- call: org.bouncycastle.jce.ECNamedCurveTable.getParameterSpec
- call: org.bouncycastle.asn1.x9.ECNamedCurveTable.getByName
- call: org.bouncycastle.crypto.ec.CustomNamedCurves.getByName
- call: org.bouncycastle.asn1.sec.SECNamedCurves.getByName
- new: java.security.spec.EllipticCurve
- new: java.security.spec.ECFieldFp
- new: java.security.spec.ECFieldF2m
- new: java.security.spec.ECPoint
- new: org.bouncycastle.crypto.params.ECDomainParameters
- new: org.bouncycastle.crypto.params.ECNamedDomainParameters
- new: org.bouncycastle.crypto.params.ECKeyGenerationParameters
- new: org.bouncycastle.crypto.params.ECPublicKeyParameters
- new: org.bouncycastle.crypto.params.ECPrivateKeyParameters
- new: org.bouncycastle.jce.spec.ECParameterSpec
- new: org.bouncycastle.jce.spec.ECNamedCurveParameterSpec
- new: org.bouncycastle.jce.spec.ECPublicKeySpec
- new: org.bouncycastle.jce.spec.ECPrivateKeySpec
- new: org.bouncycastle.math.ec.ECCurve.Fp
- new: org.bouncycastle.math.ec.ECCurve.F2m
- new: org.bouncycastle.math.ec.custom.sec.SecP128R1Curve
- new: org.bouncycastle.math.ec.custom.sec.SecP160K1Curve
- new: org.bouncycastle.math.ec.custom.sec.SecP160R1Curve
- new: org.bouncycastle.math.ec.custom.sec.SecP160R2Curve
