id: java.hash.md4
kind: source
language: java
name: MD4 hash usage in Java
description: Detects MD4 via JCA (BC provider), BouncyCastle and Spring Security Md4PasswordEncoder.
asset:
  type: algorithm
  primitive: hash
  family: MD4
  securityLevel: 64
match:
- call: java.security.MessageDigest.getInstance
  firstString: MD4$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: MD4$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: MD4$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: MD4$
- new: org.bouncycastle.crypto.digests.MD4Digest
- call: org.bouncycastle.crypto.digests.MD4Digest.newInstance
- new: org.springframework.security.crypto.password.Md4PasswordEncoder
- new: org.bouncycastle.jcajce.provider.digest.MD4.Digest
