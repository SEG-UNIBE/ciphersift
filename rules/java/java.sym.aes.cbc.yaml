id: java.sym.aes.cbc
kind: source
language: java
name: AES-CBC usage in Java
description: >-
  Detects AES in CBC mode via JCA, BouncyCastle CBCBlockCipher and Spring Security Encryptors.standard/text.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CBC
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)/CBC(/.*)?$
- new: org.bouncycastle.crypto.modes.CBCBlockCipher
  argsText: AES|Rijndael
- call: org.bouncycastle.crypto.modes.CBCBlockCipher.newInstance
  argsText: AES|Rijndael
- call: org.springframework.security.crypto.encrypt.Encryptors.standard
- call: org.springframework.security.crypto.encrypt.Encryptors.text
- call: org.springframework.security.crypto.encrypt.Encryptors.queryableText
- new: org.springframework.security.crypto.encrypt.AesBytesEncryptor
  argsText: ^\((?!.*GCM)
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (AES_128/CBC/NoPadding|AES_192/CBC/NoPadding|AES_256/CBC/NoPadding)$
