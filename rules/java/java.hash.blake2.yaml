id: java.hash.blake2
kind: source
language: java
name: BLAKE2 hash usage in Java
description: Detects BLAKE2b/BLAKE2s (and BLAKE3) via JCA (BC provider) and BouncyCastle digests.
asset:
  type: algorithm
  primitive: hash
  family: BLAKE2
match:
- call: java.security.MessageDigest.getInstance
  firstString: BLAKE2[bs]?(-\d+)?$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: BLAKE2[bs]?(-\d+)?$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: BLAKE2[bs]?(-\d+)?$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: BLAKE2[bs]?(-\d+)?$
- new: org.bouncycastle.crypto.digests.Blake2bDigest
- call: org.bouncycastle.crypto.digests.Blake2bDigest.newInstance
- new: org.bouncycastle.crypto.digests.Blake2sDigest
- call: org.bouncycastle.crypto.digests.Blake2sDigest.newInstance
- new: org.bouncycastle.crypto.digests.Blake2xsDigest
- call: org.bouncycastle.crypto.digests.Blake2xsDigest.newInstance
- new: org.bouncycastle.crypto.digests.Blake3Digest
- call: org.bouncycastle.crypto.digests.Blake3Digest.newInstance
- new: org.bouncycastle.jcajce.provider.digest.Blake2b.Blake2b160
- new: org.bouncycastle.jcajce.provider.digest.Blake2b.Blake2b256
- new: org.bouncycastle.jcajce.provider.digest.Blake2b.Blake2b384
- new: org.bouncycastle.jcajce.provider.digest.Blake2b.Blake2b512
- new: org.bouncycastle.jcajce.provider.digest.Blake2s.Blake2s128
- new: org.bouncycastle.jcajce.provider.digest.Blake2s.Blake2s160
- new: org.bouncycastle.jcajce.provider.digest.Blake2s.Blake2s224
- new: org.bouncycastle.jcajce.provider.digest.Blake2s.Blake2s256
- new: org.bouncycastle.jcajce.provider.digest.Blake3.Blake3_256
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (BLAKE2B-256|BLAKE2B-512|BLAKE2S-256)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.digests.Blake2bpDigest
- call: org.bouncycastle.crypto.digests.Blake2bpDigest.newInstance
- new: org.bouncycastle.crypto.digests.Blake2spDigest
- call: org.bouncycastle.crypto.digests.Blake2spDigest.newInstance
- new: org.bouncycastle.crypto.macs.Blake3Mac
- call: org.bouncycastle.crypto.macs.Blake3Mac.newInstance
- new: org.bouncycastle.crypto.params.Blake3Parameters
- call: org.bouncycastle.crypto.params.Blake3Parameters.newInstance
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
