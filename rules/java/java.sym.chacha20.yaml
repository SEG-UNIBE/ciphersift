id: java.sym.chacha20
kind: source
language: java
name: ChaCha20 stream cipher usage in Java
description: >-
  Detects the raw ChaCha20 stream cipher via JCA (Cipher, KeyGenerator, SecretKeySpec, ChaCha20ParameterSpec)
  and BouncyCastle ChaChaEngine/ChaCha7539Engine.
asset:
  type: algorithm
  primitive: stream-cipher
  family: ChaCha20
match:
- call: javax.crypto.Cipher.getInstance
  firstString: X?ChaCha20?(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: X?ChaCha20$
- new: javax.crypto.spec.SecretKeySpec
  firstString: X?ChaCha20$
- new: javax.crypto.spec.ChaCha20ParameterSpec
- new: org.bouncycastle.crypto.engines.ChaChaEngine
- call: org.bouncycastle.crypto.engines.ChaChaEngine.newInstance
- new: org.bouncycastle.crypto.engines.ChaCha7539Engine
- call: org.bouncycastle.crypto.engines.ChaCha7539Engine.newInstance
- new: org.bouncycastle.crypto.engines.XSalsa20Engine
- call: org.bouncycastle.crypto.engines.XSalsa20Engine.newInstance
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.engines.XChaCha20Engine
- call: org.bouncycastle.crypto.engines.XChaCha20Engine.newInstance
- new: org.bouncycastle.crypto.modes.XChaCha20Poly1305
- call: org.bouncycastle.crypto.modes.XChaCha20Poly1305.newInstance
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2021/04/xmldsig-more\#chacha20poly1305|http://www\.w3\.org/2021/04/xmldsig-more\#chacha20|TLS_CHACHA20_POLY1305_SHA256|ChaCha20-Poly1305)$'
  feature: java-any-call
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:ChaCha20)$'
  feature: java-any-call-short
