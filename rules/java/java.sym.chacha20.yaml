id: java.sym.chacha20
kind: source
language: java
name: ChaCha20 stream cipher usage in Java
description: >-
  Detects the raw ChaCha20 stream cipher via JCA (Cipher, KeyGenerator, SecretKeySpec, ChaCha20ParameterSpec)
  and BouncyCastle ChaChaEngine/ChaCha7539Engine.
asset:
  type: algorithm
  primitive: stream-cipher
  family: ChaCha20
match:
- call: javax.crypto.Cipher.getInstance
  firstString: X?ChaCha20?(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: X?ChaCha20$
- new: javax.crypto.spec.SecretKeySpec
  firstString: X?ChaCha20$
- new: javax.crypto.spec.ChaCha20ParameterSpec
- new: org.bouncycastle.crypto.engines.ChaChaEngine
- call: org.bouncycastle.crypto.engines.ChaChaEngine.newInstance
- new: org.bouncycastle.crypto.engines.ChaCha7539Engine
- call: org.bouncycastle.crypto.engines.ChaCha7539Engine.newInstance
- new: org.bouncycastle.crypto.engines.XSalsa20Engine
- call: org.bouncycastle.crypto.engines.XSalsa20Engine.newInstance
