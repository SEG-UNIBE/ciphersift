id: java.sym.sm4
kind: source
language: java
name: SM4 usage in Java
description: Detects the SM4 cipher via JCA (Cipher, KeyGenerator, SecretKeySpec) and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: SM4
match:
- call: javax.crypto.Cipher.getInstance
  firstString: SM4(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: SM4$
- new: javax.crypto.spec.SecretKeySpec
  firstString: SM4$
- new: org.bouncycastle.crypto.engines.SM4Engine
- call: org.bouncycastle.crypto.engines.SM4Engine.newInstance
