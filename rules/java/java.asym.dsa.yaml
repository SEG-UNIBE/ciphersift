id: java.asym.dsa
kind: source
language: java
name: DSA usage in Java
description: Detects DSA key generation and signatures via JCA and BouncyCastle.
asset:
  type: algorithm
  primitive: signature
  family: DSA
match:
- call: java.security.KeyPairGenerator.getInstance
  firstString: DSA$
- call: java.security.KeyFactory.getInstance
  firstString: DSA$
- call: java.security.Signature.getInstance
  firstString: (.*withDSA|DSA)$
- new: org.bouncycastle.operator.jcajce.JcaContentSignerBuilder
  firstString: (.*withDSA|DSA)$
- call: java.security.AlgorithmParameterGenerator.getInstance
  firstString: DSA$
- call: java.security.AlgorithmParameters.getInstance
  firstString: DSA$
- new: java.security.spec.DSAParameterSpec
- new: java.security.spec.DSAPublicKeySpec
- new: java.security.spec.DSAPrivateKeySpec
- new: org.bouncycastle.crypto.signers.DSASigner
- call: org.bouncycastle.crypto.signers.DSASigner.newInstance
- new: org.bouncycastle.crypto.generators.DSAKeyPairGenerator
- call: org.bouncycastle.crypto.generators.DSAKeyPairGenerator.newInstance
- new: org.bouncycastle.crypto.generators.DSAParametersGenerator
- call: org.bouncycastle.crypto.generators.DSAParametersGenerator.newInstance
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (DSA|SHA1withDSA|SHA224withDSA|SHA256withDSA|SHA384withDSA|SHA512withDSA|SHA3-224withDSA|SHA3-256withDSA|SHA3-384withDSA|SHA3-512withDSA)$
