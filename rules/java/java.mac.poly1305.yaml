# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.java.mac.poly1305.yaml; do not edit by hand.
id: java.mac.poly1305
kind: source
language: java
name: Poly1305 MAC usage in Java
description: Detects the Poly1305 one-time authenticator via JCA Mac (BC provider) and BouncyCastle Poly1305.
asset:
  type: algorithm
  primitive: mac
  family: Poly1305
match:
- call: javax.crypto.Mac.getInstance
  firstString: Poly1305.*$
- new: org.bouncycastle.crypto.macs.Poly1305
- call: org.bouncycastle.crypto.macs.Poly1305.newInstance
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2021/04/xmldsig-more\#chacha20poly1305|TLS_CHACHA20_POLY1305_SHA256|ChaCha20-Poly1305)$'
  feature: java-any-call
