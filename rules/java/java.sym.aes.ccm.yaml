id: java.sym.aes.ccm
kind: source
language: java
name: AES-CCM usage in Java
description: Detects AES in CCM mode via JCA (BC provider) and BouncyCastle CCMBlockCipher.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CCM
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)/CCM(/.*)?$
- new: org.bouncycastle.crypto.modes.CCMBlockCipher
- call: org.bouncycastle.crypto.modes.CCMBlockCipher.newInstance
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (AES_128/CCM/NoPadding|AES_192/CCM/NoPadding|AES_256/CCM/NoPadding)$
