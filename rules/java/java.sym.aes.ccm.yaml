id: java.sym.aes.ccm
kind: source
language: java
name: AES-CCM usage in Java
description: Detects AES in CCM mode via JCA (BC provider) and BouncyCastle CCMBlockCipher.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CCM
match:
- call: javax.crypto.Cipher.getInstance
