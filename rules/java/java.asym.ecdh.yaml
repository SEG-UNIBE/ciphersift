- new: org.bouncycastle.crypto.generators.X448KeyPairGenerator
- call: org.bouncycastle.crypto.generators.X448KeyPairGenerator.newInstance
- call: com.google.crypto.tink.KeyTemplates.get
  firstString: (ECIES_P256|DHKEM_X25519|DHKEM_P256|DHKEM_P384|DHKEM_P521).*$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (ECDH|X25519|X448|ECMQV)$
# DECISIONS B-A3 (JCA standard-name gaps): Java SE 25 Standard Algorithm Names
# (https://docs.oracle.com/en/java/javase/25/docs/specs/security/standard-names.html): KEM DHKEM is the DH-based
# KEM of RFC 9180, defined only over P-256, P-384, P-521, X25519 and X448 (RFC 9180 section 7.1), so EC, not DH
- call: javax.crypto.KEM.getInstance
  firstString: DHKEM$
