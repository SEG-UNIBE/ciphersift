id: java.asym.ecdh
kind: source
language: java
name: ECDH / X25519 key agreement in Java
description: >-
  Detects elliptic-curve key agreement (ECDH, X25519, X448) via JCA KeyAgreement/KeyPairGenerator/KeyFactory/NamedParameterSpec,
  BouncyCastle agreements and Tink hybrid (ECIES/HPKE) templates.
asset:
  type: algorithm
  primitive: key-agree
  family: EC
match:
- call: javax.crypto.KeyAgreement.getInstance
  firstString: (ECDH|ECDHC|ECCDH|ECMQV|X25519|X448|XDH)$
- call: java.security.KeyPairGenerator.getInstance
  firstString: (ECDH|ECDHC|ECCDH|ECMQV|X25519|X448|XDH)$
- call: java.security.KeyFactory.getInstance
  firstString: (ECDH|ECDHC|ECCDH|ECMQV|X25519|X448|XDH)$
- new: java.security.spec.NamedParameterSpec
  firstString: (X25519|X448)$
- field: java.security.spec.NamedParameterSpec.X25519
- field: java.security.spec.NamedParameterSpec.X448
- new: java.security.spec.XECPublicKeySpec
- new: java.security.spec.XECPrivateKeySpec
- new: org.bouncycastle.crypto.agreement.ECDHBasicAgreement
- call: org.bouncycastle.crypto.agreement.ECDHBasicAgreement.newInstance
- new: org.bouncycastle.crypto.agreement.ECDHCBasicAgreement
- call: org.bouncycastle.crypto.agreement.ECDHCBasicAgreement.newInstance
- new: org.bouncycastle.crypto.agreement.X25519Agreement
- call: org.bouncycastle.crypto.agreement.X25519Agreement.newInstance
