id: java.hash.md5
kind: source
language: java
name: MD5 hash usage in Java
description: >-
  Detects MD5 via JCA MessageDigest, BouncyCastle MD5Digest, commons-codec DigestUtils/Md5Crypt, Guava
  Hashing, Spring DigestUtils and legacy Spring Security Md5PasswordEncoder.
asset:
  type: algorithm
  primitive: hash
  family: MD5
  securityLevel: 64
match:
- call: java.security.MessageDigest.getInstance
  firstString: MD5$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: MD5$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: MD5$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: MD5$
- new: org.bouncycastle.crypto.digests.MD5Digest
- call: org.bouncycastle.crypto.digests.MD5Digest.newInstance
- call: org.apache.commons.codec.digest.DigestUtils.md5*
- call: org.apache.commons.codec.digest.DigestUtils.getMd5Digest
- call: org.apache.commons.codec.digest.Md5Crypt.md5Crypt
- call: org.apache.commons.codec.digest.Md5Crypt.apr1Crypt
- call: com.google.common.hash.Hashing.md5
- call: org.springframework.util.DigestUtils.md5*
- call: org.springframework.util.DigestUtils.appendMd5DigestAsHex
- new: org.springframework.security.authentication.encoding.Md5PasswordEncoder
- new: org.bouncycastle.jcajce.provider.digest.MD5.Digest
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (MD5)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- call: org.bouncycastle.crypto.util.DigestFactory.createMD5
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.md5WithRSAEncryption
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.md5
- field: org.bouncycastle.asn1.gm.GMObjectIdentifiers.sm2encrypt_with_md5
- field: org.bouncycastle.asn1.oiw.OIWObjectIdentifiers.md5WithRSA
- field: org.bouncycastle.cms.CMSAlgorithm.MD5
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2007/05/xmldsig-more\#md5-rsa-MGF1|http://www\.w3\.org/2001/04/xmldsig-more\#rsa-md5|http://www\.w3\.org/2001/04/xmldsig-more\#md5|MD5withECDSAinP1363Format|MD5withDSAinP1363Format|MD5withRSA/PSS|MD5withECDSA|MD5withDSA|MD5withRSA|MD5)$'
  feature: java-any-call
