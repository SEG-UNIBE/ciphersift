id: java.jca.secretkeyspec.unresolved
kind: source
language: java
name: SecretKeySpec with unresolved algorithm in Java
description: Fallback for new SecretKeySpec(key, ...) whose algorithm argument cannot be resolved statically or
  is not covered by a specific rule. Only reported when no specific rule matches the constructor.
asset:
  type: algorithm
match:
- new: javax.crypto.spec.SecretKeySpec
