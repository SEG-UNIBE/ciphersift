id: java.rand.prng.insecure
kind: source
language: java
name: Non-cryptographic PRNG usage in Java
description: >-
  Weakness indicator, not a cryptographic algorithm: detects the non-cryptographic PRNGs java.util.Random,
  Math.random, ThreadLocalRandom, SplittableRandom, commons-lang RandomStringUtils and Bouncy Castle's
  FixedSecureRandom (fixed caller-supplied bytes, for tests) wherever they are
  used (also in tests and for non-security purposes). They are not suitable for keys, IVs, nonces or tokens.
  Asset type related-crypto-material, subtype prng-insecure; components carry the property
  ciphersift:indicator=weakness; they are reported only with --weakness-indicators.
indicator: weakness
asset:
  type: related-crypto-material
  subtype: prng-insecure
match:
- new: java.util.Random
- call: java.lang.Math.random
- call: java.util.concurrent.ThreadLocalRandom.current
- new: java.util.SplittableRandom
- call: org.apache.commons.lang3.RandomStringUtils.random*
- call: org.apache.commons.lang.RandomStringUtils.random*
# DECISIONS B-J-BC2 (review): Bouncy Castle FixedSecureRandom returns fixed, caller-supplied bytes (a test helper,
# https://downloads.bouncycastle.org/java/docs/bcprov-jdk18on-javadoc/org/bouncycastle/crypto/prng/FixedSecureRandom.html)
- new: org.bouncycastle.crypto.prng.FixedSecureRandom
