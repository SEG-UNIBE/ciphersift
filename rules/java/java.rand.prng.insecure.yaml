id: java.rand.prng.insecure
kind: source
language: java
name: Non-cryptographic PRNG usage in Java
description: >-
  Weakness indicator, not a cryptographic algorithm: detects the non-cryptographic PRNGs java.util.Random,
  Math.random, ThreadLocalRandom, SplittableRandom and commons-lang RandomStringUtils wherever they are
  used (also in tests and for non-security purposes). They are not suitable for keys, IVs, nonces or tokens.
  Asset type related-crypto-material, subtype prng-insecure; filter on that subtype or the rule id to
  drop them from an algorithm inventory.
