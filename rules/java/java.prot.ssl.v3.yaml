id: java.prot.ssl.v3
kind: source
language: java
name: SSL 3.0 usage in Java
description: Detects SSLv3 requested or enabled via JSSE APIs.
asset:
  type: protocol
  protocol: tls
  version: '3.0'
match:
- call: javax.net.ssl.SSLContext.getInstance
  firstString: SSLv3$
- method: setEnabledProtocols
  anyString: (.*,\s*)?SSLv3(\s*,.*)?$
- method: setProtocols
  anyString: (.*,\s*)?SSLv3(\s*,.*)?$
- method: protocols
  anyString: (.*,\s*)?SSLv3(\s*,.*)?$
- call: java.lang.System.setProperty
  anyString: (.*,\s*)?SSLv3(\s*,.*)?$
  stringContains:
  - protocols
- field: okhttp3.TlsVersion.SSL_3_0
- method: tlsVersions
  anyString: (.*,\s*)?SSLv3(\s*,.*)?$
