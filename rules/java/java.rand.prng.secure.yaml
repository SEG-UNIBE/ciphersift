id: java.rand.prng.secure
kind: source
language: java
name: Cryptographically secure PRNG usage in Java
description: Detects java.security.SecureRandom and Spring Security KeyGenerators.secureRandom.
asset:
  type: algorithm
  subtype: prng-secure
match:
- new: java.security.SecureRandom
- call: java.security.SecureRandom.getInstance
  param:
    index: 0
- call: java.security.SecureRandom.getInstanceStrong
- call: org.springframework.security.crypto.keygen.KeyGenerators.secureRandom
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:SecureRandom\.[\w.-]+|(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:NativePRNGNonBlocking|NativePRNGBlocking|Windows-PRNG|NativePRNG|SHA1PRNG|DRBG))$'
  feature: java-any-call
