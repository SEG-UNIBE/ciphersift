id: java.mac.hmac
kind: source
language: java
name: HMAC usage in Java
description: >-
  Detects HMAC via JCA Mac/KeyGenerator/SecretKeySpec, BouncyCastle HMac, commons-codec HmacUtils, Guava
  Hashing, Tink HMAC templates and HMAC-based JWT algorithms (auth0, jjwt, Nimbus).
asset:
  type: algorithm
  primitive: mac
  family: HMAC
match:
- call: javax.crypto.Mac.getInstance
  firstString: Hmac.*$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: Hmac.*$
- new: javax.crypto.spec.SecretKeySpec
  firstString: Hmac.*$
- new: org.bouncycastle.crypto.macs.HMac
- call: org.bouncycastle.crypto.macs.HMac.newInstance
- new: org.apache.commons.codec.digest.HmacUtils
- call: org.apache.commons.codec.digest.HmacUtils.hmac*
- call: org.apache.commons.codec.digest.HmacUtils.getHmac*
- call: org.apache.commons.codec.digest.HmacUtils.getInitializedMac
- call: com.google.common.hash.Hashing.hmac*
- call: com.google.crypto.tink.KeyTemplates.get
  firstString: HMAC_SHA(256|512).*$
- call: com.auth0.jwt.algorithms.Algorithm.HMAC*
- field: io.jsonwebtoken.SignatureAlgorithm.HS*
- field: io.jsonwebtoken.Jwts.SIG.HS*
- call: io.jsonwebtoken.security.Keys.hmacShaKeyFor
- field: com.nimbusds.jose.JWSAlgorithm.HS*
- new: com.nimbusds.jose.crypto.MACSigner
- new: com.nimbusds.jose.crypto.MACVerifier
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (HmacSHA1|HmacSHA224|HmacSHA256|HmacSHA384|HmacSHA512|HmacSHA512/224|HmacSHA512/256|HmacSHA3-224|HmacSHA3-256|HmacSHA3-384|HmacSHA3-512)$
