id: java.kdf.hkdf
kind: source
language: java
name: HKDF key derivation in Java
description: Detects HKDF via JCA KDF (Java 24+), BouncyCastle HKDFBytesGenerator and Tink Hkdf.
asset:
  type: algorithm
  primitive: kdf
  family: HKDF
match:
- call: javax.crypto.KDF.getInstance
