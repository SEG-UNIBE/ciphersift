id: java.prot.tls.null_cipher
kind: source
language: java
name: NULL or anonymous TLS cipher suite in Java
description: >-
  Detects NULL-encryption or anonymous TLS cipher suites enabled via setEnabledCipherSuites/setCipherSuites.
asset:
  type: protocol
  subtype: null-cipher
  protocol: tls
match:
- method: setEnabledCipherSuites
  anyString: .*(_NULL_|_anon_|_NULL$).*
- method: setCipherSuites
  anyString: .*(_NULL_|_anon_|_NULL$).*
- method: ciphers
  anyString: .*(_NULL_|_anon_|_NULL$).*
