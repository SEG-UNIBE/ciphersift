id: java.prot.tls.rc4
kind: source
language: java
name: RC4 TLS cipher suite in Java
description: Detects RC4-based TLS cipher suites enabled via setEnabledCipherSuites/setCipherSuites.
asset:
  type: protocol
  subtype: rc4-cipher
  protocol: tls
match:
- method: setEnabledCipherSuites
  anyString: .*_RC4_.*
- method: setCipherSuites
  anyString: .*_RC4_.*
- method: ciphers
  anyString: .*_RC4_.*
- method: cipherSuites
  anyString: .*_RC4_.*
