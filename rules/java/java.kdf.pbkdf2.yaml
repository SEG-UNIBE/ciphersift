id: java.kdf.pbkdf2
kind: source
language: java
name: PBKDF2 key derivation in Java
description: >-
  Detects PBKDF2 via JCA SecretKeyFactory (PBKDF2WithHmac*), PBEKeySpec with salt and iteration count,
  BouncyCastle PKCS5S2ParametersGenerator and Spring Security Pbkdf2PasswordEncoder.
asset:
  type: algorithm
  primitive: kdf
  family: PBKDF2
match:
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: PBKDF2(With.*)?$
- new: javax.crypto.spec.PBEKeySpec
  argsText: ^\(([^,]+,){2,}
- new: org.bouncycastle.crypto.generators.PKCS5S2ParametersGenerator
- call: org.bouncycastle.crypto.generators.PKCS5S2ParametersGenerator.newInstance
- new: org.springframework.security.crypto.password.Pbkdf2PasswordEncoder
- call: org.springframework.security.crypto.password.Pbkdf2PasswordEncoder.defaultsFor*
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (PBKDF2)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.util.PBKDF2Config
- call: org.bouncycastle.crypto.util.PBKDF2Config.newInstance
- new: org.bouncycastle.jcajce.spec.PBKDF2KeySpec
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2009/xmlenc11\#pbkdf2|PBKDF2WithHmacSHA512/224|PBKDF2WithHmacSHA512/256|PBKDF2WithHmacSHA224|PBKDF2WithHmacSHA256|PBKDF2WithHmacSHA384|PBKDF2WithHmacSHA512|PBKDF2WithHmacSHA1|PBKDF2WithHmacMD5)$'
  feature: java-any-call
