# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.java.kdf.pbkdf2.yaml; do not edit by hand.
id: java.kdf.pbkdf2
kind: source
language: java
name: PBKDF2 key derivation in Java
description: >-
  Detects PBKDF2 via JCA SecretKeyFactory (PBKDF2WithHmac*), PBEKeySpec with salt and iteration count,
  BouncyCastle PKCS5S2ParametersGenerator and Spring Security Pbkdf2PasswordEncoder.
asset:
  type: algorithm
  primitive: kdf
  family: PBKDF2
match:
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: PBKDF2With.*$
- new: javax.crypto.spec.PBEKeySpec
  argsText: ^\(([^,]+,){2,}
- new: org.bouncycastle.crypto.generators.PKCS5S2ParametersGenerator
- call: org.bouncycastle.crypto.generators.PKCS5S2ParametersGenerator.newInstance
- new: org.springframework.security.crypto.password.Pbkdf2PasswordEncoder
- call: org.springframework.security.crypto.password.Pbkdf2PasswordEncoder.defaultsFor*
