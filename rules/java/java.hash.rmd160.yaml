id: java.hash.rmd160
kind: source
language: java
name: RIPEMD-160 hash usage in Java
description: Detects RIPEMD-160 via JCA (BC provider) and BouncyCastle RIPEMD160Digest.
asset:
  type: algorithm
  primitive: hash
  family: RIPEMD160
  securityLevel: 80
match:
- call: java.security.MessageDigest.getInstance
  firstString: RIPEMD-?160$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: RIPEMD-?160$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: RIPEMD-?160$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: RIPEMD-?160$
- new: org.bouncycastle.crypto.digests.RIPEMD160Digest
- call: org.bouncycastle.crypto.digests.RIPEMD160Digest.newInstance
- new: org.bouncycastle.jcajce.provider.digest.RIPEMD160.Digest
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.teletrust.TeleTrusTObjectIdentifiers.ripemd160
- field: org.bouncycastle.asn1.teletrust.TeleTrusTObjectIdentifiers.ecSignWithRipemd160
- field: org.bouncycastle.asn1.gm.GMObjectIdentifiers.sm2encrypt_with_rmd160
- field: org.bouncycastle.asn1.gm.GMObjectIdentifiers.sm2sign_with_rmd160
- field: org.bouncycastle.asn1.x509.X509ObjectIdentifiers.ripemd160
- field: org.bouncycastle.asn1.x509.X509ObjectIdentifiers.ripemd160WithRSAEncryption
- field: org.bouncycastle.cms.CMSAlgorithm.RIPEMD160
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2007/05/xmldsig-more\#ripemd160-rsa-MGF1|http://www\.w3\.org/2007/05/xmldsig-more\#ecdsa-ripemd160|http://www\.w3\.org/2001/04/xmldsig-more\#hmac-ripemd160|http://www\.w3\.org/2001/04/xmldsig-more\#rsa-ripemd160|http://www\.w3\.org/2001/04/xmlenc\#ripemd160)$'
  feature: java-any-call
