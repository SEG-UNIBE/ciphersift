id: java.cert.hostname_verification.disabled
kind: source
language: java
name: TLS hostname verification disabled in Java
description: >-
  Detects HostnameVerifier implementations that accept every host, allow-all verifiers of Apache HttpClient
  and lambdas returning true passed to setHostnameVerifier / hostnameVerifier.
asset:
  type: related-crypto-material
  subtype: hostname-verification-disabled
match:
- override: verify
  inType:
  - HostnameVerifier
  body: ^\{\s*return\s+true\s*;\s*\}$
- method: setHostnameVerifier
  argsText: ->\s*(\{\s*return\s+)?true|ALLOW_ALL
- method: setDefaultHostnameVerifier
  argsText: ->\s*(\{\s*return\s+)?true|ALLOW_ALL
- method: hostnameVerifier
  argsText: ->\s*(\{\s*return\s+)?true
- new: org.apache.http.conn.ssl.NoopHostnameVerifier
- field: org.apache.http.conn.ssl.NoopHostnameVerifier.INSTANCE
- new: org.apache.hc.client5.http.ssl.NoopHostnameVerifier
- field: org.apache.hc.client5.http.ssl.NoopHostnameVerifier.INSTANCE
- new: org.apache.http.conn.ssl.AllowAllHostnameVerifier
- field: org.apache.http.conn.ssl.SSLSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
- field: org.apache.http.conn.ssl.SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
