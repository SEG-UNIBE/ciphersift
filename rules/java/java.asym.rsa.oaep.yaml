id: java.asym.rsa.oaep
kind: source
language: java
name: RSA-OAEP encryption in Java
description: >-
  Detects RSA encryption with OAEP padding via JCA Cipher/OAEPParameterSpec and BouncyCastle OAEPEncoding.
asset:
  type: algorithm
  primitive: pke
  family: RSA
match:
- call: javax.crypto.Cipher.getInstance
  firstString: RSA/(ECB|NONE)/OAEP.*$
- new: javax.crypto.spec.OAEPParameterSpec
- call: java.security.AlgorithmParameters.getInstance
  firstString: OAEP$
- new: org.bouncycastle.crypto.encodings.OAEPEncoding
- call: org.bouncycastle.crypto.encodings.OAEPEncoding.newInstance
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (OAEP)$
