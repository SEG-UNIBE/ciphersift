id: java.cert.x509
kind: source
language: java
name: X.509 certificate operations in Java
description: >-
  Detects X.509 certificate parsing and path validation via JCA, and certificate/CSR building via BouncyCastle
  PKIX.
asset:
  type: algorithm
  subtype: x509
match:
- call: java.security.cert.CertificateFactory.getInstance
- call: java.security.cert.CertPathValidator.getInstance
- call: java.security.cert.CertPathBuilder.getInstance
- new: org.bouncycastle.cert.X509v3CertificateBuilder
- new: org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder
- new: org.bouncycastle.cert.X509v1CertificateBuilder
- new: org.bouncycastle.cert.jcajce.JcaX509CertificateConverter
- new: org.bouncycastle.pkcs.PKCS10CertificationRequestBuilder
- new: org.bouncycastle.pkcs.jcajce.JcaPKCS10CertificationRequestBuilder
- new: org.bouncycastle.cert.X509v2CRLBuilder
- new: org.bouncycastle.openssl.PEMParser
- new: java.security.cert.PKIXParameters
- new: java.security.cert.PKIXBuilderParameters
- new: java.security.cert.TrustAnchor
- call: java.security.cert.CertStore.getInstance
- new: org.bouncycastle.cert.X509CertificateHolder
- new: org.bouncycastle.cert.jcajce.JcaX509CertificateHolder
- new: org.bouncycastle.cert.X509CRLHolder
- new: org.bouncycastle.cert.jcajce.JcaX509CRLHolder
- new: org.bouncycastle.cert.jcajce.JcaCertStore
- new: org.bouncycastle.cert.jcajce.JcaX509CRLConverter
- new: org.bouncycastle.cert.jcajce.JcaX509v1CertificateBuilder
- new: org.bouncycastle.cert.X509v2AttributeCertificateBuilder
# DECISIONS B-J-JDK: remaining Java SE crypto classes and constants (Java SE 21 API); sources per entry in spec/java-api-additions.csv
- new: java.security.cert.CertPath
- new: java.security.cert.CollectionCertStoreParameters
- new: java.security.cert.LDAPCertStoreParameters
- new: java.security.cert.PKIXRevocationChecker
- new: java.security.cert.URICertStoreParameters
- new: java.security.cert.X509CRLSelector
- new: java.security.cert.X509CertSelector
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.cert.ocsp.BasicOCSPRespBuilder
- new: org.bouncycastle.cert.ocsp.CertificateID
- new: org.bouncycastle.cert.ocsp.OCSPReqBuilder
- new: org.bouncycastle.cert.ocsp.jcajce.JcaCertificateID
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:X\.509)$'
  feature: java-any-call
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:PKIX)$'
  feature: java-any-call-short
