id: java.sym.aes.ofb
kind: source
language: java
name: AES-OFB usage in Java
description: Detects AES in OFB mode via JCA and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: OFB
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)/OFB\d*(/.*)?$
- new: org.bouncycastle.crypto.modes.OFBBlockCipher
  argsText: AES|Rijndael
- call: org.bouncycastle.crypto.modes.OFBBlockCipher.newInstance
  argsText: AES|Rijndael
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (AES_128/OFB/NoPadding|AES_192/OFB/NoPadding|AES_256/OFB/NoPadding)$
