id: java.sym.rc2
kind: source
language: java
name: RC2 usage in Java
description: Detects the RC2 cipher via JCA (Cipher, KeyGenerator, SecretKeySpec) and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: RC2
match:
- call: javax.crypto.Cipher.getInstance
  firstString: RC2(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: RC2$
- new: javax.crypto.spec.SecretKeySpec
  firstString: RC2$
- new: org.bouncycastle.crypto.engines.RC2Engine
- call: org.bouncycastle.crypto.engines.RC2Engine.newInstance
- call: java.security.AlgorithmParameters.getInstance
  firstString: RC2$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (RC2/CBC/NoPadding)$
