id: java.sym.chacha20poly1305
kind: source
language: java
name: ChaCha20-Poly1305 usage in Java
description: Detects ChaCha20-Poly1305 AEAD via JCA (Java 11+), BouncyCastle ChaCha20Poly1305 and Tink.
asset:
  type: algorithm
  primitive: stream-cipher
  family: ChaCha20
  variant: Poly1305
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (X?ChaCha20-Poly1305)(/.*)?$
- new: org.bouncycastle.crypto.modes.ChaCha20Poly1305
- call: org.bouncycastle.crypto.modes.ChaCha20Poly1305.newInstance
- call: com.google.crypto.tink.KeyTemplates.get
  firstString: X?CHACHA20_POLY1305(_RAW)?$
- new: com.google.crypto.tink.subtle.ChaCha20Poly1305
- new: com.google.crypto.tink.subtle.XChaCha20Poly1305
- new: com.google.crypto.tink.aead.internal.InsecureNonceChaCha20Poly1305
