id: java.sym.aes.ctr
kind: source
language: java
name: AES-CTR usage in Java
description: Detects AES in CTR mode via JCA, BouncyCastle SICBlockCipher and Tink AES-CTR-HMAC templates.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CTR
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)/CTR(/.*)?$
- new: org.bouncycastle.crypto.modes.SICBlockCipher
  argsText: AES|Rijndael
- call: org.bouncycastle.crypto.modes.SICBlockCipher.newInstance
  argsText: AES|Rijndael
- call: com.google.crypto.tink.KeyTemplates.get
  firstString: AES(128|256)_CTR_HMAC_SHA256.*$
