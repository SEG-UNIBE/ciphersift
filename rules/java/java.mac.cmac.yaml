id: java.mac.cmac
kind: source
language: java
name: AES-CMAC usage in Java
description: Detects AES-CMAC via JCA Mac (BC provider), BouncyCastle CMac and Tink AES-CMAC templates.
asset:
  type: algorithm
  primitive: mac
  family: AES
match:
- call: javax.crypto.Mac.getInstance
  firstString: AES-?CMAC$
- new: org.bouncycastle.crypto.macs.CMac
- call: org.bouncycastle.crypto.macs.CMac.newInstance
- call: com.google.crypto.tink.KeyTemplates.get
