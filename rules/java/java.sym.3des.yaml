id: java.sym.3des
kind: source
language: java
name: Triple-DES usage in Java
description: >-
  Detects 3DES (DESede/TripleDES) via JCA (non-ECB Cipher, DESedeWrap, KeyGenerator, SecretKeyFactory,
  SecretKeySpec, DESedeKeySpec) and BouncyCastle DESedeEngine/DESedeWrapEngine.
asset:
  type: algorithm
  primitive: block-cipher
  family: 3DES
  securityLevel: 112
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (DESede|TripleDES)(/(?!ECB(/|$))|Wrap$)
- call: javax.crypto.KeyGenerator.getInstance
  firstString: (DESede|TripleDES)$
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: (DESede|TripleDES)$
- new: javax.crypto.spec.SecretKeySpec
  firstString: (DESede|TripleDES)$
- new: javax.crypto.spec.DESedeKeySpec
- new: org.bouncycastle.crypto.engines.DESedeEngine
- call: org.bouncycastle.crypto.engines.DESedeEngine.newInstance
- new: org.bouncycastle.crypto.engines.DESedeWrapEngine
- call: org.bouncycastle.crypto.engines.DESedeWrapEngine.newInstance
- call: java.security.AlgorithmParameters.getInstance
  firstString: (DESede|TripleDES)$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (DESede/CBC/NoPadding|DESedeWrap)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.generators.DESedeKeyGenerator
- call: org.bouncycastle.crypto.generators.DESedeKeyGenerator.newInstance
- new: org.bouncycastle.crypto.params.DESedeParameters
- call: org.bouncycastle.crypto.params.DESedeParameters.newInstance
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.des_EDE3_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd3_KeyTripleDES_CBC
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.pbeWithSHAAnd2_KeyTripleDES_CBC
- field: org.bouncycastle.asn1.oiw.OIWObjectIdentifiers.desEDE
- field: org.bouncycastle.cms.CMSAlgorithm.DES_EDE3_CBC
- field: org.bouncycastle.cms.CMSAlgorithm.DES_EDE3_WRAP
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2001/04/xmlenc\#tripledes-cbc)$'
  feature: java-any-call
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:DESedeWrap|DESede)$'
  feature: java-any-call-short
