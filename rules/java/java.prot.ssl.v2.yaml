id: java.prot.ssl.v2
kind: source
language: java
name: SSL 2.0 usage in Java
description: Detects SSLv2 / SSLv2Hello enabled via JSSE APIs.
asset:
  type: protocol
  protocol: tls
  version: '2.0'
match:
- call: javax.net.ssl.SSLContext.getInstance
  firstString: SSLv2(Hello)?$
- method: setEnabledProtocols
  anyString: (.*,\s*)?SSLv2(Hello)?(\s*,.*)?$
- method: setProtocols
  anyString: (.*,\s*)?SSLv2(Hello)?(\s*,.*)?$
- method: protocols
  anyString: (.*,\s*)?SSLv2(Hello)?(\s*,.*)?$
- call: java.lang.System.setProperty
  anyString: (.*,\s*)?SSLv2(Hello)?(\s*,.*)?$
  stringContains:
  - protocols
