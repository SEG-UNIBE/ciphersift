id: java.sym.aes.kw
kind: source
language: java
name: AES key wrap usage in Java
description: Detects AES key wrapping (RFC 3394/5649) via JCA AESWrap / AES/KW and BouncyCastle AESWrapEngine.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?/KWP?(/.*)?|AESWrap(Pad)?(_(128|192|256))?|AESKW|AES-?KWP?)$
- new: org.bouncycastle.crypto.engines.AESWrapEngine
- call: org.bouncycastle.crypto.engines.AESWrapEngine.newInstance
- new: org.bouncycastle.crypto.engines.AESWrapPadEngine
- call: org.bouncycastle.crypto.engines.AESWrapPadEngine.newInstance
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (AES_128/KW/NoPadding|AES_128/KWP/NoPadding|AES_192/KW/NoPadding|AES_192/KWP/NoPadding|AES_256/KW/NoPadding|AES_256/KWP/NoPadding)$
