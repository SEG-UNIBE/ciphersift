id: java.key.load.public
kind: source
language: java
name: Public key loading in Java
description: >-
  Detects the decoding of public keys whose algorithm is not visible statically: KeyFactory.generatePublic, X509EncodedKeySpec (SubjectPublicKeyInfo), Bouncy Castle PublicKeyFactory and OpenSSH public-key parsing.
asset:
  type: related-crypto-material
  subtype: public-key
match:
- method: generatePublic
- new: java.security.spec.X509EncodedKeySpec
- call: org.bouncycastle.crypto.util.PublicKeyFactory.createKey
- call: org.bouncycastle.crypto.util.OpenSSHPublicKeyUtil.parsePublicKey
