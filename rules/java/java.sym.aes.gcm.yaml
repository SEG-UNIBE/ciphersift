# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.java.sym.aes.gcm.yaml; do not edit by hand.
id: java.sym.aes.gcm
kind: source
language: java
name: AES-GCM usage in Java
description: >-
  Detects AES-GCM via JCA Cipher/GCMParameterSpec, BouncyCastle GCMBlockCipher, Tink AES-GCM key templates
  and Spring Security Encryptors.stronger/delux. GCMParameterSpec and a GCMBlockCipher with an unresolved
  engine are attributed to AES (the only 128-bit block cipher JCA providers commonly pair with GCM).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: GCM
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)/GCM(/.*)?$
- new: javax.crypto.spec.GCMParameterSpec
- call: java.security.AlgorithmParameters.getInstance
  firstString: GCM$
- new: org.bouncycastle.crypto.modes.GCMBlockCipher
- call: org.bouncycastle.crypto.modes.GCMBlockCipher.newInstance
- call: com.google.crypto.tink.KeyTemplates.get
  firstString: AES(128|256)_GCM(_RAW)?$
- field: com.google.crypto.tink.aead.AeadKeyTemplates.AES128_GCM
- field: com.google.crypto.tink.aead.AeadKeyTemplates.AES256_GCM
- new: com.google.crypto.tink.subtle.AesGcmJce
- call: org.springframework.security.crypto.encrypt.Encryptors.stronger
- call: org.springframework.security.crypto.encrypt.Encryptors.delux
- new: org.springframework.security.crypto.encrypt.AesBytesEncryptor
  argsTextContains:
  - GCM
