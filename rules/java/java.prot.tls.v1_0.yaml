# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.java.prot.tls.v1_0.yaml; do not edit by hand.
id: java.prot.tls.v1_0
kind: source
language: java
name: TLS 1.0 usage in Java
description: >-
  Detects TLS 1.0 requested or enabled via SSLContext.getInstance, setEnabledProtocols/setProtocols, the
  https.protocols / jdk.tls.client.protocols system properties and OkHttp TlsVersion.
asset:
  type: protocol
  protocol: tls
  version: '1.0'
match:
- call: javax.net.ssl.SSLContext.getInstance
  firstString: TLSv1(\.0)?$
- method: setEnabledProtocols
  anyString: (.*,\s*)?TLSv1(\.0)?(\s*,.*)?$
- method: setProtocols
  anyString: (.*,\s*)?TLSv1(\.0)?(\s*,.*)?$
- method: protocols
  anyString: (.*,\s*)?TLSv1(\.0)?(\s*,.*)?$
- call: java.lang.System.setProperty
  anyString: (.*,\s*)?TLSv1(\.0)?(\s*,.*)?$
  stringContains:
  - protocols
- field: okhttp3.TlsVersion.TLS_1_0
