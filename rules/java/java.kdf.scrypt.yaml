id: java.kdf.scrypt
kind: source
language: java
name: scrypt key derivation in Java
description: >-
  Detects scrypt via BouncyCastle SCrypt, JCA SecretKeyFactory (BC provider), Lambdaworks scrypt and Spring
  Security SCryptPasswordEncoder.
asset:
  type: algorithm
  primitive: kdf
  family: scrypt
match:
- call: org.bouncycastle.crypto.generators.SCrypt.generate
- call: javax.crypto.SecretKeyFactory.getInstance
  firstString: SCRYPT$
- call: com.lambdaworks.crypto.SCrypt.scrypt
- call: com.lambdaworks.crypto.SCryptUtil.scrypt
- call: com.lambdaworks.crypto.SCryptUtil.check
- new: org.springframework.security.crypto.scrypt.SCryptPasswordEncoder
- call: org.springframework.security.crypto.scrypt.SCryptPasswordEncoder.defaultsFor*
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (SCRYPT)$
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.util.ScryptConfig
- call: org.bouncycastle.crypto.util.ScryptConfig.newInstance
- new: org.bouncycastle.jcajce.spec.ScryptKeySpec
