id: java.sym.aes.ecb
kind: source
language: java
name: AES in ECB mode in Java
description: Detects AES in ECB mode via JCA Cipher.getInstance ("AES" without mode defaults to ECB in
  SunJCE).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: ECB
match:
- call: javax.crypto.Cipher.getInstance
  firstString: (AES(_(128|192|256))?|Rijndael)(/ECB(/.*)?)?$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (AES_128/ECB/NoPadding|AES_192/ECB/NoPadding|AES_256/ECB/NoPadding)$
