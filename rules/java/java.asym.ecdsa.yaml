id: java.asym.ecdsa
kind: source
language: java
name: ECDSA usage in Java
description: >-
  Detects ECDSA signatures via JCA Signature/KeyPairGenerator, JcaContentSignerBuilder, BouncyCastle ECDSASigner,
  Tink ECDSA templates and JWT libraries.
asset:
  type: algorithm
  primitive: signature
  family: EC
match:
- call: java.security.Signature.getInstance
  firstString: (.*with(PLAIN-|CVC-)?ECDSA|ECDSA|ECDDSA)$
- new: org.bouncycastle.operator.jcajce.JcaContentSignerBuilder
  firstString: (.*with(PLAIN-|CVC-)?ECDSA|ECDSA|ECDDSA)$
- call: java.security.KeyPairGenerator.getInstance
  firstString: ECDSA$
- call: java.security.KeyFactory.getInstance
  firstString: ECDSA$
- new: org.bouncycastle.crypto.signers.ECDSASigner
- call: org.bouncycastle.crypto.signers.ECDSASigner.newInstance
- call: com.google.crypto.tink.KeyTemplates.get
  firstString: ECDSA_P(256|384|521).*$
- call: com.auth0.jwt.algorithms.Algorithm.ECDSA*
- field: io.jsonwebtoken.SignatureAlgorithm.ES*
- field: io.jsonwebtoken.Jwts.SIG.ES*
- field: com.nimbusds.jose.JWSAlgorithm.ES*
- new: com.nimbusds.jose.crypto.ECDSASigner
- new: com.nimbusds.jose.crypto.ECDSAVerifier
