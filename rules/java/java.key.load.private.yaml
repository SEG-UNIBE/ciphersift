# Written for CipherSift (DECISIONS B-J-KL, mirror of the Python rules of E4) from the Java SE 21 API
# (java.security.KeyFactory, java.security.spec, javax.crypto.EncryptedPrivateKeyInfo) and the Bouncy Castle
# 1.85 javadoc (org.bouncycastle.crypto.util, org.bouncycastle.openssl.jcajce, org.bouncycastle.pkcs); see
# spec/PROVENANCE.md.
id: java.key.load.private
kind: source
language: java
name: Private key loading in Java
description: >-
  Detects the decoding of private keys whose algorithm is not visible statically: KeyFactory.generatePrivate, PKCS8EncodedKeySpec and EncryptedPrivateKeyInfo (PKCS #8), Bouncy Castle PrivateKeyFactory, OpenSSH private-key blobs, PEM key conversion and encrypted PKCS #8.
asset:
  type: related-crypto-material
  subtype: private-key
match:
- method: generatePrivate
- new: java.security.spec.PKCS8EncodedKeySpec
- new: javax.crypto.EncryptedPrivateKeyInfo
- call: org.bouncycastle.crypto.util.PrivateKeyFactory.createKey
- call: org.bouncycastle.crypto.util.OpenSSHPrivateKeyUtil.parsePrivateKeyBlob
- new: org.bouncycastle.openssl.jcajce.JcaPEMKeyConverter
- new: org.bouncycastle.pkcs.PKCS8EncryptedPrivateKeyInfo
