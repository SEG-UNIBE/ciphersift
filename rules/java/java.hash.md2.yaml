id: java.hash.md2
kind: source
language: java
name: MD2 hash usage in Java
description: Detects MD2 via JCA MessageDigest, BouncyCastle and commons-codec.
asset:
  type: algorithm
  primitive: hash
  family: MD2
  securityLevel: 64
match:
- call: java.security.MessageDigest.getInstance
  firstString: MD2$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: MD2$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: MD2$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: MD2$
- new: org.bouncycastle.crypto.digests.MD2Digest
- call: org.bouncycastle.crypto.digests.MD2Digest.newInstance
- call: org.apache.commons.codec.digest.DigestUtils.md2*
- call: org.apache.commons.codec.digest.DigestUtils.getMd2Digest
- new: org.bouncycastle.jcajce.provider.digest.MD2.Digest
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (MD2)$
# DECISIONS B-J-BCOID: Bouncy Castle OID / algorithm constants (*ObjectIdentifiers, CMSAlgorithm, CertificateID); sources per entry in spec/java-api-additions.csv
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.md2WithRSAEncryption
- field: org.bouncycastle.asn1.pkcs.PKCSObjectIdentifiers.md2
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2007/05/xmldsig-more\#md2-rsa-MGF1|MD2withECDSAinP1363Format|MD2withDSAinP1363Format|MD2withRSA/PSS|MD2withECDSA|MD2withDSA|MD2withRSA|MD2)$'
  feature: java-any-call
