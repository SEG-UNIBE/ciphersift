id: java.hash.md2
kind: source
language: java
name: MD2 hash usage in Java
description: Detects MD2 via JCA MessageDigest, BouncyCastle and commons-codec.
asset:
  type: algorithm
  primitive: hash
  family: MD2
  securityLevel: 64
match:
- call: java.security.MessageDigest.getInstance
  firstString: MD2$
- new: org.apache.commons.codec.digest.DigestUtils
  firstString: MD2$
- call: org.apache.commons.codec.digest.DigestUtils.getDigest
  firstString: MD2$
- new: org.springframework.security.crypto.password.MessageDigestPasswordEncoder
  firstString: MD2$
- new: org.bouncycastle.crypto.digests.MD2Digest
- call: org.bouncycastle.crypto.digests.MD2Digest.newInstance
- call: org.apache.commons.codec.digest.DigestUtils.md2*
- call: org.apache.commons.codec.digest.DigestUtils.getMd2Digest
- new: org.bouncycastle.jcajce.provider.digest.MD2.Digest
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- new: org.bouncycastle.asn1.ASN1ObjectIdentifier
  firstString: (MD2)$
