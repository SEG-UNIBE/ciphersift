# Values of well-known library string constants, used by Java string resolution
# (SPEC.md 5.10 and 7.4). Keys are the simple class name; values are the
# documented values of public API constants.
id: java.constants
kind: constants
language: java
constants:
  MessageDigestAlgorithms:   # org.apache.commons.codec.digest.MessageDigestAlgorithms
    MD2: MD2
    MD5: MD5
    SHA_1: SHA-1
    SHA_224: SHA-224
    SHA_256: SHA-256
    SHA_384: SHA-384
    SHA_512: SHA-512
    SHA_512_224: SHA-512/224
    SHA_512_256: SHA-512/256
    SHA3_224: SHA3-224
    SHA3_256: SHA3-256
    SHA3_384: SHA3-384
    SHA3_512: SHA3-512
  HmacAlgorithms:            # org.apache.commons.codec.digest.HmacAlgorithms (enum; getName())
    HMAC_MD5: HmacMD5
    HMAC_SHA_1: HmacSHA1
    HMAC_SHA_224: HmacSHA224
    HMAC_SHA_256: HmacSHA256
    HMAC_SHA_384: HmacSHA384
    HMAC_SHA_512: HmacSHA512
  KeyProperties:             # android.security.keystore.KeyProperties
    KEY_ALGORITHM_AES: AES
    KEY_ALGORITHM_RSA: RSA
    KEY_ALGORITHM_EC: EC
    KEY_ALGORITHM_3DES: DESede
    KEY_ALGORITHM_XDH: XDH
    KEY_ALGORITHM_HMAC_SHA1: HmacSHA1
    KEY_ALGORITHM_HMAC_SHA224: HmacSHA224
    KEY_ALGORITHM_HMAC_SHA256: HmacSHA256
    KEY_ALGORITHM_HMAC_SHA384: HmacSHA384
    KEY_ALGORITHM_HMAC_SHA512: HmacSHA512
    BLOCK_MODE_ECB: ECB
    BLOCK_MODE_CBC: CBC
    BLOCK_MODE_CTR: CTR
    BLOCK_MODE_GCM: GCM
    ENCRYPTION_PADDING_NONE: NoPadding
    ENCRYPTION_PADDING_PKCS7: PKCS7Padding
    ENCRYPTION_PADDING_RSA_PKCS1: PKCS1Padding
    ENCRYPTION_PADDING_RSA_OAEP: OAEPPadding
  # Apache Shiro hash classes (org.apache.shiro.crypto.hash, 1.x and 2.x; Md2/Md5/Sha1Hash 1.x only)
  # and the Shiro 2.x Argon2/bcrypt hashes (DECISIONS E16)
  Md2Hash:
    ALGORITHM_NAME: MD2
  Md5Hash:
    ALGORITHM_NAME: MD5
  Sha1Hash:
    ALGORITHM_NAME: SHA-1
  Sha256Hash:
    ALGORITHM_NAME: SHA-256
  Sha384Hash:
    ALGORITHM_NAME: SHA-384
  Sha512Hash:
    ALGORITHM_NAME: SHA-512
  Argon2Hash:
    DEFAULT_ALGORITHM_NAME: argon2id
  BCryptHash:
    DEFAULT_ALGORITHM_NAME: bcrypt2y
  # JSR 105 XML digital signature algorithm URIs (Java SE javax.xml.crypto.dsig, DECISIONS B-J-XD2):
  # https://docs.oracle.com/en/java/javase/21/docs/api/java.xml.crypto/javax/xml/crypto/dsig/DigestMethod.html,
  # https://docs.oracle.com/en/java/javase/21/docs/api/java.xml.crypto/javax/xml/crypto/dsig/SignatureMethod.html
  DigestMethod:
    SHA1: 'http://www.w3.org/2000/09/xmldsig#sha1'
    SHA224: 'http://www.w3.org/2001/04/xmldsig-more#sha224'
    SHA256: 'http://www.w3.org/2001/04/xmlenc#sha256'
    SHA384: 'http://www.w3.org/2001/04/xmldsig-more#sha384'
    SHA512: 'http://www.w3.org/2001/04/xmlenc#sha512'
    RIPEMD160: 'http://www.w3.org/2001/04/xmlenc#ripemd160'
    SHA3_224: 'http://www.w3.org/2007/05/xmldsig-more#sha3-224'
    SHA3_256: 'http://www.w3.org/2007/05/xmldsig-more#sha3-256'
    SHA3_384: 'http://www.w3.org/2007/05/xmldsig-more#sha3-384'
    SHA3_512: 'http://www.w3.org/2007/05/xmldsig-more#sha3-512'
  SignatureMethod:
    DSA_SHA1: 'http://www.w3.org/2000/09/xmldsig#dsa-sha1'
    DSA_SHA256: 'http://www.w3.org/2009/xmldsig11#dsa-sha256'
    RSA_SHA1: 'http://www.w3.org/2000/09/xmldsig#rsa-sha1'
    RSA_SHA224: 'http://www.w3.org/2001/04/xmldsig-more#rsa-sha224'
    RSA_SHA256: 'http://www.w3.org/2001/04/xmldsig-more#rsa-sha256'
    RSA_SHA384: 'http://www.w3.org/2001/04/xmldsig-more#rsa-sha384'
    RSA_SHA512: 'http://www.w3.org/2001/04/xmldsig-more#rsa-sha512'
    SHA1_RSA_MGF1: 'http://www.w3.org/2007/05/xmldsig-more#sha1-rsa-MGF1'
    SHA224_RSA_MGF1: 'http://www.w3.org/2007/05/xmldsig-more#sha224-rsa-MGF1'
    SHA256_RSA_MGF1: 'http://www.w3.org/2007/05/xmldsig-more#sha256-rsa-MGF1'
    SHA384_RSA_MGF1: 'http://www.w3.org/2007/05/xmldsig-more#sha384-rsa-MGF1'
    SHA512_RSA_MGF1: 'http://www.w3.org/2007/05/xmldsig-more#sha512-rsa-MGF1'
    ECDSA_SHA1: 'http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha1'
    ECDSA_SHA224: 'http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha224'
    ECDSA_SHA256: 'http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha256'
    ECDSA_SHA384: 'http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha384'
    ECDSA_SHA512: 'http://www.w3.org/2001/04/xmldsig-more#ecdsa-sha512'
    HMAC_SHA1: 'http://www.w3.org/2000/09/xmldsig#hmac-sha1'
    HMAC_SHA224: 'http://www.w3.org/2001/04/xmldsig-more#hmac-sha224'
    HMAC_SHA256: 'http://www.w3.org/2001/04/xmldsig-more#hmac-sha256'
    HMAC_SHA384: 'http://www.w3.org/2001/04/xmldsig-more#hmac-sha384'
    HMAC_SHA512: 'http://www.w3.org/2001/04/xmldsig-more#hmac-sha512'
    RSA_PSS: 'http://www.w3.org/2007/05/xmldsig-more#rsa-pss'
    ED25519: 'http://www.w3.org/2021/04/xmldsig-more#eddsa-ed25519'
    ED448: 'http://www.w3.org/2021/04/xmldsig-more#eddsa-ed448'
