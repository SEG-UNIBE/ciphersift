id: java.sym.camellia
kind: source
language: java
name: Camellia usage in Java
description: Detects the Camellia cipher via JCA (Cipher, KeyGenerator, SecretKeySpec) and BouncyCastle.
asset:
  type: algorithm
  primitive: block-cipher
  family: Camellia
match:
- call: javax.crypto.Cipher.getInstance
  firstString: Camellia(/.*)?$
- call: javax.crypto.KeyGenerator.getInstance
  firstString: Camellia$
- new: javax.crypto.spec.SecretKeySpec
  firstString: Camellia$
- new: org.bouncycastle.crypto.engines.CamelliaEngine
- call: org.bouncycastle.crypto.engines.CamelliaEngine.newInstance
- new: org.bouncycastle.crypto.engines.CamelliaLightEngine
- call: org.bouncycastle.crypto.engines.CamelliaLightEngine.newInstance
# DECISIONS B-J-BC2: Bouncy Castle classes whose name states the algorithm (bcprov/bcpkix 1.78.1, javadoc 1.85); sources per entry in spec/java-api-additions.csv
- new: org.bouncycastle.crypto.engines.CamelliaWrapEngine
- call: org.bouncycastle.crypto.engines.CamelliaWrapEngine.newInstance
# DECISIONS B-J-SNx (benchmark-informed): algorithm names of the public registries (XML-Security URIs,
# multi-token JCA standard names, TLS groups, provider service keys; with java-any-call-short also the short
# JCA names, JOSE names and TLS cipher suites) as a string argument of any method call (SPEC 5.5 anyCall);
# the names and their sources: spec/anycall-names.csv (generated by work/ciphersift-t2-impl/gen/gen_anycall.py).
- anyCall: true
  anyString: '(?:(?:Alg\.Alias\.)?(?:Cipher|Signature|MessageDigest|Mac|KeyPairGenerator|KeyGenerator|KeyAgreement|KeyFactory|SecretKeyFactory|SecureRandom|KeyStore|AlgorithmParameters|KEM)\.)?(?:http://www\.w3\.org/2001/04/xmldsig-more\#camellia128-cbc|http://www\.w3\.org/2001/04/xmldsig-more\#camellia192-cbc|http://www\.w3\.org/2001/04/xmldsig-more\#camellia256-cbc|http://www\.w3\.org/2001/04/xmldsig-more\#kw-camellia128|http://www\.w3\.org/2001/04/xmldsig-more\#kw-camellia192|http://www\.w3\.org/2001/04/xmldsig-more\#kw-camellia256)$'
  feature: java-any-call
