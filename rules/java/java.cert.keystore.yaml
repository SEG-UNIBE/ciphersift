id: java.cert.keystore
kind: source
language: java
name: Key store (PKCS#12 / JKS) operations in Java
description: Detects key and certificate store usage via JCA KeyStore and BouncyCastle PKCS#12 builders.
asset:
  type: certificate
match:
- call: java.security.KeyStore.getInstance
- new: org.bouncycastle.pkcs.PKCS12PfxPduBuilder
- call: java.security.KeyStore.getDefaultType
- call: java.security.KeyStore.Builder.newInstance
