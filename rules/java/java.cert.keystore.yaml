id: java.cert.keystore
kind: source
language: java
name: Key store (PKCS#12 / JKS) operations in Java
description: Detects key and certificate store usage via JCA KeyStore and BouncyCastle PKCS#12 builders.
asset:
  type: certificate
match:
- call: java.security.KeyStore.getInstance
- new: org.bouncycastle.pkcs.PKCS12PfxPduBuilder
- call: java.security.KeyStore.getDefaultType
- call: java.security.KeyStore.Builder.newInstance
# DECISIONS B-J-JDK: remaining Java SE crypto classes and constants (Java SE 21 API); sources per entry in spec/java-api-additions.csv
- new: java.security.DomainLoadStoreParameter
- new: java.security.KeyStore.PasswordProtection
- new: java.security.KeyStore.PrivateKeyEntry
- new: java.security.KeyStore.SecretKeyEntry
- new: java.security.KeyStore.TrustedCertificateEntry
- new: java.security.PKCS12Attribute
