id: python.prot.tls.v1_0
kind: source
language: python
name: TLS 1.0 explicitly configured in Python
description: >-
  Detects explicit TLS 1.0 via ssl.PROTOCOL_TLSv1, TLSVersion.TLSv1 or pyOpenSSL TLSv1_METHOD / TLS1_VERSION.
asset:
  type: protocol
  protocol: tls
  version: '1.0'
match:
- call: ssl.SSLContext
  anySymbol:
  - ssl.PROTOCOL_TLSv1
  - OpenSSL.SSL.TLSv1_METHOD
  - OpenSSL.SSL.TLS1_VERSION
- call: ssl.wrap_socket
  anySymbol:
  - ssl.PROTOCOL_TLSv1
  - OpenSSL.SSL.TLSv1_METHOD
  - OpenSSL.SSL.TLS1_VERSION
- call: OpenSSL.SSL.Context
  anySymbol:
  - ssl.PROTOCOL_TLSv1
  - OpenSSL.SSL.TLSv1_METHOD
  - OpenSSL.SSL.TLS1_VERSION
- call: ssl.create_default_context
  anySymbol:
  - ssl.PROTOCOL_TLSv1
  - OpenSSL.SSL.TLSv1_METHOD
  - OpenSSL.SSL.TLS1_VERSION
- method:
  - set_min_proto_version
  - set_max_proto_version
  anySymbol:
  - ssl.PROTOCOL_TLSv1
  - OpenSSL.SSL.TLSv1_METHOD
  - OpenSSL.SSL.TLS1_VERSION
- assign: minimum_version
  value: TLSv1(?![_\d])
- assign: maximum_version
  value: TLSv1(?![_\d])
- anyCall: true
  kwargs:
    ssl_version: PROTOCOL_TLSv1$
# DECISIONS P3-TLS: the version of an ldap3 Tls object (https://ldap3.readthedocs.io/en/latest/ssltls.html)
- call: ldap3.Tls
  anySymbol:
  - ssl.PROTOCOL_TLSv1
  - OpenSSL.SSL.TLSv1_METHOD
  - OpenSSL.SSL.TLS1_VERSION
