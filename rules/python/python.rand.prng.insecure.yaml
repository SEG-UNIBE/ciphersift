id: python.rand.prng.insecure
kind: source
language: python
name: Non-cryptographic PRNG usage in Python
description: >-
  Weakness indicator, not a cryptographic algorithm: detects use of the Mersenne-Twister based random
  module (random.random, randint, choice, ...) wherever it is used (also in tests and for non-security
  purposes such as jitter or shuffling). It must not be used for security-sensitive values. Components
  carry the property ciphersift:indicator=weakness; reported only with --weakness-indicators.
indicator: weakness
asset:
  type: related-crypto-material
  subtype: prng-insecure
match:
- call: random.random
- call: random.randint
- call: random.randrange
- call: random.choice
- call: random.choices
- call: random.shuffle
- call: random.sample
- call: random.uniform
- call: random.getrandbits
- call: random.randbytes
- call: random.seed
- call: random.Random
- call: random.triangular
- call: random.gauss
- call: random.normalvariate
- call: random.betavariate
