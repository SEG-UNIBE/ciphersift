id: python.sym.aes.eax
kind: source
language: python
name: AES-EAX usage in Python
description: >-
  Detects AES in EAX mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_EAX).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: EAX
match:
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_EAX
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_EAX
