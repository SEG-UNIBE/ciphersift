id: python.prot.ssh.hostkey_verification.disabled
kind: source
language: python
name: SSH host key verification disabled in Python
description: >-
  Detects paramiko clients that accept unknown host keys (AutoAddPolicy / WarningPolicy) and asyncssh
  known_hosts=None.
asset:
  type: related-crypto-material
  subtype: hostkey-verification-disabled
match:
- method: set_missing_host_key_policy
