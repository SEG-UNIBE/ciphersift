# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.python.hash.sm3.yaml; do not edit by hand.
id: python.hash.sm3
kind: source
language: python
name: SM3 hash usage in Python
description: Detects SM3 via pyca/cryptography hashes.SM3 and hashlib.new('sm3').
asset:
  type: algorithm
  primitive: hash
  family: SM3
match:
- call: cryptography.hazmat.primitives.hashes.SM3
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: hashlib.new
  firstString: (?i)^sm3$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (SM3)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (SM3)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (SM3)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (SM3)$
