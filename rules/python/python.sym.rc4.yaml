id: python.sym.rc4
kind: source
language: python
name: RC4 usage in Python
description: Detects RC4/ARC4 via pyca/cryptography (incl. hazmat.decrepit) and PyCryptodome Crypto.Cipher.ARC4.
asset:
  type: algorithm
  primitive: stream-cipher
  family: RC4
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.ARC4
  - cryptography.hazmat.decrepit.ciphers.algorithms.ARC4
- call: Crypto.Cipher.ARC4.new
- call: Cryptodome.Cipher.ARC4.new
- ref: cryptography.hazmat.primitives.ciphers.algorithms.ARC4
- ref: cryptography.hazmat.decrepit.ciphers.algorithms.ARC4
