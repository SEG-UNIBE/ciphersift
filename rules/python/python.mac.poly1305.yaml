id: python.mac.poly1305
kind: source
language: python
name: Poly1305 MAC usage in Python
description: Detects standalone Poly1305 via pyca/cryptography and PyCryptodome.
asset:
  type: algorithm
  primitive: mac
  family: Poly1305
match:
- call: cryptography.hazmat.primitives.poly1305.Poly1305
- call: Crypto.Hash.Poly1305
- call: Cryptodome.Hash.Poly1305
