id: python.sym.aes.cbc
kind: source
language: python
name: AES-CBC usage in Python
description: >-
  Detects AES in CBC mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_CBC).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CBC
