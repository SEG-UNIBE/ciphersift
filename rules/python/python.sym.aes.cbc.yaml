- call: pyaes.AESModeOfOperationCBC
- call: pyaes.aes.AESModeOfOperationCBC
- call: asn1crypto.algos.EncryptionAlgorithm
  dictItems:
    algorithm: ^aes(128|192|256)_cbc$|^(AES_128/CBC/NoPadding|AES_192/CBC/NoPadding|AES_256/CBC/NoPadding)$
