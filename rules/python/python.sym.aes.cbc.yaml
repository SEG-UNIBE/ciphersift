id: python.sym.aes.cbc
kind: source
language: python
name: AES-CBC usage in Python
description: >-
  Detects AES in CBC mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_CBC).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CBC
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.CBC
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_CBC
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_CBC
