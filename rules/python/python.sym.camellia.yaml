id: python.sym.camellia
kind: source
language: python
name: Camellia usage in Python
description: Detects the Camellia block cipher via pyca/cryptography.
asset:
  type: algorithm
  primitive: block-cipher
  family: Camellia
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.Camellia
- ref: cryptography.hazmat.primitives.ciphers.algorithms.Camellia
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (Camellia/CBC/NoPadding)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (Camellia/CBC/NoPadding)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (Camellia/CBC/NoPadding)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (Camellia/CBC/NoPadding)$
