id: python.sym.aes
kind: source
language: python
name: AES usage in Python (mode not statically determinable)
description: >-
  Detects AES block cipher usage where the mode cannot be resolved statically: pyca/cryptography Cipher(algorithms.AES(...),
  <mode>) and PyCryptodome AES.new(key, <mode>).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
- call: Crypto.Cipher.AES.new
- call: Cryptodome.Cipher.AES.new
