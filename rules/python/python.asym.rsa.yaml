id: python.asym.rsa
kind: source
language: python
name: RSA key generation / usage in Python
description: >-
  Detects RSA key generation and key construction via pyca/cryptography, PyCryptodome Crypto.PublicKey.RSA,
  python-rsa, paramiko RSAKey and pyOpenSSL PKey.generate_key(TYPE_RSA).
asset:
  type: algorithm
  primitive: signature
  family: RSA
match:
- call: cryptography.hazmat.primitives.asymmetric.rsa.generate_private_key
  param:
    keyword: key_size
    index: 1
- call: cryptography.hazmat.primitives.asymmetric.rsa.RSAPrivateNumbers
- call: cryptography.hazmat.primitives.asymmetric.rsa.RSAPublicNumbers
- call: Crypto.PublicKey.RSA.generate
  param:
    keyword: bits
    index: 0
- call: Cryptodome.PublicKey.RSA.generate
  param:
    keyword: bits
    index: 0
- call: Crypto.PublicKey.RSA.import_key
- call: Cryptodome.PublicKey.RSA.import_key
- call: Crypto.PublicKey.RSA.importKey
- call: Cryptodome.PublicKey.RSA.importKey
- call: Crypto.PublicKey.RSA.construct
- call: Cryptodome.PublicKey.RSA.construct
- call: rsa.newkeys
  param:
    keyword: nbits
    index: 0
- call: paramiko.RSAKey.generate
  param:
    keyword: bits
    index: 0
- call: rsa.sign
- call: rsa.verify
- call: rsa.PrivateKey
- call: rsa.PublicKey
- call: paramiko.RSAKey
- call: paramiko.rsakey.RSAKey
- method: generate_key
  anySymbol:
  - OpenSSL.crypto.TYPE_RSA
  param:
    keyword: bits
    index: 1
- ref: pkcs11.Mechanism.RSA_PKCS_KEY_PAIR_GEN
- ref: pkcs11.mechanisms.Mechanism.RSA_PKCS_KEY_PAIR_GEN
- ref: pkcs11.Mechanism.RSA_X_509
- ref: pkcs11.mechanisms.Mechanism.RSA_X_509
- ref: pkcs11.Mechanism.RSA_X9_31_KEY_PAIR_GEN
- ref: pkcs11.mechanisms.Mechanism.RSA_X9_31_KEY_PAIR_GEN
- ref: pkcs11.KeyType.RSA
- ref: pkcs11.mechanisms.KeyType.RSA
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (RSA)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (RSA)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (RSA)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (RSA)$
