# used in isinstance key dispatch and key-type tables
- call: cryptography.hazmat.primitives.asymmetric.rsa.RSAPrivateKey
  feature: python-isinstance-keys
- call: cryptography.hazmat.primitives.asymmetric.rsa.RSAPublicKey
