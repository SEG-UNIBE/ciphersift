id: python.sym.cast5
kind: source
language: python
name: CAST5 usage in Python
description: Detects the CAST5 block cipher via pyca/cryptography and PyCryptodome.
asset:
  type: algorithm
  primitive: block-cipher
  family: CAST5
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.CAST5
  - cryptography.hazmat.decrepit.ciphers.algorithms.CAST5
- call: Crypto.Cipher.CAST.new
- call: Cryptodome.Cipher.CAST.new
- ref: cryptography.hazmat.primitives.ciphers.algorithms.CAST5
- ref: cryptography.hazmat.decrepit.ciphers.algorithms.CAST5
# DECISIONS B-P-LIT: IANA SSH / JOSE / TLS-group names as exact string literals in value positions; names and
# sources: ciphersift-boost-assess/python-recall/names.tsv (IANA SSH, JOSE and TLS registries, fetched 2026-10-18)
- literal: ['cast128-cbc', 'cast128-ctr']
  feature: python-literal-names
