# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.python.cert.validation.disabled.yaml; do not edit by hand.
id: python.cert.validation.disabled
kind: source
language: python
name: TLS certificate validation disabled in Python
description: >-
  Detects disabled certificate verification: ctx.verify_mode = CERT_NONE, ssl._create_unverified_context,
  verify=False (requests/httpx), cert_reqs=CERT_NONE (urllib3/ssl.wrap_socket), aiohttp ssl=False / verify_ssl=False
  and pyOpenSSL VERIFY_NONE.
asset:
  type: related-crypto-material
  subtype: cert-validation-disabled
match:
- assign: verify_mode
  valueContains:
  - CERT_NONE
- assign: _create_default_https_context
  valueContains:
  - _create_unverified_context
- assign: verify
  value: ^False$
- call: ssl._create_unverified_context
- anyCall: true
  kwargs:
    verify: ^False$
- anyCall: true
  kwargs:
    cert_reqs: CERT_NONE
- anyCall: true
  kwargs:
    verify_ssl: ^False$
- anyCall: true
  kwargs:
    ssl: ^False$
- method: set_verify
  anySymbol:
  - OpenSSL.SSL.VERIFY_NONE
