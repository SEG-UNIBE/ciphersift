id: python.cert.validation.disabled
kind: source
language: python
name: TLS certificate validation disabled in Python
description: >-
  Detects disabled certificate verification: ctx.verify_mode = CERT_NONE, ssl._create_unverified_context,
  verify=False on requests / httpx calls and on HTTP-client methods (get, post, request, send, Session,
  Client, ...; also the OAuth session methods fetch_token / fetch_request_token / fetch_access_token /
  refresh_token, which pass it on to requests), cert_reqs=CERT_NONE (urllib3/ssl.wrap_socket), aiohttp ssl=False / verify_ssl=False and
  pyOpenSSL VERIFY_NONE. A verify=False or ssl=False argument of any other function is not reported.
asset:
  type: related-crypto-material
  subtype: cert-validation-disabled
match:
- assign: verify_mode
  valueContains:
  - CERT_NONE
- assign: _create_default_https_context
  valueContains:
  - _create_unverified_context
- assign: verify
  value: ^False$
- call: ssl._create_unverified_context
- anyCall: true
  kwargs:
    cert_reqs: CERT_NONE
- anyCall: true
  kwargs:
    verify_ssl: ^False$
- method: set_verify
  anySymbol:
  - OpenSSL.SSL.VERIFY_NONE
- call: requests
  kwargs:
    verify: ^False$
- call: pip._vendor.requests
  kwargs:
    verify: ^False$
- call: httpx
  kwargs:
    verify: ^False$
- call: aiohttp
  kwargs:
    ssl: ^False$
- method:
  - get
  - post
  - put
  - patch
  - delete
  - head
  - options
  - request
  - send
  - stream
  - Session
  - Client
  - AsyncClient
  - ClientSession
  - TCPConnector
  - ws_connect
  - fetch_token
  - fetch_request_token
  - fetch_access_token
  - refresh_token
  kwargs:
    verify: ^False$
- method:
  - get
  - post
  - put
  - patch
  - delete
  - head
  - options
  - request
  - send
  - stream
  - Session
  - Client
  - AsyncClient
  - ClientSession
  - TCPConnector
  - ws_connect
  - fetch_token
  - fetch_request_token
  - fetch_access_token
  - refresh_token
  kwargs:
    ssl: ^False$
