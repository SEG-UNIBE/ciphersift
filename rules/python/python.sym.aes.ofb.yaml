  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.OFB
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_OFB
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_OFB
- call: pyaes.AESModeOfOperationOFB
- call: pyaes.aes.AESModeOfOperationOFB
- call: asn1crypto.algos.EncryptionAlgorithm
  dictItems:
    algorithm: ^aes(128|192|256)_ofb$|^(AES_128/OFB/NoPadding|AES_192/OFB/NoPadding|AES_256/OFB/NoPadding)$
- call: asn1crypto.algos.EncryptionAlgorithmId
  firstString: ^aes(128|192|256)_ofb$|^(AES_128/OFB/NoPadding|AES_192/OFB/NoPadding|AES_256/OFB/NoPadding)$
- ref: pkcs11.Mechanism.AES_OFB
- ref: pkcs11.mechanisms.Mechanism.AES_OFB
