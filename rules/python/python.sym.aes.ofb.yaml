id: python.sym.aes.ofb
kind: source
language: python
name: AES-OFB usage in Python
description: >-
  Detects AES in OFB mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_OFB).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: OFB
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.OFB
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_OFB
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_OFB
