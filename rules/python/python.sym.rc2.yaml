id: python.sym.rc2
kind: source
language: python
name: RC2 usage in Python
description: Detects RC2/ARC2 via PyCryptodome Crypto.Cipher.ARC2 and pyca hazmat.decrepit RC2.
asset:
  type: algorithm
  primitive: block-cipher
  family: RC2
match:
- call: Crypto.Cipher.ARC2.new
- call: Cryptodome.Cipher.ARC2.new
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.decrepit.ciphers.algorithms.RC2
- ref: cryptography.hazmat.decrepit.ciphers.algorithms.RC2
- call: asn1crypto.algos.EncryptionAlgorithm
  dictItems:
    algorithm: ^rc2$|^(RC2/CBC/NoPadding)$
- call: asn1crypto.algos.EncryptionAlgorithmId
  firstString: ^rc2$|^(RC2/CBC/NoPadding)$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (RC2/CBC/NoPadding)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (RC2/CBC/NoPadding)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (RC2/CBC/NoPadding)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (RC2/CBC/NoPadding)$
