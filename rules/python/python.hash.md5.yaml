id: python.hash.md5
kind: source
language: python
name: MD5 hash usage in Python
description: >-
  Detects MD5 via hashlib, the Python 2 md5 module, pyca/cryptography hashes, PyCryptodome Crypto.Hash,
  hmac digestmod and passlib MD5-based schemes.
asset:
  type: algorithm
  primitive: hash
  family: MD5
  securityLevel: 64
match:
- call: hashlib.md5
- call: md5.new
- call: md5.md5
- call: cryptography.hazmat.primitives.hashes.MD5
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Crypto.Hash.MD5
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.MD5
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: hashlib.new
  firstString: (?i)^md5$
- call: hashlib.pbkdf2_hmac
  firstString: (?i)^md5$
- call: hashlib.file_digest
  firstString: (?i)^md5$
- call: hmac.new
  kwargs:
    digestmod: (?i)^['"]?md5['"]?$
- call: hmac.new
  anySymbol:
  - hashlib.md5
- call: hmac.new
  stringContains:
  - md5
- call: hmac.digest
  kwargs:
    digestmod: (?i)^['"]?md5['"]?$
- call: hmac.digest
  anySymbol:
  - hashlib.md5
- call: hmac.digest
  stringContains:
  - md5
- call: hmac.HMAC
  kwargs:
    digestmod: (?i)^['"]?md5['"]?$
- call: hmac.HMAC
  anySymbol:
  - hashlib.md5
- call: hmac.HMAC
  stringContains:
  - md5
- call: passlib.hash.md5_crypt
- call: passlib.hash.apr_md5_crypt
- call: passlib.hash.hex_md5
- call: passlib.hash.ldap_md5
- call: passlib.hash.ldap_salted_md5
- call: passlib.context.CryptContext
  stringContains:
  - md5_crypt
  - hex_md5
  - ldap_md5
- call: asn1crypto.algos.DigestAlgorithm
  dictItems:
    algorithm: ^md5$|^(MD5)$
- call: asn1crypto.algos.DigestAlgorithmId
  firstString: ^md5$|^(MD5)$
- ref: pkcs11.Mechanism.MD5_RSA_PKCS
- ref: pkcs11.mechanisms.Mechanism.MD5_RSA_PKCS
- ref: pkcs11.Mechanism.MD5
- ref: pkcs11.mechanisms.Mechanism.MD5
- ref: pkcs11.Mechanism.MD5_HMAC
- ref: pkcs11.mechanisms.Mechanism.MD5_HMAC
