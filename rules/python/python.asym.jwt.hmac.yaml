id: python.asym.jwt.hmac
kind: source
language: python
name: JWT HMAC (HS256/384/512) in Python
description: Detects JWT signing/verification with HMAC algorithms via PyJWT and python-jose.
asset:
  type: algorithm
  primitive: mac
  family: HMAC
match:
