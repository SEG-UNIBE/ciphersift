  - HS512
- call: jwt.verify
  stringContains:
  - HS256
  - HS384
  - HS512
- call: jose.jwt.encode
  stringContains:
  - HS256
  - HS384
  - HS512
- call: jose.jwt.decode
  stringContains:
  - HS256
  - HS384
  - HS512
- call: jose.jwt.sign
  stringContains:
  - HS256
  - HS384
  - HS512
- call: jose.jwt.verify
  stringContains:
  - HS256
  - HS384
  - HS512
- call: jose.jws.encode
  stringContains:
  - HS256
  - HS384
  - HS512
