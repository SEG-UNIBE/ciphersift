# Written for CipherSift (DECISIONS B-P-PQ) from the pyca/cryptography documentation
# (https://cryptography.io/en/latest/hazmat/primitives/asymmetric/mlkem/, .../mldsa/, .../hpke/, cryptography 50)
# and the liboqs-python README (https://github.com/open-quantum-safe/liboqs-python, KeyEncapsulation / Signature).
id: python.pqc.mlkem
kind: source
language: python
name: ML-KEM usage in Python
description: >-
  Detects pyca/cryptography ML-KEM keys (also the HPKE hybrid ML-KEM keys) and liboqs-python KeyEncapsulation, with the parameter set; table OIDs (SPEC 5.11).
asset:
  type: algorithm
  primitive: kem
  family: ML-KEM
match:
- call: cryptography.hazmat.primitives.asymmetric.mlkem.MLKEM768PrivateKey
  param:
    value: ML-KEM-768
- call: cryptography.hazmat.primitives.asymmetric.mlkem.MLKEM768PublicKey
  param:
    value: ML-KEM-768
- call: cryptography.hazmat.primitives.asymmetric.mlkem.MLKEM1024PrivateKey
  param:
    value: ML-KEM-1024
- call: cryptography.hazmat.primitives.asymmetric.mlkem.MLKEM1024PublicKey
  param:
    value: ML-KEM-1024
- call: cryptography.hazmat.primitives.hpke.MLKEM768X25519PrivateKey
  param:
    value: ML-KEM-768
- call: cryptography.hazmat.primitives.hpke.MLKEM768X25519PublicKey
  param:
    value: ML-KEM-768
- call: cryptography.hazmat.primitives.hpke.MLKEM1024P384PrivateKey
  param:
    value: ML-KEM-1024
- call: cryptography.hazmat.primitives.hpke.MLKEM1024P384PublicKey
  param:
    value: ML-KEM-1024
- call: oqs.KeyEncapsulation
  firstString: (ML-KEM-(512|768|1024)|Kyber(512|768|1024))$
  param:
    index: 0
- call: cryptography.x509.ObjectIdentifier
  firstString: (ML-KEM-512|ML-KEM-768|ML-KEM-1024)$
  param:
    index: 0
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (ML-KEM-512|ML-KEM-768|ML-KEM-1024)$
  param:
    index: 0
- call: asn1crypto.core.ObjectIdentifier
  firstString: (ML-KEM-512|ML-KEM-768|ML-KEM-1024)$
  param:
    index: 0
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (ML-KEM-512|ML-KEM-768|ML-KEM-1024)$
  param:
    index: 0
# DECISIONS B-P-LIT: IANA SSH / JOSE / TLS-group names as exact string literals in value positions; names and
# sources: ciphersift-boost-assess/python-recall/names.tsv (IANA SSH, JOSE and TLS registries, fetched 2026-10-18)
- literal: ['MLKEM1024', 'MLKEM512', 'MLKEM512X25519', 'MLKEM768', 'SecP256r1Kyber768Draft00', 'SecP256r1MLKEM512', 'SecP256r1MLKEM768', 'SecP384r1MLKEM1024', 'X25519Kyber768Draft00', 'X25519MLKEM768', 'curveSM2MLKEM768', 'mlkem1024-sha384', 'mlkem1024nistp384-sha384', 'mlkem512-sha256', 'mlkem768-sha256', 'mlkem768nistp256-sha256', 'mlkem768x25519-sha256']
  feature: python-literal-names
