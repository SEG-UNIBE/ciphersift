# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.python.hash.ripemd160.yaml; do not edit by hand.
id: python.hash.ripemd160
kind: source
language: python
name: RIPEMD-160 hash usage in Python
description: Detects RIPEMD-160 via hashlib.new('ripemd160') and PyCryptodome Crypto.Hash.RIPEMD160.
asset:
  type: algorithm
  primitive: hash
  family: RIPEMD160
  securityLevel: 80
match:
- call: hashlib.new
  firstString: (?i)^ripemd-?160$
- call: Crypto.Hash.RIPEMD160
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.RIPEMD160
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Crypto.Hash.RIPEMD
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.RIPEMD
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
