# Generated by spec/tools/convert_rules.py from the BF-CBOM rule src.python.hash.ripemd160.yaml; do not edit by hand.
id: python.hash.ripemd160
kind: source
language: python
name: RIPEMD-160 hash usage in Python
description: Detects RIPEMD-160 via hashlib.new('ripemd160') and PyCryptodome Crypto.Hash.RIPEMD160.
asset:
  type: algorithm
  primitive: hash
  family: RIPEMD160
  securityLevel: 80
match:
- call: hashlib.new
  firstString: (?i)^ripemd-?160$
- call: Crypto.Hash.RIPEMD160
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.RIPEMD160
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Crypto.Hash.RIPEMD
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.RIPEMD
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (RIPEMD160)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (RIPEMD160)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (RIPEMD160)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (RIPEMD160)$
