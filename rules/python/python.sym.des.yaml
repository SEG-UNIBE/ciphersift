id: python.sym.des
kind: source
language: python
name: DES usage in Python
description: Detects single DES via PyCryptodome Crypto.Cipher.DES and pyDes.
asset:
  type: algorithm
  primitive: block-cipher
  family: DES
match:
- call: Crypto.Cipher.DES.new
- call: Cryptodome.Cipher.DES.new
- call: pyDes.des
- call: asn1crypto.algos.EncryptionAlgorithm
  dictItems:
    algorithm: ^des$|^(DES/CBC/NoPadding)$
- call: asn1crypto.algos.EncryptionAlgorithmId
  firstString: ^des$|^(DES/CBC/NoPadding)$
- ref: pkcs11.Mechanism.DES_KEY_GEN
- ref: pkcs11.mechanisms.Mechanism.DES_KEY_GEN
- ref: pkcs11.Mechanism.DES_ECB
- ref: pkcs11.mechanisms.Mechanism.DES_ECB
- ref: pkcs11.Mechanism.DES_CBC
- ref: pkcs11.mechanisms.Mechanism.DES_CBC
- ref: pkcs11.Mechanism.DES_CBC_PAD
- ref: pkcs11.mechanisms.Mechanism.DES_CBC_PAD
- ref: pkcs11.KeyType.DES
- ref: pkcs11.mechanisms.KeyType.DES
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (DES/CBC/NoPadding)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (DES/CBC/NoPadding)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (DES/CBC/NoPadding)$
- call: pyasn1.type.univ.ObjectIdentifier
