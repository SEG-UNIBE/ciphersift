id: python.key.load.public
kind: source
language: python
name: Public key loading in Python
description: 'Detects deserialisation of public keys whose algorithm is not visible statically: pyca/cryptography
  serialization.load_{pem,der,ssh}_public_key, load_ssh_public_identity and pyOpenSSL crypto.load_publickey.'
asset:
  type: related-crypto-material
  subtype: public-key
match:
- call: cryptography.hazmat.primitives.serialization.load_pem_public_key
- call: cryptography.hazmat.primitives.serialization.load_der_public_key
- call: cryptography.hazmat.primitives.serialization.load_ssh_public_key
- call: cryptography.hazmat.primitives.serialization.load_ssh_public_identity
- call: cryptography.hazmat.primitives.serialization.ssh.load_ssh_public_key
- call: cryptography.hazmat.primitives.serialization.ssh.load_ssh_public_identity
- call: cryptography.hazmat.primitives.serialization.base.load_pem_public_key
- call: cryptography.hazmat.primitives.serialization.base.load_der_public_key
- call: OpenSSL.crypto.load_publickey
