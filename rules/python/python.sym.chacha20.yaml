id: python.sym.chacha20
kind: source
language: python
name: ChaCha20 stream cipher usage in Python
description: >-
  Detects raw ChaCha20/XChaCha20 via pyca/cryptography Cipher(algorithms.ChaCha20(...)) and PyCryptodome
  Crypto.Cipher.ChaCha20.
asset:
  type: algorithm
  primitive: stream-cipher
  family: ChaCha20
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.ChaCha20
- call: Crypto.Cipher.ChaCha20.new
- call: Cryptodome.Cipher.ChaCha20.new
- ref: cryptography.hazmat.primitives.ciphers.algorithms.ChaCha20
