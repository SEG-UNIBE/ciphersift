id: python.asym.ed25519
kind: source
language: python
name: Ed25519 signatures in Python
description: >-
  Detects Ed25519 via pyca/cryptography ed25519, PyNaCl nacl.signing, PyCryptodome Crypto.Signature.eddsa,
  paramiko Ed25519Key and JWT EdDSA.
asset:
  type: algorithm
  primitive: signature
  family: Ed25519
  securityLevel: 128
match:
- call: cryptography.hazmat.primitives.asymmetric.ed25519.Ed25519PrivateKey
- call: cryptography.hazmat.primitives.asymmetric.ed25519.Ed25519PublicKey
- call: nacl.signing.SigningKey
- call: nacl.signing.VerifyKey
- call: paramiko.Ed25519Key
- call: paramiko.ed25519key.Ed25519Key
- call: Crypto.Signature.eddsa.new
- call: Cryptodome.Signature.eddsa.new
- call: jwt.encode
  stringContains:
  - EdDSA
- call: jwt.decode
  stringContains:
  - EdDSA
- call: asn1crypto.algos.SignedDigestAlgorithm
  dictItems:
    algorithm: ^ed25519$|^(Ed25519)$
- call: asn1crypto.algos.SignedDigestAlgorithmId
  firstString: ^ed25519$|^(Ed25519)$
- ref: signxml.SignatureMethod.EDDSA_ED25519
- ref: signxml.algorithms.SignatureMethod.EDDSA_ED25519
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (Ed25519)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (Ed25519)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (Ed25519)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (Ed25519)$
