id: python.asym.ed25519
kind: source
language: python
name: Ed25519 signatures in Python
description: >-
  Detects Ed25519 via pyca/cryptography ed25519, PyNaCl nacl.signing, PyCryptodome Crypto.Signature.eddsa,
  paramiko Ed25519Key and JWT EdDSA.
asset:
  type: algorithm
  primitive: signature
  family: Ed25519
  securityLevel: 128
match:
- call: cryptography.hazmat.primitives.asymmetric.ed25519.Ed25519PrivateKey
- call: cryptography.hazmat.primitives.asymmetric.ed25519.Ed25519PublicKey
- call: nacl.signing.SigningKey
- call: nacl.signing.VerifyKey
- call: paramiko.Ed25519Key
- call: paramiko.ed25519key.Ed25519Key
- call: Crypto.Signature.eddsa.new
- call: Cryptodome.Signature.eddsa.new
- call: jwt.encode
  stringContains:
  - EdDSA
- call: jwt.decode
  stringContains:
  - EdDSA
