id: python.sym.3des
kind: source
language: python
name: Triple DES usage in Python
description: >-
  Detects 3DES/TripleDES via pyca/cryptography (incl. hazmat.decrepit), PyCryptodome Crypto.Cipher.DES3
  and pyDes.triple_des.
asset:
  type: algorithm
  primitive: block-cipher
  family: 3DES
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.TripleDES
  - cryptography.hazmat.decrepit.ciphers.algorithms.TripleDES
- call: Crypto.Cipher.DES3.new
- call: Cryptodome.Cipher.DES3.new
- call: pyDes.triple_des
- ref: cryptography.hazmat.primitives.ciphers.algorithms.TripleDES
- ref: cryptography.hazmat.decrepit.ciphers.algorithms.TripleDES
- call: asn1crypto.algos.EncryptionAlgorithm
  dictItems:
    algorithm: ^tripledes_3key$|^(DESede/CBC/NoPadding)$
- call: asn1crypto.algos.EncryptionAlgorithmId
  firstString: ^tripledes_3key$|^(DESede/CBC/NoPadding)$
- ref: pkcs11.Mechanism.DES3_KEY_GEN
- ref: pkcs11.mechanisms.Mechanism.DES3_KEY_GEN
- ref: pkcs11.Mechanism.DES3_ECB
- ref: pkcs11.mechanisms.Mechanism.DES3_ECB
- ref: pkcs11.Mechanism.DES3_CBC
- ref: pkcs11.mechanisms.Mechanism.DES3_CBC
- ref: pkcs11.Mechanism.DES3_CBC_PAD
- ref: pkcs11.mechanisms.Mechanism.DES3_CBC_PAD
- ref: pkcs11.KeyType.DES3
- ref: pkcs11.mechanisms.KeyType.DES3
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (DESede/CBC/NoPadding|DESedeWrap)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (DESede/CBC/NoPadding|DESedeWrap)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (DESede/CBC/NoPadding|DESedeWrap)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (DESede/CBC/NoPadding|DESedeWrap)$
