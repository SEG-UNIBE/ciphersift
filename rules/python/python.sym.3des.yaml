id: python.sym.3des
kind: source
language: python
name: Triple DES usage in Python
description: >-
  Detects 3DES/TripleDES via pyca/cryptography (incl. hazmat.decrepit), PyCryptodome Crypto.Cipher.DES3
  and pyDes.triple_des.
asset:
  type: algorithm
  primitive: block-cipher
  family: 3DES
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.TripleDES
  - cryptography.hazmat.decrepit.ciphers.algorithms.TripleDES
- call: Crypto.Cipher.DES3.new
- call: Cryptodome.Cipher.DES3.new
- call: pyDes.triple_des
