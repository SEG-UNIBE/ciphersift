id: python.sym.blowfish
kind: source
language: python
name: Blowfish usage in Python
description: Detects the Blowfish block cipher via pyca/cryptography and PyCryptodome.
asset:
  type: algorithm
  primitive: block-cipher
  family: Blowfish
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.Blowfish
  - cryptography.hazmat.decrepit.ciphers.algorithms.Blowfish
- call: Crypto.Cipher.Blowfish.new
- call: Cryptodome.Cipher.Blowfish.new
- ref: cryptography.hazmat.primitives.ciphers.algorithms.Blowfish
- ref: cryptography.hazmat.decrepit.ciphers.algorithms.Blowfish
# DECISIONS B-P-LIT: IANA SSH / JOSE / TLS-group names as exact string literals in value positions; names and
# sources: ciphersift-boost-assess/python-recall/names.tsv (IANA SSH, JOSE and TLS registries, fetched 2026-10-18)
- literal: ['blowfish-cbc', 'blowfish-ctr']
  feature: python-literal-names
