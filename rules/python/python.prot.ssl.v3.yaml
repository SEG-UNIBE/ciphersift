id: python.prot.ssl.v3
kind: source
language: python
name: SSL 3.0 explicitly configured in Python
description: Detects explicit SSLv3 via ssl.PROTOCOL_SSLv3, TLSVersion.SSLv3 or pyOpenSSL SSLv3_METHOD.
asset:
  type: protocol
  protocol: tls
  version: '3.0'
match:
- call: ssl.SSLContext
  anySymbol:
  - ssl.PROTOCOL_SSLv3
  - OpenSSL.SSL.SSLv3_METHOD
  - OpenSSL.SSL.SSL3_VERSION
- call: ssl.wrap_socket
  anySymbol:
  - ssl.PROTOCOL_SSLv3
  - OpenSSL.SSL.SSLv3_METHOD
  - OpenSSL.SSL.SSL3_VERSION
- call: OpenSSL.SSL.Context
  anySymbol:
  - ssl.PROTOCOL_SSLv3
  - OpenSSL.SSL.SSLv3_METHOD
  - OpenSSL.SSL.SSL3_VERSION
- call: ssl.create_default_context
  anySymbol:
  - ssl.PROTOCOL_SSLv3
  - OpenSSL.SSL.SSLv3_METHOD
  - OpenSSL.SSL.SSL3_VERSION
- method:
  - set_min_proto_version
  - set_max_proto_version
  anySymbol:
  - ssl.PROTOCOL_SSLv3
  - OpenSSL.SSL.SSLv3_METHOD
  - OpenSSL.SSL.SSL3_VERSION
- assign: minimum_version
  value: SSLv3\b
- assign: maximum_version
  value: SSLv3\b
- anyCall: true
  kwargs:
    ssl_version: PROTOCOL_SSLv3$
