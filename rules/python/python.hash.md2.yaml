id: python.hash.md2
kind: source
language: python
name: MD2 hash usage in Python
description: Detects MD2 via PyCryptodome Crypto.Hash.MD2.
asset:
  type: algorithm
  primitive: hash
  family: MD2
  securityLevel: 64
match:
- call: Crypto.Hash.MD2
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.MD2
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: asn1crypto.algos.DigestAlgorithm
  dictItems:
    algorithm: ^md2$|^(MD2)$
- call: asn1crypto.algos.DigestAlgorithmId
  firstString: ^md2$|^(MD2)$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (MD2)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (MD2)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (MD2)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (MD2)$
