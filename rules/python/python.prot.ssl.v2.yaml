id: python.prot.ssl.v2
kind: source
language: python
name: SSL 2.0 explicitly configured in Python
description: Detects explicit SSLv2 via ssl.PROTOCOL_SSLv2 or pyOpenSSL SSLv2_METHOD.
asset:
  type: protocol
  protocol: tls
  version: '2.0'
match:
- call: ssl.SSLContext
  anySymbol:
  - ssl.PROTOCOL_SSLv2
  - OpenSSL.SSL.SSLv2_METHOD
- call: ssl.wrap_socket
  anySymbol:
  - ssl.PROTOCOL_SSLv2
  - OpenSSL.SSL.SSLv2_METHOD
- call: OpenSSL.SSL.Context
  anySymbol:
  - ssl.PROTOCOL_SSLv2
  - OpenSSL.SSL.SSLv2_METHOD
- call: ssl.create_default_context
  anySymbol:
  - ssl.PROTOCOL_SSLv2
  - OpenSSL.SSL.SSLv2_METHOD
- method:
  - set_min_proto_version
  - set_max_proto_version
  anySymbol:
  - ssl.PROTOCOL_SSLv2
  - OpenSSL.SSL.SSLv2_METHOD
- anyCall: true
  kwargs:
    ssl_version: PROTOCOL_SSLv2$
# DECISIONS P3-TLS: the version of an ldap3 Tls object (https://ldap3.readthedocs.io/en/latest/ssltls.html)
- call: ldap3.Tls
  anySymbol:
  - ssl.PROTOCOL_SSLv2
  - OpenSSL.SSL.SSLv2_METHOD
