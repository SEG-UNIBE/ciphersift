id: python.sym.aes.ctr
kind: source
language: python
name: AES-CTR usage in Python
description: >-
  Detects AES in CTR mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_CTR).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CTR
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.CTR
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_CTR
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_CTR
- call: pyaes.AESModeOfOperationCTR
- call: pyaes.aes.AESModeOfOperationCTR
- ref: pkcs11.Mechanism.AES_CTR
- ref: pkcs11.mechanisms.Mechanism.AES_CTR
