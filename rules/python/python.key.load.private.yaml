id: python.key.load.private
kind: source
language: python
name: Private key loading in Python
description: 'Detects deserialisation of private keys whose algorithm is not visible statically: pyca/cryptography
  serialization.load_{pem,der,ssh}_private_key and pyOpenSSL crypto.load_privatekey.'
asset:
  type: related-crypto-material
  subtype: private-key
match:
- call: cryptography.hazmat.primitives.serialization.load_pem_private_key
- call: cryptography.hazmat.primitives.serialization.load_der_private_key
- call: cryptography.hazmat.primitives.serialization.load_ssh_private_key
- call: cryptography.hazmat.primitives.serialization.ssh.load_ssh_private_key
- call: cryptography.hazmat.primitives.serialization.base.load_pem_private_key
- call: cryptography.hazmat.primitives.serialization.base.load_der_private_key
- call: OpenSSL.crypto.load_privatekey
