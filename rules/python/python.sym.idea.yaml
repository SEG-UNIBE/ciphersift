id: python.sym.idea
kind: source
language: python
name: IDEA usage in Python
description: Detects the IDEA block cipher via pyca/cryptography.
asset:
  type: algorithm
  primitive: block-cipher
  family: IDEA
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.IDEA
  - cryptography.hazmat.decrepit.ciphers.algorithms.IDEA
- ref: cryptography.hazmat.primitives.ciphers.algorithms.IDEA
- ref: cryptography.hazmat.decrepit.ciphers.algorithms.IDEA
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15, B-A4) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (IDEA/CBC/NoPadding)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (IDEA/CBC/NoPadding)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (IDEA/CBC/NoPadding)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (IDEA/CBC/NoPadding)$
# DECISIONS B-P-LIT: IANA SSH / JOSE / TLS-group names as exact string literals in value positions; names and
# sources: ciphersift-boost-assess/python-recall/names.tsv (IANA SSH, JOSE and TLS registries, fetched 2026-10-18)
- literal: ['idea-cbc', 'idea-ctr']
  feature: python-literal-names
