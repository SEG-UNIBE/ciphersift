id: python.sym.aes.siv
kind: source
language: python
name: AES-SIV usage in Python
description: >-
  Detects AES in SIV mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_SIV).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: SIV
match:
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_SIV
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_SIV
- call: cryptography.hazmat.primitives.ciphers.aead.AESSIV
- call: cryptography.hazmat.primitives.ciphers.aead.AESSIV.generate_key
  param:
    keyword: bit_length
    index: 0
