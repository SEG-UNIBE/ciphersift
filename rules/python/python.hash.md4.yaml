id: python.hash.md4
kind: source
language: python
name: MD4 hash usage in Python
description: Detects MD4 via hashlib.new('md4'), PyCryptodome Crypto.Hash.MD4 and passlib nthash.
asset:
  type: algorithm
  primitive: hash
  family: MD4
  securityLevel: 64
match:
- call: hashlib.new
  firstString: (?i)^md4$
- call: Crypto.Hash.MD4
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: Cryptodome.Hash.MD4
  reportAt:
  - encrypt
  - decrypt
  - sign
  - verify
- call: passlib.hash.nthash
- call: passlib.hash.bsd_nthash
