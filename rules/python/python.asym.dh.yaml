id: python.asym.dh
kind: source
language: python
name: Diffie-Hellman key agreement in Python
description: Detects finite-field Diffie-Hellman via pyca/cryptography dh.
asset:
  type: algorithm
  primitive: key-agree
  family: DH
match:
- call: cryptography.hazmat.primitives.asymmetric.dh.generate_parameters
  param:
    keyword: key_size
    index: 1
- call: cryptography.hazmat.primitives.asymmetric.dh.DHParameterNumbers
- call: cryptography.hazmat.primitives.asymmetric.dh.DHPrivateNumbers
- call: cryptography.hazmat.primitives.asymmetric.dh.DHPublicNumbers
- ref: pkcs11.Mechanism.DH_PKCS_KEY_PAIR_GEN
- ref: pkcs11.mechanisms.Mechanism.DH_PKCS_KEY_PAIR_GEN
- ref: pkcs11.Mechanism.DH_PKCS_DERIVE
- ref: pkcs11.mechanisms.Mechanism.DH_PKCS_DERIVE
- ref: pkcs11.Mechanism.DH_PKCS_PARAMETER_GEN
- ref: pkcs11.mechanisms.Mechanism.DH_PKCS_PARAMETER_GEN
- ref: pkcs11.KeyType.DH
- ref: pkcs11.mechanisms.KeyType.DH
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (DH)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (DH)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (DH)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (DH)$
# DECISIONS B-P-ISI: pyca's key interfaces (https://cryptography.io/en/latest/hazmat/primitives/asymmetric/),
# used in isinstance key dispatch and key-type tables
- call: cryptography.hazmat.primitives.asymmetric.dh.DHPrivateKey
  feature: python-isinstance-keys
- call: cryptography.hazmat.primitives.asymmetric.dh.DHPublicKey
  feature: python-isinstance-keys
