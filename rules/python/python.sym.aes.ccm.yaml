id: python.sym.aes.ccm
kind: source
language: python
name: AES-CCM usage in Python
description: >-
  Detects AES in CCM mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_CCM).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CCM
match:
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_CCM
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_CCM
- call: cryptography.hazmat.primitives.ciphers.aead.AESCCM
- call: cryptography.hazmat.primitives.ciphers.aead.AESCCM.generate_key
  param:
    keyword: bit_length
    index: 0
