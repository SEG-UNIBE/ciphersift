id: python.sym.aes.ccm
kind: source
language: python
name: AES-CCM usage in Python
description: >-
  Detects AES in CCM mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_CCM).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CCM
match:
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_CCM
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_CCM
- call: cryptography.hazmat.primitives.ciphers.aead.AESCCM
- call: cryptography.hazmat.primitives.ciphers.aead.AESCCM.generate_key
  param:
    keyword: bit_length
    index: 0
- ref: pkcs11.Mechanism.AES_CCM
- ref: pkcs11.mechanisms.Mechanism.AES_CCM
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (AES_128/CCM/NoPadding|AES_192/CCM/NoPadding|AES_256/CCM/NoPadding)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (AES_128/CCM/NoPadding|AES_192/CCM/NoPadding|AES_256/CCM/NoPadding)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (AES_128/CCM/NoPadding|AES_192/CCM/NoPadding|AES_256/CCM/NoPadding)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (AES_128/CCM/NoPadding|AES_192/CCM/NoPadding|AES_256/CCM/NoPadding)$
