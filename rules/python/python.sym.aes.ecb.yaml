id: python.sym.aes.ecb
kind: source
language: python
name: AES-ECB usage in Python
description: >-
  Detects AES in ECB mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_ECB).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: ECB
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.ECB
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_ECB
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_ECB
- call: pyaes.AESModeOfOperationECB
- call: pyaes.aes.AESModeOfOperationECB
- ref: pkcs11.Mechanism.AES_ECB
- ref: pkcs11.mechanisms.Mechanism.AES_ECB
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (AES_128/ECB/NoPadding|AES_192/ECB/NoPadding|AES_256/ECB/NoPadding)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (AES_128/ECB/NoPadding|AES_192/ECB/NoPadding|AES_256/ECB/NoPadding)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (AES_128/ECB/NoPadding|AES_192/ECB/NoPadding|AES_256/ECB/NoPadding)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (AES_128/ECB/NoPadding|AES_192/ECB/NoPadding|AES_256/ECB/NoPadding)$
