id: python.sym.aes.ecb
kind: source
language: python
name: AES-ECB usage in Python
description: >-
  Detects AES in ECB mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_ECB).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: ECB
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.ECB
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_ECB
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_ECB
