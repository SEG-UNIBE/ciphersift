id: python.sym.aes.gcm
kind: source
language: python
name: AES-GCM usage in Python
description: >-
  Detects AES in GCM mode via pyca/cryptography (Cipher/modes or AEAD classes) and PyCryptodome AES.new(...,
  MODE_GCM).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: GCM
match:
- call: cryptography.hazmat.primitives.ciphers.Cipher
  anySymbol:
  - cryptography.hazmat.primitives.ciphers.algorithms.AES
  - cryptography.hazmat.primitives.ciphers.algorithms.AES128
  - cryptography.hazmat.primitives.ciphers.algorithms.AES256
  allSymbols:
  - cryptography.hazmat.primitives.ciphers.modes.GCM
- call: Crypto.Cipher.AES.new
  anySymbol:
  - Crypto.Cipher.AES.MODE_GCM
- call: Cryptodome.Cipher.AES.new
  anySymbol:
  - Cryptodome.Cipher.AES.MODE_GCM
- call: cryptography.hazmat.primitives.ciphers.aead.AESGCM
- call: cryptography.hazmat.primitives.ciphers.aead.AESGCM.generate_key
  param:
    keyword: bit_length
    index: 0
