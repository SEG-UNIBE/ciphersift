id: python.kdf.pbkdf2
kind: source
language: python
name: PBKDF2 key derivation in Python
description: >-
  Detects PBKDF2 via hashlib.pbkdf2_hmac, pyca/cryptography PBKDF2HMAC, PyCryptodome Crypto.Protocol.KDF.PBKDF2
  and passlib pbkdf2_* schemes.
asset:
  type: algorithm
  primitive: kdf
  family: PBKDF2
match:
- call: hashlib.pbkdf2_hmac
- call: cryptography.hazmat.primitives.kdf.pbkdf2.PBKDF2HMAC
- call: passlib.hash.pbkdf2_sha1
- call: passlib.hash.pbkdf2_sha256
- call: passlib.hash.pbkdf2_sha512
- call: passlib.hash.django_pbkdf2_sha256
- call: Crypto.Protocol.KDF.PBKDF2
- call: Cryptodome.Protocol.KDF.PBKDF2
- call: passlib.context.CryptContext
  stringContains:
  - pbkdf2_sha
- call: asn1crypto.algos.KdfAlgorithm
  dictItems:
    algorithm: ^pbkdf2$|^(PBKDF2)$
- call: asn1crypto.algos.KdfAlgorithmId
  firstString: ^pbkdf2$|^(PBKDF2)$
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (PBKDF2)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (PBKDF2)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (PBKDF2)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (PBKDF2)$
# DECISIONS B-P-LIT: IANA SSH / JOSE / TLS-group names as exact string literals in value positions; names and
# sources: ciphersift-boost-assess/python-recall/names.tsv (IANA SSH, JOSE and TLS registries, fetched 2026-10-18)
- literal: ['PBES2-HS256+A128KW', 'PBES2-HS384+A192KW', 'PBES2-HS512+A256KW']
  feature: python-literal-names
