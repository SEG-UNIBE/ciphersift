id: python.asym.ecdh
kind: source
language: python
name: ECDH key agreement in Python
description: Detects ECDH key agreement via pyca/cryptography ec.ECDH and PyCryptodome Crypto.Protocol.DH.
asset:
  type: algorithm
  primitive: key-agree
  family: EC
match:
- call: cryptography.hazmat.primitives.asymmetric.ec.ECDH
- call: Crypto.Protocol.DH.key_agreement
- call: Cryptodome.Protocol.DH.key_agreement
- ref: pkcs11.Mechanism.ECDH1_DERIVE
- ref: pkcs11.mechanisms.Mechanism.ECDH1_DERIVE
- ref: pkcs11.Mechanism.ECDH1_COFACTOR_DERIVE
- ref: pkcs11.mechanisms.Mechanism.ECDH1_COFACTOR_DERIVE
# Dotted OIDs of the built-in OID table (SPEC 5.11, DECISIONS E15) arrive here as the names they map to.
- call: cryptography.x509.ObjectIdentifier
  firstString: (ECDH|ECMQV)$
- call: cryptography.x509.oid.ObjectIdentifier
  firstString: (ECDH|ECMQV)$
- call: asn1crypto.core.ObjectIdentifier
  firstString: (ECDH|ECMQV)$
- call: pyasn1.type.univ.ObjectIdentifier
  firstString: (ECDH|ECMQV)$
