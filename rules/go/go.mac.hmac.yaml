# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.mac.hmac
kind: source
language: go
name: HMAC usage in Go
description: >-
  Detects crypto/hmac.New (the hash function is reported by the hash rules) and golang.org/x/crypto/nacl/auth
  (HMAC-SHA-512-256).
asset:
  type: algorithm
  primitive: mac
  family: HMAC
match:
- call: crypto/hmac.New
- call: golang.org/x/crypto/nacl/auth.Sum
- call: golang.org/x/crypto/nacl/auth.Verify
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.HS256
- ref: github.com/go-jose/go-jose/v3.HS384
- ref: github.com/go-jose/go-jose/v3.HS512
- ref: github.com/go-jose/go-jose/v4.HS256
- ref: github.com/go-jose/go-jose/v4.HS384
- ref: github.com/go-jose/go-jose/v4.HS512
- ref: gopkg.in/square/go-jose.v2.HS256
- ref: gopkg.in/square/go-jose.v2.HS384
- ref: gopkg.in/square/go-jose.v2.HS512
- ref: gopkg.in/go-jose/go-jose.v2.HS256
- ref: gopkg.in/go-jose/go-jose.v2.HS384
- ref: gopkg.in/go-jose/go-jose.v2.HS512
- ref: github.com/golang-jwt/jwt.SigningMethodHS256
- ref: github.com/golang-jwt/jwt.SigningMethodHS384
- ref: github.com/golang-jwt/jwt.SigningMethodHS512
- ref: github.com/golang-jwt/jwt/v4.SigningMethodHS256
- ref: github.com/golang-jwt/jwt/v4.SigningMethodHS384
- ref: github.com/golang-jwt/jwt/v4.SigningMethodHS512
- ref: github.com/golang-jwt/jwt/v5.SigningMethodHS256
- ref: github.com/golang-jwt/jwt/v5.SigningMethodHS384
- ref: github.com/golang-jwt/jwt/v5.SigningMethodHS512
# DECISIONS T3-G10: names as string literals in value positions: the IANA SSH / JOSE / TLS-group names of the Python rules
# (DECISIONS B-P-LIT, spec/PROVENANCE.md) and OpenSSL cipher names as used by OpenVPN --data-ciphers.
- literal: ['A128CBC-HS256', 'A192CBC-HS384', 'A256CBC-HS512', 'HS1', 'HS256', 'HS384', 'HS512', 'PBES2-HS256+A128KW', 'PBES2-HS384+A192KW', 'PBES2-HS512+A256KW', 'hmac-md5', 'hmac-md5-96', 'hmac-sha1', 'hmac-sha1-96', 'hmac-sha2-256', 'hmac-sha2-512']
  feature: go-literal-names
