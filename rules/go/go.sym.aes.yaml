# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.sym.aes
kind: source
language: go
name: AES usage in Go (mode not statically determinable)
description: >-
  Detects AES block ciphers created with crypto/aes.NewCipher. The mode is reported by the go.sym.aes.* rules at
  the crypto/cipher mode call when the block is known to be AES.
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
match:
- call: crypto/aes.NewCipher
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.A128KW
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v3.A192KW
  param:
    value: '192'
- ref: github.com/go-jose/go-jose/v3.A256KW
  param:
    value: '256'
- ref: github.com/go-jose/go-jose/v4.A128KW
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v4.A192KW
  param:
    value: '192'
- ref: github.com/go-jose/go-jose/v4.A256KW
  param:
    value: '256'
- ref: gopkg.in/square/go-jose.v2.A128KW
  param:
    value: '128'
- ref: gopkg.in/square/go-jose.v2.A192KW
  param:
    value: '192'
- ref: gopkg.in/square/go-jose.v2.A256KW
  param:
    value: '256'
- ref: gopkg.in/go-jose/go-jose.v2.A128KW
  param:
    value: '128'
- ref: gopkg.in/go-jose/go-jose.v2.A192KW
  param:
    value: '192'
- ref: gopkg.in/go-jose/go-jose.v2.A256KW
  param:
    value: '256'
