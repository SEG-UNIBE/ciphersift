# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.hash.sha1
kind: source
language: go
name: SHA-1 hash usage in Go
description: >-
  Detects crypto/sha1 and crypto.SHA1.
asset:
  type: algorithm
  primitive: hash
  family: SHA1
  securityLevel: 80
match:
- call: crypto/sha1.New
- call: crypto/sha1.Sum
- ref: crypto.SHA1
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: github.com/sigstore/sigstore/pkg/cryptoutils.SKID
# DECISIONS T3-G10: names as string literals in value positions: the IANA SSH / JOSE / TLS-group names of the Python rules
# (DECISIONS B-P-LIT, spec/PROVENANCE.md) and OpenSSL cipher names as used by OpenVPN --data-ciphers.
- literal: ['HS1', 'RS1', 'diffie-hellman-group-exchange-sha1', 'diffie-hellman-group1-sha1', 'diffie-hellman-group14-sha1', 'hmac-sha1', 'hmac-sha1-96', 'rsa1024-sha1']
  feature: go-literal-names
