# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.sym.mode.gcm
kind: source
language: go
name: GCM block-cipher mode in Go (cipher not determined)
description: >-
  Fallback: a crypto/cipher NewGCM/NewGCMWithNonceSize/NewGCMWithTagSize/NewGCMWithRandomNonce call whose block
  cipher is not known statically. Reported only when no cipher-specific rule matches the call.
asset:
  type: algorithm
  primitive: block-cipher
  variant: GCM
match:
- call: crypto/cipher.NewGCM
- call: crypto/cipher.NewGCMWithNonceSize
- call: crypto/cipher.NewGCMWithTagSize
- call: crypto/cipher.NewGCMWithRandomNonce
