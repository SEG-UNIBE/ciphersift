# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.sym.aes.cbc
kind: source
language: go
name: AES-CBC usage in Go
description: >-
  Detects AES in CBC mode: a crypto/cipher NewCBCEncrypter/NewCBCDecrypter call whose block cipher comes from
  crypto/aes.NewCipher (directly or through a variable).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CBC
match:
- call: crypto/cipher.NewCBCEncrypter
  anySymbol:
  - crypto/aes.NewCipher
- call: crypto/cipher.NewCBCDecrypter
  anySymbol:
  - crypto/aes.NewCipher
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.A128CBC_HS256
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v3.A192CBC_HS384
  param:
    value: '192'
- ref: github.com/go-jose/go-jose/v3.A256CBC_HS512
  param:
    value: '256'
- ref: github.com/go-jose/go-jose/v4.A128CBC_HS256
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v4.A192CBC_HS384
  param:
    value: '192'
- ref: github.com/go-jose/go-jose/v4.A256CBC_HS512
  param:
    value: '256'
- ref: gopkg.in/square/go-jose.v2.A128CBC_HS256
  param:
    value: '128'
- ref: gopkg.in/square/go-jose.v2.A192CBC_HS384
  param:
    value: '192'
- ref: gopkg.in/square/go-jose.v2.A256CBC_HS512
  param:
    value: '256'
- ref: gopkg.in/go-jose/go-jose.v2.A128CBC_HS256
  param:
    value: '128'
- ref: gopkg.in/go-jose/go-jose.v2.A192CBC_HS384
  param:
    value: '192'
- ref: gopkg.in/go-jose/go-jose.v2.A256CBC_HS512
  param:
    value: '256'
