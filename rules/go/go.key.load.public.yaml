# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.key.load.public
kind: source
language: go
name: Public key loading in Go
description: >-
  Detects public-key parsing via crypto/x509 (PKIX, PKCS#1) and golang.org/x/crypto/ssh (authorized_keys,
  known_hosts, wire format).
asset:
  type: related-crypto-material
  subtype: public-key
match:
- call: crypto/x509.ParsePKIXPublicKey
- call: crypto/x509.ParsePKCS1PublicKey
- call: golang.org/x/crypto/ssh.ParseAuthorizedKey
- call: golang.org/x/crypto/ssh.ParsePublicKey
- call: golang.org/x/crypto/ssh.ParseKnownHosts
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age/agessh.ParseRecipient
- call: github.com/sigstore/sigstore/pkg/cryptoutils.UnmarshalPEMToPublicKey
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPublicKeyToPEM
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPublicKeyToDER
- call: crypto/x509.MarshalPKIXPublicKey
- call: crypto/x509.MarshalPKCS1PublicKey
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/ecdh.Curve.NewPublicKey
- method: crypto/ecdh.PrivateKey.PublicKey
# DECISIONS T3-G2 (benchmark-informed in the choice of package: node, chain33): go-ethereum crypto and accounts/keystore,
# written from https://pkg.go.dev/github.com/ethereum/go-ethereum/crypto and .../accounts/keystore (v1.17.8, fetched 2026-10-18).
- call: github.com/ethereum/go-ethereum/crypto.UnmarshalPubkey
- call: github.com/ethereum/go-ethereum/crypto.DecompressPubkey
- call: github.com/ethereum/go-ethereum/crypto.FromECDSAPub
- call: github.com/ethereum/go-ethereum/crypto.CompressPubkey
# DECISIONS T3-G5 (benchmark-informed in the choice of packages: chain33): secp256k1 of btcec/v2 (https://pkg.go.dev/github.com/btcsuite/btcd/btcec/v2
# and .../btcec/v2/ecdsa, v2.5.0) and libp2p key functions (https://pkg.go.dev/github.com/libp2p/go-libp2p/core/crypto, v0.43.0-rc2), fetched 2026-10-18.
- call: github.com/libp2p/go-libp2p/core/crypto.UnmarshalPublicKey
- call: github.com/libp2p/go-libp2p/core/crypto.MarshalPublicKey
- call: github.com/libp2p/go-libp2p/core/crypto.PubKeyToStdKey
