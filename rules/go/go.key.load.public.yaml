# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.key.load.public
kind: source
language: go
name: Public key loading in Go
description: >-
  Detects public-key parsing via crypto/x509 (PKIX, PKCS#1) and golang.org/x/crypto/ssh (authorized_keys,
  known_hosts, wire format).
asset:
  type: related-crypto-material
  subtype: public-key
match:
- call: crypto/x509.ParsePKIXPublicKey
- call: crypto/x509.ParsePKCS1PublicKey
- call: golang.org/x/crypto/ssh.ParseAuthorizedKey
- call: golang.org/x/crypto/ssh.ParsePublicKey
- call: golang.org/x/crypto/ssh.ParseKnownHosts
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age/agessh.ParseRecipient
- call: github.com/sigstore/sigstore/pkg/cryptoutils.UnmarshalPEMToPublicKey
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPublicKeyToPEM
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPublicKeyToDER
- call: crypto/x509.MarshalPKIXPublicKey
- call: crypto/x509.MarshalPKCS1PublicKey
