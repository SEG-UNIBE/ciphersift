id: go.sym.des
kind: source
language: go
name: DES usage in Go
description: >-
  Detects single DES via crypto/des.NewCipher.
asset:
  type: algorithm
  primitive: block-cipher
  family: DES
match:
- call: crypto/des.NewCipher
