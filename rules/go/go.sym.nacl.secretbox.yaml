id: go.sym.nacl.secretbox
kind: source
language: go
name: NaCl SecretBox (XSalsa20-Poly1305) usage in Go
description: >-
  Detects golang.org/x/crypto/nacl/secretbox Seal / Open.
asset:
  type: algorithm
  primitive: stream-cipher
  family: XSalsa20
  variant: Poly1305
match:
- call: golang.org/x/crypto/nacl/secretbox.Seal
- call: golang.org/x/crypto/nacl/secretbox.Open
