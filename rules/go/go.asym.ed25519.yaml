# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.ed25519
kind: source
language: go
name: Ed25519 signatures in Go
description: >-
  Detects Ed25519 via crypto/ed25519, golang.org/x/crypto/ed25519, golang.org/x/crypto/nacl/sign and the
  crypto/x509 Ed25519 algorithms.
asset:
  type: algorithm
  primitive: signature
  family: Ed25519
  securityLevel: 128
match:
- call: crypto/ed25519.GenerateKey
- call: crypto/ed25519.NewKeyFromSeed
- call: crypto/ed25519.Sign
- call: crypto/ed25519.Verify
- call: crypto/ed25519.VerifyWithOptions
- call: golang.org/x/crypto/ed25519.GenerateKey
- call: golang.org/x/crypto/ed25519.NewKeyFromSeed
- call: golang.org/x/crypto/ed25519.Sign
- call: golang.org/x/crypto/ed25519.Verify
- call: golang.org/x/crypto/nacl/sign.GenerateKey
- call: golang.org/x/crypto/nacl/sign.Sign
- call: golang.org/x/crypto/nacl/sign.Open
- ref: crypto/x509.Ed25519
- ref: crypto/x509.PureEd25519
# DECISIONS F4 (benchmark-informed): key construction, as the Java *KeySpec and Python *Numbers patterns.
# Conversions of raw key bytes to the key types (written like calls).
- call: crypto/ed25519.PrivateKey
- call: crypto/ed25519.PublicKey
- call: golang.org/x/crypto/ed25519.PrivateKey
- call: golang.org/x/crypto/ed25519.PublicKey
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age/agessh.NewEd25519Identity
- call: filippo.io/age/agessh.NewEd25519Recipient
- call: github.com/cloudflare/circl/sign/ed25519.GenerateKey
- call: github.com/cloudflare/circl/sign/ed25519.NewKeyFromSeed
- call: github.com/cloudflare/circl/sign/ed25519.Scheme
- call: github.com/cloudflare/circl/sign/ed25519.Sign
- call: github.com/cloudflare/circl/sign/ed25519.SignPh
- call: github.com/cloudflare/circl/sign/ed25519.SignWithCtx
- call: github.com/cloudflare/circl/sign/ed25519.Verify
- call: github.com/cloudflare/circl/sign/ed25519.VerifyAny
- call: github.com/cloudflare/circl/sign/ed25519.VerifyPh
- call: github.com/cloudflare/circl/sign/ed25519.VerifyWithCtx
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/ed25519.PrivateKey.Sign
- method: crypto/ed25519.PrivateKey.Public
- method: crypto/ed25519.PrivateKey.Seed
- method: golang.org/x/crypto/ed25519.PrivateKey.Sign
- method: golang.org/x/crypto/ed25519.PrivateKey.Public
- method: golang.org/x/crypto/ed25519.PrivateKey.Seed
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ED25519
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ED25519_PH
- call: github.com/sigstore/sigstore/pkg/signature/options.WithED25519ph
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmEd25519
- ref: github.com/go-piv/piv-go/piv.AlgorithmEd25519
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.EdDSA
- ref: github.com/go-jose/go-jose/v3.ED25519
- ref: github.com/go-jose/go-jose/v4.EdDSA
- ref: github.com/go-jose/go-jose/v4.ED25519
- ref: gopkg.in/square/go-jose.v2.EdDSA
- ref: gopkg.in/square/go-jose.v2.ED25519
- ref: gopkg.in/go-jose/go-jose.v2.EdDSA
- ref: gopkg.in/go-jose/go-jose.v2.ED25519
- ref: github.com/golang-jwt/jwt.SigningMethodEdDSA
- ref: github.com/golang-jwt/jwt/v4.SigningMethodEdDSA
- ref: github.com/golang-jwt/jwt/v5.SigningMethodEdDSA
# DECISIONS T3-G4: golang-jwt PEM key parsers whose name fixes the algorithm (https://pkg.go.dev/github.com/golang-jwt/jwt/v5).
- call: github.com/golang-jwt/jwt.ParseEdPrivateKeyFromPEM
- call: github.com/golang-jwt/jwt.ParseEdPublicKeyFromPEM
- call: github.com/golang-jwt/jwt/v4.ParseEdPrivateKeyFromPEM
- call: github.com/golang-jwt/jwt/v4.ParseEdPublicKeyFromPEM
- call: github.com/golang-jwt/jwt/v5.ParseEdPrivateKeyFromPEM
- call: github.com/golang-jwt/jwt/v5.ParseEdPublicKeyFromPEM
# DECISIONS T3-G5 (benchmark-informed in the choice of packages: chain33): secp256k1 of btcec/v2 (https://pkg.go.dev/github.com/btcsuite/btcd/btcec/v2
# and .../btcec/v2/ecdsa, v2.5.0) and libp2p key functions (https://pkg.go.dev/github.com/libp2p/go-libp2p/core/crypto, v0.43.0-rc2), fetched 2026-10-18.
- call: github.com/libp2p/go-libp2p/core/crypto.GenerateEd25519Key
- call: github.com/libp2p/go-libp2p/core/crypto.UnmarshalEd25519PrivateKey
- call: github.com/libp2p/go-libp2p/core/crypto.UnmarshalEd25519PublicKey
- ref: github.com/libp2p/go-libp2p/core/crypto.Ed25519
