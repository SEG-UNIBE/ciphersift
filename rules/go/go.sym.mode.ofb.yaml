id: go.sym.mode.ofb
kind: source
language: go
name: OFB block-cipher mode in Go (cipher not determined)
description: >-
  Fallback: a crypto/cipher NewOFB call whose block cipher is not known statically. Reported only when no
  cipher-specific rule matches the call.
asset:
  type: algorithm
  primitive: block-cipher
  variant: OFB
match:
- call: crypto/cipher.NewOFB
