id: go.sym.chacha20
kind: source
language: go
name: ChaCha20 stream cipher usage in Go
description: >-
  Detects the unauthenticated ChaCha20 stream cipher and HChaCha20 of golang.org/x/crypto/chacha20.
asset:
  type: algorithm
  primitive: stream-cipher
  family: ChaCha20
match:
- call: golang.org/x/crypto/chacha20.NewUnauthenticatedCipher
- call: golang.org/x/crypto/chacha20.HChaCha20
