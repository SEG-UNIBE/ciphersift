# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.sym.chacha20poly1305
kind: source
language: go
name: ChaCha20-Poly1305 AEAD usage in Go
description: >-
  Detects the ChaCha20-Poly1305 and XChaCha20-Poly1305 AEADs of golang.org/x/crypto/chacha20poly1305.
asset:
  type: algorithm
  primitive: stream-cipher
  family: ChaCha20
  variant: Poly1305
match:
- call: golang.org/x/crypto/chacha20poly1305.New
- call: golang.org/x/crypto/chacha20poly1305.NewX
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.ChaCha20Poly1305
- call: filippo.io/hpke.ChaCha20Poly1305
