# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.ecdh
kind: source
language: go
name: ECDH key agreement in Go
description: >-
  Detects the crypto/ecdh NIST curves and the crypto/tls NIST key-exchange groups (curve as parameter).
asset:
  type: algorithm
  primitive: key-agree
  family: EC
match:
- call: crypto/ecdh.P256
  param:
    value: P-256
- call: crypto/ecdh.P384
  param:
    value: P-384
- call: crypto/ecdh.P521
  param:
    value: P-521
- ref: crypto/tls.CurveP256
  param:
    value: P-256
- ref: crypto/tls.CurveP384
  param:
    value: P-384
- ref: crypto/tls.CurveP521
  param:
    value: P-521
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.DHKEM
  anySymbol: [crypto/ecdh.P256, crypto/ecdh.P384, crypto/ecdh.P521]
  param:
    index: 0
- call: filippo.io/hpke.DHKEM
  anySymbol: [crypto/ecdh.P256, crypto/ecdh.P384, crypto/ecdh.P521]
  param:
    index: 0
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/ecdh.PrivateKey.ECDH
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.ECDH_ES_A128KW
- ref: github.com/go-jose/go-jose/v3.ECDH_ES_A192KW
- ref: github.com/go-jose/go-jose/v3.ECDH_ES_A256KW
- ref: github.com/go-jose/go-jose/v3.ECDH_ES
- ref: github.com/go-jose/go-jose/v4.ECDH_ES_A128KW
- ref: github.com/go-jose/go-jose/v4.ECDH_ES_A192KW
- ref: github.com/go-jose/go-jose/v4.ECDH_ES_A256KW
- ref: github.com/go-jose/go-jose/v4.ECDH_ES
- ref: gopkg.in/square/go-jose.v2.ECDH_ES_A128KW
- ref: gopkg.in/square/go-jose.v2.ECDH_ES_A192KW
- ref: gopkg.in/square/go-jose.v2.ECDH_ES_A256KW
- ref: gopkg.in/square/go-jose.v2.ECDH_ES
- ref: gopkg.in/go-jose/go-jose.v2.ECDH_ES_A128KW
- ref: gopkg.in/go-jose/go-jose.v2.ECDH_ES_A192KW
- ref: gopkg.in/go-jose/go-jose.v2.ECDH_ES_A256KW
- ref: gopkg.in/go-jose/go-jose.v2.ECDH_ES
# DECISIONS T3-G5 (benchmark-informed in the choice of packages: chain33): secp256k1 of btcec/v2 (https://pkg.go.dev/github.com/btcsuite/btcd/btcec/v2
# and .../btcec/v2/ecdsa, v2.5.0) and libp2p key functions (https://pkg.go.dev/github.com/libp2p/go-libp2p/core/crypto, v0.43.0-rc2), fetched 2026-10-18.
- call: github.com/btcsuite/btcd/btcec/v2.GenerateSharedSecret
  param:
    value: secp256k1
