# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.prot.ssh
kind: source
language: go
name: SSH protocol usage in Go
description: >-
  Detects golang.org/x/crypto/ssh clients, servers, configurations, signers and known_hosts handling.
asset:
  type: protocol
  protocol: ssh
match:
- call: golang.org/x/crypto/ssh.Dial
- call: golang.org/x/crypto/ssh.NewClient
- call: golang.org/x/crypto/ssh.NewClientConn
- call: golang.org/x/crypto/ssh.NewServerConn
- call: golang.org/x/crypto/ssh.NewSignerFromKey
- call: golang.org/x/crypto/ssh.NewSignerFromSigner
- call: golang.org/x/crypto/ssh.NewPublicKey
- call: golang.org/x/crypto/ssh.PublicKeys
- composite: golang.org/x/crypto/ssh.ClientConfig
- composite: golang.org/x/crypto/ssh.ServerConfig
- call: golang.org/x/crypto/ssh/knownhosts.New
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: golang.org/x/crypto/ssh.Signer.Sign
- method: golang.org/x/crypto/ssh.PublicKey.Verify
- method: golang.org/x/crypto/ssh.AlgorithmSigner.SignWithAlgorithm
- method: golang.org/x/crypto/ssh.MultiAlgorithmSigner.SignWithAlgorithm
- method: golang.org/x/crypto/ssh.CertChecker.Authenticate
- method: golang.org/x/crypto/ssh.CertChecker.CheckHostKey
- method: golang.org/x/crypto/ssh.CertChecker.CheckCert
- method: golang.org/x/crypto/ssh.Certificate.SignCert
- method: golang.org/x/crypto/ssh.ServerConfig.AddHostKey
