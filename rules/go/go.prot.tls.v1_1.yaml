id: go.prot.tls.v1_1
kind: source
language: go
name: TLS 1.1 explicitly configured in Go
description: >-
  Detects the crypto/tls constant VersionTLS11 (e.g. as MinVersion / MaxVersion), except in comparisons and
  switch cases.
asset:
  type: protocol
  protocol: tls
  version: '1.1'
match:
- ref: crypto/tls.VersionTLS11
