id: go.prot.tls.rc4
kind: source
language: go
name: RC4 TLS cipher suite in Go
description: >-
  Detects the crypto/tls RC4 cipher-suite constants.
asset:
  type: protocol
  subtype: rc4-cipher
  protocol: tls
match:
- ref: crypto/tls.TLS_RSA_WITH_RC4_128_SHA
- ref: crypto/tls.TLS_ECDHE_ECDSA_WITH_RC4_128_SHA
- ref: crypto/tls.TLS_ECDHE_RSA_WITH_RC4_128_SHA
# DECISIONS T3-G10: IANA TLS cipher-suite names (https://www.iana.org/assignments/tls-parameters/tls-parameters-4.csv, fetched
# 2026-10-18) as string literals, also in the hyphenated form of mbed TLS / OpenVPN --tls-cipher.
- literal: ['TLS_RSA_EXPORT_WITH_RC4_40_MD5', 'TLS-RSA-EXPORT-WITH-RC4-40-MD5', 'TLS_RSA_WITH_RC4_128_MD5', 'TLS-RSA-WITH-RC4-128-MD5', 'TLS_RSA_WITH_RC4_128_SHA', 'TLS-RSA-WITH-RC4-128-SHA', 'TLS_DH_anon_EXPORT_WITH_RC4_40_MD5', 'TLS-DH-anon-EXPORT-WITH-RC4-40-MD5', 'TLS_DH_anon_WITH_RC4_128_MD5', 'TLS-DH-anon-WITH-RC4-128-MD5', 'TLS_KRB5_WITH_RC4_128_SHA', 'TLS-KRB5-WITH-RC4-128-SHA', 'TLS_KRB5_WITH_RC4_128_MD5', 'TLS-KRB5-WITH-RC4-128-MD5', 'TLS_KRB5_EXPORT_WITH_RC4_40_SHA', 'TLS-KRB5-EXPORT-WITH-RC4-40-SHA', 'TLS_KRB5_EXPORT_WITH_RC4_40_MD5', 'TLS-KRB5-EXPORT-WITH-RC4-40-MD5', 'TLS_PSK_WITH_RC4_128_SHA', 'TLS-PSK-WITH-RC4-128-SHA', 'TLS_DHE_PSK_WITH_RC4_128_SHA', 'TLS-DHE-PSK-WITH-RC4-128-SHA', 'TLS_RSA_PSK_WITH_RC4_128_SHA', 'TLS-RSA-PSK-WITH-RC4-128-SHA', 'TLS_ECDH_ECDSA_WITH_RC4_128_SHA', 'TLS-ECDH-ECDSA-WITH-RC4-128-SHA', 'TLS_ECDHE_ECDSA_WITH_RC4_128_SHA', 'TLS-ECDHE-ECDSA-WITH-RC4-128-SHA', 'TLS_ECDH_RSA_WITH_RC4_128_SHA', 'TLS-ECDH-RSA-WITH-RC4-128-SHA', 'TLS_ECDHE_RSA_WITH_RC4_128_SHA', 'TLS-ECDHE-RSA-WITH-RC4-128-SHA', 'TLS_ECDH_anon_WITH_RC4_128_SHA', 'TLS-ECDH-anon-WITH-RC4-128-SHA', 'TLS_ECDHE_PSK_WITH_RC4_128_SHA', 'TLS-ECDHE-PSK-WITH-RC4-128-SHA']
  feature: go-literal-names
