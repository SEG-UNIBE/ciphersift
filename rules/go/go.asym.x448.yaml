id: go.asym.x448
kind: source
language: go
name: X448 key agreement in Go
description: >-
  Detects Curve448 Diffie-Hellman (X448) through github.com/cloudflare/circl/dh/x448.
asset:
  type: algorithm
  primitive: key-agree
  family: Curve448
  securityLevel: 224
match:
- call: github.com/cloudflare/circl/dh/x448.KeyGen
- call: github.com/cloudflare/circl/dh/x448.Shared
