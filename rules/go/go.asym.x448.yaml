# see spec/PROVENANCE.md ("Wrapper propagation") and DECISIONS T11 (benchmark-informed).
id: go.asym.x448
kind: source
language: go
name: X448 key agreement in Go
description: >-
  Detects Curve448 Diffie-Hellman (X448) through github.com/cloudflare/circl/dh/x448.
asset:
  type: algorithm
  primitive: key-agree
  family: Curve448
  securityLevel: 224
match:
- call: github.com/cloudflare/circl/dh/x448.KeyGen
- call: github.com/cloudflare/circl/dh/x448.Shared
# DECISIONS T3-G10: names as string literals in value positions: the IANA SSH / JOSE / TLS-group names of the Python rules
# (DECISIONS B-P-LIT, spec/PROVENANCE.md) and OpenSSL cipher names as used by OpenVPN --data-ciphers.
- literal: ['X448', 'curve448-sha512', 'x448']
  feature: go-literal-names
