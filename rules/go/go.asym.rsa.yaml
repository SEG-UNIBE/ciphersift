# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.rsa
kind: source
language: go
name: RSA key generation / usage in Go
description: >-
  Detects RSA key generation (crypto/rsa.GenerateKey, GenerateMultiPrimeKey; the key size is reported as
  parameter when it is a constant) and the x509.RSA public-key algorithm.
asset:
  type: algorithm
  primitive: signature
  family: RSA
match:
- call: crypto/rsa.GenerateKey
  param:
    index: 1
- call: crypto/rsa.GenerateMultiPrimeKey
  param:
    index: 2
- ref: crypto/x509.RSA
# DECISIONS F4 (benchmark-informed): key construction, as the Java *KeySpec and Python *Numbers patterns.
- composite: crypto/rsa.PrivateKey
- composite: crypto/rsa.PublicKey
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age/agessh.NewRSAIdentity
- call: filippo.io/age/agessh.NewRSARecipient
- call: github.com/sigstore/sigstore/pkg/cryptoutils.GeneratePEMEncodedRSAKeyPair
  param:
    index: 0
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.KeyTypeRSA
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.KeyTypeRSAHSM
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/rsa.PrivateKey.Sign
- method: crypto/rsa.PrivateKey.Decrypt
- method: crypto/rsa.PrivateKey.Precompute
- method: crypto/rsa.PrivateKey.Validate
- method: crypto/rsa.PrivateKey.Public
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- method: github.com/sigstore/sigstore/pkg/signature.AlgorithmDetails.GetRSAKeySize
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmRSA1024
  param:
    value: '1024'
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmRSA2048
  param:
    value: '2048'
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmRSA3072
  param:
    value: '3072'
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmRSA4096
  param:
    value: '4096'
- ref: github.com/go-piv/piv-go/piv.AlgorithmRSA1024
  param:
    value: '1024'
- ref: github.com/go-piv/piv-go/piv.AlgorithmRSA2048
  param:
    value: '2048'
# (the v1 module github.com/go-piv/piv-go/piv, v1.11.0, has no AlgorithmRSA3072 / AlgorithmRSA4096)
