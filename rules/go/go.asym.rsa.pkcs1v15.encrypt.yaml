# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.rsa.pkcs1v15.encrypt
kind: source
language: go
name: 'RSA PKCS#1 v1.5 encryption in Go'
description: >-
  Detects crypto/rsa EncryptPKCS1v15 / DecryptPKCS1v15 / DecryptPKCS1v15SessionKey and PKCS1v15DecryptOptions.
asset:
  type: algorithm
  subtype: pkcs1-v1_5-encrypt
  primitive: pke
  family: RSA
  variant: PKCS1v15
match:
- call: crypto/rsa.EncryptPKCS1v15
- call: crypto/rsa.DecryptPKCS1v15
- call: crypto/rsa.DecryptPKCS1v15SessionKey
- composite: crypto/rsa.PKCS1v15DecryptOptions
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.EncryptionAlgorithmRSA15
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.RSA1_5
- ref: github.com/go-jose/go-jose/v4.RSA1_5
- ref: gopkg.in/square/go-jose.v2.RSA1_5
- ref: gopkg.in/go-jose/go-jose.v2.RSA1_5
