# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.pqc.mlkem
kind: source
language: go
name: ML-KEM usage in Go
description: >-
  Detects crypto/mlkem (Go 1.24) keys and the crypto/tls hybrid ML-KEM key-exchange groups (parameter set as
  parameter).
asset:
  type: algorithm
  primitive: kem
  family: ML-KEM
match:
- call: crypto/mlkem.GenerateKey768
  param:
    value: ML-KEM-768
- call: crypto/mlkem.NewDecapsulationKey768
  param:
    value: ML-KEM-768
- call: crypto/mlkem.NewEncapsulationKey768
  param:
    value: ML-KEM-768
- call: crypto/mlkem.GenerateKey1024
  param:
    value: ML-KEM-1024
- call: crypto/mlkem.NewDecapsulationKey1024
  param:
    value: ML-KEM-1024
- call: crypto/mlkem.NewEncapsulationKey1024
  param:
    value: ML-KEM-1024
- ref: crypto/tls.X25519MLKEM768
  param:
    value: ML-KEM-768
- ref: crypto/tls.SecP256r1MLKEM768
  param:
    value: ML-KEM-768
- ref: crypto/tls.SecP384r1MLKEM1024
  param:
    value: ML-KEM-1024
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.MLKEM768
  param:
    value: ML-KEM-768
- call: crypto/hpke.MLKEM768X25519
  param:
    value: ML-KEM-768
- call: crypto/hpke.MLKEM768P256
  param:
    value: ML-KEM-768
- call: crypto/hpke.MLKEM1024
  param:
    value: ML-KEM-1024
- call: crypto/hpke.MLKEM1024P384
  param:
    value: ML-KEM-1024
- call: filippo.io/hpke.MLKEM768
  param:
    value: ML-KEM-768
- call: filippo.io/hpke.MLKEM768X25519
  param:
    value: ML-KEM-768
- call: filippo.io/hpke.MLKEM768P256
  param:
    value: ML-KEM-768
- call: filippo.io/hpke.MLKEM1024
  param:
    value: ML-KEM-1024
- call: filippo.io/hpke.MLKEM1024P384
  param:
    value: ML-KEM-1024
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age.GenerateHybridIdentity
  param:
    value: ML-KEM-768
- call: filippo.io/age.ParseHybridIdentity
  param:
    value: ML-KEM-768
- call: filippo.io/age.ParseHybridRecipient
  param:
    value: ML-KEM-768
- call: github.com/cloudflare/circl/kem/mlkem/mlkem512.GenerateKeyPair
  param:
    value: ML-KEM-512
- call: github.com/cloudflare/circl/kem/mlkem/mlkem512.NewKeyFromSeed
  param:
    value: ML-KEM-512
- call: github.com/cloudflare/circl/kem/mlkem/mlkem512.Scheme
  param:
    value: ML-KEM-512
- call: github.com/cloudflare/circl/kem/mlkem/mlkem768.GenerateKeyPair
  param:
    value: ML-KEM-768
- call: github.com/cloudflare/circl/kem/mlkem/mlkem768.NewKeyFromSeed
  param:
    value: ML-KEM-768
- call: github.com/cloudflare/circl/kem/mlkem/mlkem768.Scheme
  param:
    value: ML-KEM-768
- call: github.com/cloudflare/circl/kem/mlkem/mlkem1024.GenerateKeyPair
  param:
    value: ML-KEM-1024
- call: github.com/cloudflare/circl/kem/mlkem/mlkem1024.NewKeyFromSeed
  param:
    value: ML-KEM-1024
- call: github.com/cloudflare/circl/kem/mlkem/mlkem1024.Scheme
  param:
    value: ML-KEM-1024
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/mlkem.DecapsulationKey768.Decapsulate
  param:
    value: ML-KEM-768
- method: crypto/mlkem.DecapsulationKey768.EncapsulationKey
  param:
    value: ML-KEM-768
- method: crypto/mlkem.EncapsulationKey768.Encapsulate
  param:
    value: ML-KEM-768
- method: crypto/mlkem.DecapsulationKey1024.Decapsulate
  param:
    value: ML-KEM-1024
- method: crypto/mlkem.DecapsulationKey1024.EncapsulationKey
  param:
    value: ML-KEM-1024
- method: crypto/mlkem.EncapsulationKey1024.Encapsulate
  param:
    value: ML-KEM-1024
# DECISIONS T3-G10: names as string literals in value positions: the IANA SSH / JOSE / TLS-group names of the Python rules
# (DECISIONS B-P-LIT, spec/PROVENANCE.md) and OpenSSL cipher names as used by OpenVPN --data-ciphers.
- literal: ['MLKEM1024', 'MLKEM512', 'MLKEM512X25519', 'MLKEM768', 'SecP256r1Kyber768Draft00', 'SecP256r1MLKEM512', 'SecP256r1MLKEM768', 'SecP384r1MLKEM1024', 'X25519Kyber768Draft00', 'X25519MLKEM768', 'curveSM2MLKEM768', 'mlkem1024-sha384', 'mlkem1024nistp384-sha384', 'mlkem512-sha256', 'mlkem768-sha256', 'mlkem768nistp256-sha256', 'mlkem768x25519-sha256']
  feature: go-literal-names
