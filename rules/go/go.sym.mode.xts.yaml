id: go.sym.mode.xts
kind: source
language: go
name: XTS block-cipher mode in Go (cipher not determined)
description: >-
  Fallback: golang.org/x/crypto/xts.NewCipher with a cipher function that is not known statically.
asset:
  type: algorithm
  primitive: block-cipher
  variant: XTS
match:
- call: golang.org/x/crypto/xts.NewCipher
