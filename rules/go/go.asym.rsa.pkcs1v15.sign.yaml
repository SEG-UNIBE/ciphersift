# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.rsa.pkcs1v15.sign
kind: source
language: go
name: 'RSA PKCS#1 v1.5 signatures in Go'
description: >-
  Detects crypto/rsa SignPKCS1v15 / VerifyPKCS1v15 and the crypto/x509 *WithRSA signature algorithms.
asset:
  type: algorithm
  primitive: signature
  family: RSA
  variant: PKCS1v15
match:
- call: crypto/rsa.SignPKCS1v15
- call: crypto/rsa.VerifyPKCS1v15
- ref: crypto/x509.MD2WithRSA
- ref: crypto/x509.MD5WithRSA
- ref: crypto/x509.SHA1WithRSA
- ref: crypto/x509.SHA256WithRSA
- ref: crypto/x509.SHA384WithRSA
- ref: crypto/x509.SHA512WithRSA
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.SignatureAlgorithmRS256
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.SignatureAlgorithmRS384
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.SignatureAlgorithmRS512
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKCS1_RSA_PKCS1V5
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PKCS1V5
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PKCS1V15_2048_SHA256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PKCS1V15_3072_SHA256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PKCS1V15_4096_SHA256
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.RS256
- ref: github.com/go-jose/go-jose/v3.RS384
- ref: github.com/go-jose/go-jose/v3.RS512
- ref: github.com/go-jose/go-jose/v4.RS256
- ref: github.com/go-jose/go-jose/v4.RS384
- ref: github.com/go-jose/go-jose/v4.RS512
- ref: gopkg.in/square/go-jose.v2.RS256
- ref: gopkg.in/square/go-jose.v2.RS384
- ref: gopkg.in/square/go-jose.v2.RS512
- ref: gopkg.in/go-jose/go-jose.v2.RS256
- ref: gopkg.in/go-jose/go-jose.v2.RS384
- ref: gopkg.in/go-jose/go-jose.v2.RS512
- ref: github.com/golang-jwt/jwt.SigningMethodRS256
- ref: github.com/golang-jwt/jwt.SigningMethodRS384
- ref: github.com/golang-jwt/jwt.SigningMethodRS512
- ref: github.com/golang-jwt/jwt/v4.SigningMethodRS256
- ref: github.com/golang-jwt/jwt/v4.SigningMethodRS384
- ref: github.com/golang-jwt/jwt/v4.SigningMethodRS512
- ref: github.com/golang-jwt/jwt/v5.SigningMethodRS256
- ref: github.com/golang-jwt/jwt/v5.SigningMethodRS384
- ref: github.com/golang-jwt/jwt/v5.SigningMethodRS512
