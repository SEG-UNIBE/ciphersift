# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.sym.aes.gcm
kind: source
language: go
name: AES-GCM usage in Go
description: >-
  Detects AES in GCM mode: a crypto/cipher NewGCM/NewGCMWithNonceSize/NewGCMWithTagSize/NewGCMWithRandomNonce
  call whose block cipher comes from crypto/aes.NewCipher (directly or through a variable).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: GCM
match:
- call: crypto/cipher.NewGCM
  anySymbol:
  - crypto/aes.NewCipher
- call: crypto/cipher.NewGCMWithNonceSize
  anySymbol:
  - crypto/aes.NewCipher
- call: crypto/cipher.NewGCMWithTagSize
  anySymbol:
  - crypto/aes.NewCipher
- call: crypto/cipher.NewGCMWithRandomNonce
  anySymbol:
  - crypto/aes.NewCipher
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.AES128GCM
- call: crypto/hpke.AES256GCM
- call: filippo.io/hpke.AES128GCM
- call: filippo.io/hpke.AES256GCM
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- ref: github.com/flynn/noise.CipherAESGCM
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.A128GCMKW
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v3.A128GCM
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v3.A192GCMKW
  param:
    value: '192'
- ref: github.com/go-jose/go-jose/v3.A192GCM
  param:
    value: '192'
- ref: github.com/go-jose/go-jose/v3.A256GCMKW
  param:
    value: '256'
- ref: github.com/go-jose/go-jose/v3.A256GCM
  param:
    value: '256'
- ref: github.com/go-jose/go-jose/v4.A128GCMKW
  param:
    value: '128'
- ref: github.com/go-jose/go-jose/v4.A128GCM
  param:
