id: go.prot.ssl.v3
kind: source
language: go
name: SSL 3.0 explicitly configured in Go
description: >-
  Detects the crypto/tls constant VersionSSL30 (e.g. as MinVersion / MaxVersion), except in comparisons and
  switch cases.
asset:
  type: protocol
  protocol: tls
  version: '3.0'
match:
- ref: crypto/tls.VersionSSL30
