# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.key.load.private
kind: source
language: go
name: Private key loading in Go
description: >-
  Detects private-key parsing via crypto/x509 (PKCS#1, PKCS#8, SEC 1) and golang.org/x/crypto/ssh.
asset:
  type: related-crypto-material
  subtype: private-key
match:
- call: crypto/x509.ParsePKCS1PrivateKey
- call: crypto/x509.ParsePKCS8PrivateKey
- call: crypto/x509.ParseECPrivateKey
- call: golang.org/x/crypto/ssh.ParsePrivateKey
- call: golang.org/x/crypto/ssh.ParseRawPrivateKey
- call: golang.org/x/crypto/ssh.ParsePrivateKeyWithPassphrase
- call: golang.org/x/crypto/ssh.ParseRawPrivateKeyWithPassphrase
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age/agessh.ParseIdentity
- call: filippo.io/age/agessh.NewEncryptedSSHIdentity
- call: github.com/sigstore/sigstore/pkg/cryptoutils.UnmarshalPEMToPrivateKey
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPrivateKeyToPEM
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPrivateKeyToDER
- call: github.com/sigstore/sigstore/pkg/cryptoutils.MarshalPrivateKeyToEncryptedDER
- call: crypto/x509.MarshalPKCS1PrivateKey
- call: crypto/x509.MarshalPKCS8PrivateKey
- call: crypto/x509.MarshalECPrivateKey
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/ecdh.Curve.NewPrivateKey
- method: crypto/ecdh.Curve.GenerateKey
# DECISIONS T3-G2 (benchmark-informed in the choice of package: node, chain33): go-ethereum crypto and accounts/keystore,
# written from https://pkg.go.dev/github.com/ethereum/go-ethereum/crypto and .../accounts/keystore (v1.17.8, fetched 2026-10-18).
- call: github.com/ethereum/go-ethereum/crypto.ToECDSA
- call: github.com/ethereum/go-ethereum/crypto.ToECDSAUnsafe
- call: github.com/ethereum/go-ethereum/crypto.HexToECDSA
- call: github.com/ethereum/go-ethereum/crypto.LoadECDSA
- call: github.com/ethereum/go-ethereum/crypto.FromECDSA
- call: github.com/ethereum/go-ethereum/crypto.SaveECDSA
