# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.hash.sha2
kind: source
language: go
name: SHA-2 hash usage in Go
description: >-
  Detects SHA-224/256/384/512 and SHA-512/224, SHA-512/256 via crypto/sha256, crypto/sha512 and the crypto.Hash
  constants (also as function values, e.g. hmac.New(sha256.New, key)).
asset:
  type: algorithm
  primitive: hash
  family: SHA2
match:
- call: crypto/sha256.New
- call: crypto/sha256.New224
- call: crypto/sha256.Sum256
- call: crypto/sha256.Sum224
- call: crypto/sha512.New
- call: crypto/sha512.New384
- call: crypto/sha512.New512_224
- call: crypto/sha512.New512_256
- call: crypto/sha512.Sum512
- call: crypto/sha512.Sum384
- call: crypto/sha512.Sum512_224
- call: crypto/sha512.Sum512_256
- ref: crypto.SHA224
- ref: crypto.SHA256
- ref: crypto.SHA384
- ref: crypto.SHA512
- ref: crypto.SHA512_224
- ref: crypto.SHA512_256
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.HKDFSHA256
- call: crypto/hpke.HKDFSHA384
- call: crypto/hpke.HKDFSHA512
- call: filippo.io/hpke.HKDFSHA256
- call: filippo.io/hpke.HKDFSHA384
- call: filippo.io/hpke.HKDFSHA512
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: github.com/google/go-containerregistry/pkg/v1.SHA256
- ref: github.com/flynn/noise.HashSHA256
- ref: github.com/flynn/noise.HashSHA512
