# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.hash.sha2
kind: source
language: go
name: SHA-2 hash usage in Go
description: >-
  Detects SHA-224/256/384/512 and SHA-512/224, SHA-512/256 via crypto/sha256, crypto/sha512 and the crypto.Hash
  constants (also as function values, e.g. hmac.New(sha256.New, key)).
asset:
  type: algorithm
  primitive: hash
  family: SHA2
match:
- call: crypto/sha256.New
- call: crypto/sha256.New224
- call: crypto/sha256.Sum256
- call: crypto/sha256.Sum224
- call: crypto/sha512.New
- call: crypto/sha512.New384
- call: crypto/sha512.New512_224
- call: crypto/sha512.New512_256
- call: crypto/sha512.Sum512
- call: crypto/sha512.Sum384
- call: crypto/sha512.Sum512_224
- call: crypto/sha512.Sum512_256
- ref: crypto.SHA224
- ref: crypto.SHA256
- ref: crypto.SHA384
- ref: crypto.SHA512
- ref: crypto.SHA512_224
- ref: crypto.SHA512_256
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.HKDFSHA256
- call: crypto/hpke.HKDFSHA384
- call: crypto/hpke.HKDFSHA512
- call: filippo.io/hpke.HKDFSHA256
- call: filippo.io/hpke.HKDFSHA384
- call: filippo.io/hpke.HKDFSHA512
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: github.com/google/go-containerregistry/pkg/v1.SHA256
- ref: github.com/flynn/noise.HashSHA256
- ref: github.com/flynn/noise.HashSHA512
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.HashAlgorithm_SHA2_256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.HashAlgorithm_SHA2_384
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.HashAlgorithm_SHA2_512
# DECISIONS T3-G10: names as string literals in value positions: the IANA SSH / JOSE / TLS-group names of the Python rules
# (DECISIONS B-P-LIT, spec/PROVENANCE.md) and OpenSSL cipher names as used by OpenVPN --data-ciphers.
- literal: ['A128CBC-HS256', 'A192CBC-HS384', 'A256CBC-HS512', 'ES256', 'ES256K', 'ES384', 'ES512', 'HS256', 'HS384', 'HS512', 'PBES2-HS256+A128KW', 'PBES2-HS384+A192KW', 'PBES2-HS512+A256KW', 'PS256', 'PS384', 'PS512', 'RS256', 'RS384', 'RS512', 'RSA-OAEP-256', 'RSA-OAEP-384', 'RSA-OAEP-512', 'curve25519-sha256', 'curve448-sha512', 'diffie-hellman-group-exchange-sha256', 'diffie-hellman-group14-sha256', 'diffie-hellman-group15-sha512', 'diffie-hellman-group16-sha512', 'diffie-hellman-group17-sha512', 'diffie-hellman-group18-sha512', 'ecdh-sha2-nistp256', 'ecdh-sha2-nistp384', 'ecdh-sha2-nistp521', 'ecdsa-sha2-nistp256', 'ecdsa-sha2-nistp384', 'ecdsa-sha2-nistp521', 'ecmqv-sha2', 'hmac-sha2-256', 'hmac-sha2-512', 'mlkem1024-sha384', 'mlkem1024nistp384-sha384', 'mlkem512-sha256', 'mlkem768-sha256', 'mlkem768nistp256-sha256', 'mlkem768x25519-sha256', 'rsa-sha2-256', 'rsa-sha2-512', 'rsa2048-sha256', 'sntrup761x25519-sha512', 'x509v3-ecdsa-sha2-nistp256', 'x509v3-ecdsa-sha2-nistp384', 'x509v3-ecdsa-sha2-nistp521', 'x509v3-rsa2048-sha256']
  feature: go-literal-names
