id: go.sym.aes.ctr
kind: source
language: go
name: AES-CTR usage in Go
description: >-
  Detects AES in CTR mode: a crypto/cipher NewCTR call whose block cipher comes from crypto/aes.NewCipher
  (directly or through a variable).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CTR
match:
- call: crypto/cipher.NewCTR
  anySymbol:
  - crypto/aes.NewCipher
