id: go.sym.aes.ofb
kind: source
language: go
name: AES-OFB usage in Go
description: >-
  Detects AES in OFB mode: a crypto/cipher NewOFB call whose block cipher comes from crypto/aes.NewCipher
  (directly or through a variable).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: OFB
match:
- call: crypto/cipher.NewOFB
  anySymbol:
  - crypto/aes.NewCipher
