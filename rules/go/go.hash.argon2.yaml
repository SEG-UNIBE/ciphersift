id: go.hash.argon2
kind: source
language: go
name: Argon2 password hashing in Go
description: >-
  Detects golang.org/x/crypto/argon2 Key (Argon2i) and IDKey (Argon2id).
asset:
  type: algorithm
  primitive: kdf
  family: Argon2
match:
- call: golang.org/x/crypto/argon2.Key
- call: golang.org/x/crypto/argon2.IDKey
