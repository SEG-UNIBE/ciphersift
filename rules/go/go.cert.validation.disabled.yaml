id: go.cert.validation.disabled
kind: source
language: go
name: TLS certificate validation disabled in Go
description: >-
  Detects InsecureSkipVerify set to true (in a composite literal such as tls.Config{...} or by assignment).
asset:
  type: related-crypto-material
  subtype: cert-validation-disabled
match:
- assign: InsecureSkipVerify
  value: ^true$
