# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.mac.poly1305
kind: source
language: go
name: Poly1305 MAC usage in Go
description: >-
  Detects golang.org/x/crypto/poly1305.
asset:
  type: algorithm
  primitive: mac
  family: Poly1305
match:
- call: golang.org/x/crypto/poly1305.Sum
- call: golang.org/x/crypto/poly1305.Verify
- call: golang.org/x/crypto/poly1305.New
