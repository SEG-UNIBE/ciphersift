id: go.prot.tls.context
kind: source
language: go
name: TLS context usage in Go
description: >-
  Detects crypto/tls configurations (Config, Dialer composite literals, new(tls.Config)), connections and
  listeners, and TLS cipher-suite constants.
asset:
  type: protocol
  protocol: tls
match:
- composite: crypto/tls.Config
- composite: crypto/tls.Dialer
- call: crypto/tls.Dial
- call: crypto/tls.DialWithDialer
- call: crypto/tls.Listen
- call: crypto/tls.NewListener
- call: crypto/tls.Client
- call: crypto/tls.Server
- ref: 'crypto/tls.TLS_*'
