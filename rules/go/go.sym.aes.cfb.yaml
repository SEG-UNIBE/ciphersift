id: go.sym.aes.cfb
kind: source
language: go
name: AES-CFB usage in Go
description: >-
  Detects AES in CFB mode: a crypto/cipher NewCFBEncrypter/NewCFBDecrypter call whose block cipher comes from
  crypto/aes.NewCipher (directly or through a variable).
asset:
  type: algorithm
  primitive: block-cipher
  family: AES
  variant: CFB
match:
- call: crypto/cipher.NewCFBEncrypter
  anySymbol:
  - crypto/aes.NewCipher
- call: crypto/cipher.NewCFBDecrypter
  anySymbol:
  - crypto/aes.NewCipher
