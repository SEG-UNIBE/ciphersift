# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.ecdsa
kind: source
language: go
name: ECDSA signatures in Go
description: >-
  Detects crypto/ecdsa key generation (curve as parameter), signing and verification and the crypto/x509 ECDSA
  algorithms.
asset:
  type: algorithm
  primitive: signature
  family: EC
match:
- call: crypto/ecdsa.GenerateKey
  param:
    index: 0
- call: crypto/ecdsa.Sign
- call: crypto/ecdsa.SignASN1
- call: crypto/ecdsa.Verify
- call: crypto/ecdsa.VerifyASN1
- ref: crypto/x509.ECDSA
- ref: crypto/x509.ECDSAWithSHA1
- ref: crypto/x509.ECDSAWithSHA256
- ref: crypto/x509.ECDSAWithSHA384
- ref: crypto/x509.ECDSAWithSHA512
# DECISIONS F4 (benchmark-informed): key construction, as the Java *KeySpec and Python *Numbers patterns.
- composite: crypto/ecdsa.PrivateKey
- composite: crypto/ecdsa.PublicKey
# Go 1.25 raw encodings (curve as parameter, like GenerateKey).
- call: crypto/ecdsa.ParseRawPrivateKey
  param:
    index: 0
- call: crypto/ecdsa.ParseUncompressedPublicKey
  param:
    index: 0
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: github.com/sigstore/sigstore/pkg/cryptoutils.GeneratePEMEncodedECDSAKeyPair
  param:
    index: 0
- ref: github.com/miekg/pkcs11.CKM_ECDSA*
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/ecdsa.PrivateKey.Sign
- method: crypto/ecdsa.PrivateKey.Public
- method: crypto/ecdsa.PrivateKey.ECDH
- method: crypto/ecdsa.PublicKey.ECDH
