# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.ecdsa
kind: source
language: go
name: ECDSA signatures in Go
description: >-
  Detects crypto/ecdsa key generation (curve as parameter), signing and verification and the crypto/x509 ECDSA
  algorithms.
asset:
  type: algorithm
  primitive: signature
  family: EC
match:
- call: crypto/ecdsa.GenerateKey
  param:
    index: 0
- call: crypto/ecdsa.Sign
- call: crypto/ecdsa.SignASN1
- call: crypto/ecdsa.Verify
- call: crypto/ecdsa.VerifyASN1
- ref: crypto/x509.ECDSA
- ref: crypto/x509.ECDSAWithSHA1
- ref: crypto/x509.ECDSAWithSHA256
- ref: crypto/x509.ECDSAWithSHA384
- ref: crypto/x509.ECDSAWithSHA512
# DECISIONS F4 (benchmark-informed): key construction, as the Java *KeySpec and Python *Numbers patterns.
- composite: crypto/ecdsa.PrivateKey
- composite: crypto/ecdsa.PublicKey
# Go 1.25 raw encodings (curve as parameter, like GenerateKey).
- call: crypto/ecdsa.ParseRawPrivateKey
  param:
    index: 0
- call: crypto/ecdsa.ParseUncompressedPublicKey
  param:
    index: 0
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: github.com/sigstore/sigstore/pkg/cryptoutils.GeneratePEMEncodedECDSAKeyPair
  param:
    index: 0
- ref: github.com/miekg/pkcs11.CKM_ECDSA*
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/ecdsa.PrivateKey.Sign
- method: crypto/ecdsa.PrivateKey.Public
- method: crypto/ecdsa.PrivateKey.ECDH
- method: crypto/ecdsa.PublicKey.ECDH
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ECDSA_P256_SHA_256
  param:
    value: P-256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ECDSA_P256_HMAC_SHA_256
  param:
    value: P-256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ECDSA_P384_SHA_384
  param:
    value: P-384
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ECDSA_P384_SHA_256
  param:
    value: P-384
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ECDSA_P521_SHA_512
  param:
    value: P-521
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_ECDSA_P521_SHA_256
  param:
    value: P-521
# DECISIONS T3-G2 (benchmark-informed in the choice of package: node, chain33): go-ethereum crypto and accounts/keystore,
# written from https://pkg.go.dev/github.com/ethereum/go-ethereum/crypto and .../accounts/keystore (v1.17.8, fetched 2026-10-18).
- call: github.com/ethereum/go-ethereum/crypto.Sign
  param:
    value: secp256k1
- call: github.com/ethereum/go-ethereum/crypto.VerifySignature
  param:
    value: secp256k1
- call: github.com/ethereum/go-ethereum/crypto.Ecrecover
  param:
    value: secp256k1
- call: github.com/ethereum/go-ethereum/crypto.SigToPub
  param:
    value: secp256k1
- method: github.com/ethereum/go-ethereum/accounts/keystore.KeyStore.SignHash
  param:
    value: secp256k1
- method: github.com/ethereum/go-ethereum/accounts/keystore.KeyStore.SignHashWithPassphrase
  param:
    value: secp256k1
- method: github.com/ethereum/go-ethereum/accounts/keystore.KeyStore.SignTx
  param:
    value: secp256k1
- method: github.com/ethereum/go-ethereum/accounts/keystore.KeyStore.SignTxWithPassphrase
  param:
    value: secp256k1
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.ES256
  param:
    value: P-256
- ref: github.com/go-jose/go-jose/v3.ES384
  param:
    value: P-384
- ref: github.com/go-jose/go-jose/v3.ES512
  param:
    value: P-521
- ref: github.com/go-jose/go-jose/v4.ES256
  param:
    value: P-256
- ref: github.com/go-jose/go-jose/v4.ES384
  param:
    value: P-384
- ref: github.com/go-jose/go-jose/v4.ES512
  param:
    value: P-521
- ref: gopkg.in/square/go-jose.v2.ES256
  param:
    value: P-256
- ref: gopkg.in/square/go-jose.v2.ES384
  param:
    value: P-384
- ref: gopkg.in/square/go-jose.v2.ES512
  param:
    value: P-521
- ref: gopkg.in/go-jose/go-jose.v2.ES256
  param:
    value: P-256
- ref: gopkg.in/go-jose/go-jose.v2.ES384
  param:
    value: P-384
- ref: gopkg.in/go-jose/go-jose.v2.ES512
  param:
    value: P-521
- ref: github.com/golang-jwt/jwt.SigningMethodES256
  param:
    value: P-256
- ref: github.com/golang-jwt/jwt.SigningMethodES384
  param:
    value: P-384
- ref: github.com/golang-jwt/jwt.SigningMethodES512
  param:
    value: P-521
- ref: github.com/golang-jwt/jwt/v4.SigningMethodES256
  param:
    value: P-256
- ref: github.com/golang-jwt/jwt/v4.SigningMethodES384
  param:
    value: P-384
- ref: github.com/golang-jwt/jwt/v4.SigningMethodES512
  param:
    value: P-521
- ref: github.com/golang-jwt/jwt/v5.SigningMethodES256
  param:
    value: P-256
- ref: github.com/golang-jwt/jwt/v5.SigningMethodES384
  param:
    value: P-384
- ref: github.com/golang-jwt/jwt/v5.SigningMethodES512
  param:
    value: P-521
# DECISIONS T3-G5 (benchmark-informed in the choice of packages: chain33): secp256k1 of btcec/v2 (https://pkg.go.dev/github.com/btcsuite/btcd/btcec/v2
# and .../btcec/v2/ecdsa, v2.5.0) and libp2p key functions (https://pkg.go.dev/github.com/libp2p/go-libp2p/core/crypto, v0.43.0-rc2), fetched 2026-10-18.
- call: github.com/btcsuite/btcd/btcec/v2/ecdsa.Sign
  param:
    value: secp256k1
- call: github.com/btcsuite/btcd/btcec/v2/ecdsa.SignCompact
  param:
    value: secp256k1
- call: github.com/btcsuite/btcd/btcec/v2/ecdsa.RecoverCompact
  param:
    value: secp256k1
- call: github.com/libp2p/go-libp2p/core/crypto.GenerateECDSAKeyPair
  param:
    value: P-256
- call: github.com/libp2p/go-libp2p/core/crypto.GenerateECDSAKeyPairWithCurve
  param:
    index: 0
- ref: github.com/libp2p/go-libp2p/core/crypto.ECDSA
