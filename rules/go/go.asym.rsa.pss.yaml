id: go.asym.rsa.pss
kind: source
language: go
name: RSA-PSS signatures in Go
description: >-
  Detects crypto/rsa SignPSS / VerifyPSS, PSSOptions and the crypto/x509 *WithRSAPSS signature algorithms.
asset:
  type: algorithm
  primitive: signature
  family: RSA
  variant: PSS
match:
- call: crypto/rsa.SignPSS
- call: crypto/rsa.VerifyPSS
- composite: crypto/rsa.PSSOptions
- ref: crypto/x509.SHA256WithRSAPSS
- ref: crypto/x509.SHA384WithRSAPSS
- ref: crypto/x509.SHA512WithRSAPSS
