# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.rsa.pss
kind: source
language: go
name: RSA-PSS signatures in Go
description: >-
  Detects crypto/rsa SignPSS / VerifyPSS, PSSOptions and the crypto/x509 *WithRSAPSS signature algorithms.
asset:
  type: algorithm
  primitive: signature
  family: RSA
  variant: PSS
match:
- call: crypto/rsa.SignPSS
- call: crypto/rsa.VerifyPSS
- composite: crypto/rsa.PSSOptions
- ref: crypto/x509.SHA256WithRSAPSS
- ref: crypto/x509.SHA384WithRSAPSS
- ref: crypto/x509.SHA512WithRSAPSS
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.SignatureAlgorithmPS256
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.SignatureAlgorithmPS384
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.SignatureAlgorithmPS512
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKCS1_RSA_PSS
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PSS
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PSS_2048_SHA256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PSS_3072_SHA256
- ref: github.com/sigstore/protobuf-specs/gen/pb-go/common/v1.PublicKeyDetails_PKIX_RSA_PSS_4096_SHA256
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.PS256
- ref: github.com/go-jose/go-jose/v3.PS384
- ref: github.com/go-jose/go-jose/v3.PS512
- ref: github.com/go-jose/go-jose/v4.PS256
- ref: github.com/go-jose/go-jose/v4.PS384
- ref: github.com/go-jose/go-jose/v4.PS512
- ref: gopkg.in/square/go-jose.v2.PS256
- ref: gopkg.in/square/go-jose.v2.PS384
- ref: gopkg.in/square/go-jose.v2.PS512
- ref: gopkg.in/go-jose/go-jose.v2.PS256
- ref: gopkg.in/go-jose/go-jose.v2.PS384
- ref: gopkg.in/go-jose/go-jose.v2.PS512
- ref: github.com/golang-jwt/jwt.SigningMethodPS256
- ref: github.com/golang-jwt/jwt.SigningMethodPS384
- ref: github.com/golang-jwt/jwt.SigningMethodPS512
- ref: github.com/golang-jwt/jwt/v4.SigningMethodPS256
- ref: github.com/golang-jwt/jwt/v4.SigningMethodPS384
- ref: github.com/golang-jwt/jwt/v4.SigningMethodPS512
- ref: github.com/golang-jwt/jwt/v5.SigningMethodPS256
- ref: github.com/golang-jwt/jwt/v5.SigningMethodPS384
- ref: github.com/golang-jwt/jwt/v5.SigningMethodPS512
