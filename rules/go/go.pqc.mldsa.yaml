# Written for CipherSift from the public API documentation of the Go standard library (pkg.go.dev crypto/mldsa,
# crypto/tls; Go 1.27 release notes); see spec/PROVENANCE.md, SPEC.md section 17.11 and DECISIONS F6.
id: go.pqc.mldsa
kind: source
language: go
name: ML-DSA usage in Go
description: >-
  Detects crypto/mldsa (Go 1.27) parameter sets, key generation, key construction and verification, and the
  crypto/tls ML-DSA signature schemes (parameter set as parameter).
asset:
  type: algorithm
  primitive: signature
  family: ML-DSA
match:
- call: crypto/mldsa.MLDSA44
  param:
    value: ML-DSA-44
- call: crypto/mldsa.MLDSA65
  param:
    value: ML-DSA-65
- call: crypto/mldsa.MLDSA87
  param:
    value: ML-DSA-87
- call: crypto/mldsa.GenerateKey
  param:
    index: 0
- call: crypto/mldsa.NewPrivateKey
  param:
    index: 0
- call: crypto/mldsa.NewPublicKey
  param:
    index: 0
- call: crypto/mldsa.Verify
- ref: crypto/tls.MLDSA44
  param:
    value: ML-DSA-44
- ref: crypto/tls.MLDSA65
  param:
    value: ML-DSA-65
- ref: crypto/tls.MLDSA87
  param:
    value: ML-DSA-87
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: github.com/cloudflare/circl/sign/mldsa/mldsa44.GenerateKey
  param:
    value: ML-DSA-44
- call: github.com/cloudflare/circl/sign/mldsa/mldsa44.NewKeyFromSeed
  param:
    value: ML-DSA-44
- call: github.com/cloudflare/circl/sign/mldsa/mldsa44.Scheme
  param:
    value: ML-DSA-44
- call: github.com/cloudflare/circl/sign/mldsa/mldsa44.SignTo
  param:
    value: ML-DSA-44
- call: github.com/cloudflare/circl/sign/mldsa/mldsa44.Verify
  param:
    value: ML-DSA-44
- call: github.com/cloudflare/circl/sign/mldsa/mldsa65.GenerateKey
  param:
    value: ML-DSA-65
- call: github.com/cloudflare/circl/sign/mldsa/mldsa65.NewKeyFromSeed
  param:
    value: ML-DSA-65
- call: github.com/cloudflare/circl/sign/mldsa/mldsa65.Scheme
  param:
    value: ML-DSA-65
- call: github.com/cloudflare/circl/sign/mldsa/mldsa65.SignTo
  param:
    value: ML-DSA-65
- call: github.com/cloudflare/circl/sign/mldsa/mldsa65.Verify
  param:
    value: ML-DSA-65
- call: github.com/cloudflare/circl/sign/mldsa/mldsa87.GenerateKey
  param:
    value: ML-DSA-87
- call: github.com/cloudflare/circl/sign/mldsa/mldsa87.NewKeyFromSeed
  param:
    value: ML-DSA-87
- call: github.com/cloudflare/circl/sign/mldsa/mldsa87.Scheme
  param:
    value: ML-DSA-87
- call: github.com/cloudflare/circl/sign/mldsa/mldsa87.SignTo
  param:
    value: ML-DSA-87
- call: github.com/cloudflare/circl/sign/mldsa/mldsa87.Verify
  param:
    value: ML-DSA-87
