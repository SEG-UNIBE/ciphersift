# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.kdf.scrypt
kind: source
language: go
name: scrypt key derivation in Go
description: >-
  Detects golang.org/x/crypto/scrypt.Key.
asset:
  type: algorithm
  primitive: kdf
  family: scrypt
match:
- call: golang.org/x/crypto/scrypt.Key
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age.NewScryptIdentity
- call: filippo.io/age.NewScryptRecipient
- call: github.com/secure-systems-lab/go-securesystemslib/encrypted.Encrypt
- call: github.com/secure-systems-lab/go-securesystemslib/encrypted.Decrypt
- call: github.com/secure-systems-lab/go-securesystemslib/encrypted.EncryptWithCustomKDFParameters
- call: github.com/secure-systems-lab/go-securesystemslib/encrypted.Marshal
- call: github.com/secure-systems-lab/go-securesystemslib/encrypted.MarshalWithCustomKDFParameters
- call: github.com/secure-systems-lab/go-securesystemslib/encrypted.Unmarshal
