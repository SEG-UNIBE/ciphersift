# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.ec
kind: source
language: go
name: EC key generation / usage in Go
description: >-
  Detects the crypto/elliptic NIST curves (reported with their FIPS 186 names, which an enclosing call such as
  ecdsa.GenerateKey also reports) and the deprecated crypto/elliptic point and key functions.
asset:
  type: algorithm
  family: EC
match:
- call: crypto/elliptic.P224
  param:
    value: P-224
- call: crypto/elliptic.P256
  param:
    value: P-256
- call: crypto/elliptic.P384
  param:
    value: P-384
- call: crypto/elliptic.P521
  param:
    value: P-521
- call: crypto/elliptic.GenerateKey
- call: crypto/elliptic.Marshal
- call: crypto/elliptic.MarshalCompressed
- call: crypto/elliptic.Unmarshal
- call: crypto/elliptic.UnmarshalCompressed
# DECISIONS F4 (benchmark-informed): key construction, as the Java *KeySpec and Python *Numbers patterns.
- composite: crypto/elliptic.CurveParams
# DECISIONS B-G-B1a (benchmark-informed in the choice of types): methods of standard-library types on receivers
# whose type is known (SPEC 17.12), written from the pkg.go.dev documentation of the package; accessors
# (Params, Equal, Size, ...) are not anchors.
- method: crypto/elliptic.Curve.ScalarMult
- method: crypto/elliptic.Curve.ScalarBaseMult
- method: crypto/elliptic.Curve.Add
- method: crypto/elliptic.Curve.Double
- method: crypto/elliptic.Curve.IsOnCurve
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- method: github.com/sigstore/sigstore/pkg/signature.AlgorithmDetails.GetECDSACurve
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmEC256
  param:
    value: P-256
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmEC384
  param:
    value: P-384
- ref: github.com/go-piv/piv-go/piv.AlgorithmEC256
  param:
    value: P-256
- ref: github.com/go-piv/piv-go/piv.AlgorithmEC384
  param:
    value: P-384
# DECISIONS T3-G2 (benchmark-informed in the choice of package: node, chain33): go-ethereum crypto and accounts/keystore,
# written from https://pkg.go.dev/github.com/ethereum/go-ethereum/crypto and .../accounts/keystore (v1.17.8, fetched 2026-10-18).
- call: github.com/ethereum/go-ethereum/crypto.GenerateKey
  param:
    value: secp256k1
- call: github.com/ethereum/go-ethereum/crypto.S256
  param:
    value: secp256k1
