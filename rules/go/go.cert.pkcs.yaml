# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.cert.pkcs
kind: source
language: go
name: 'PKCS#12 operations in Go'
description: >-
  Detects golang.org/x/crypto/pkcs12 decoding.
asset:
  type: certificate
match:
- call: golang.org/x/crypto/pkcs12.Decode
- call: golang.org/x/crypto/pkcs12.ToPEM
