# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.x25519
kind: source
language: go
name: X25519 key agreement in Go
description: >-
  Detects X25519 via crypto/ecdh.X25519, golang.org/x/crypto/curve25519 and the crypto/tls X25519 group.
asset:
  type: algorithm
  primitive: key-agree
  family: Curve25519
  securityLevel: 128
match:
- call: crypto/ecdh.X25519
- call: golang.org/x/crypto/curve25519.X25519
- call: golang.org/x/crypto/curve25519.ScalarMult
- call: golang.org/x/crypto/curve25519.ScalarBaseMult
- ref: golang.org/x/crypto/curve25519.Basepoint
- ref: crypto/tls.X25519
# HPKE identifiers (crypto/hpke, Go 1.26, and filippo.io/hpke, the same API), DECISIONS F5.
- call: crypto/hpke.DHKEM
  anySymbol: [crypto/ecdh.X25519]
- call: filippo.io/hpke.DHKEM
  anySymbol: [crypto/ecdh.X25519]
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- call: filippo.io/age.GenerateX25519Identity
- call: filippo.io/age.ParseX25519Identity
- call: filippo.io/age.ParseX25519Recipient
- call: github.com/cloudflare/circl/dh/x25519.KeyGen
- call: github.com/cloudflare/circl/dh/x25519.Shared
- ref: github.com/flynn/noise.DH25519
# DECISIONS B-G-B2 (benchmark-informed in the choice of packages: cosign): curated third-party Go APIs whose
# member names state the algorithm, written from their pkg.go.dev documentation (spec/PROVENANCE.md).
- ref: github.com/go-piv/piv-go/v2/piv.AlgorithmX25519
- ref: github.com/go-piv/piv-go/piv.AlgorithmX25519
