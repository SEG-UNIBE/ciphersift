# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.rsa.oaep
kind: source
language: go
name: RSA-OAEP encryption in Go
description: >-
  Detects crypto/rsa EncryptOAEP / DecryptOAEP and OAEPOptions.
asset:
  type: algorithm
  primitive: pke
  family: RSA
  variant: OAEP
match:
- call: crypto/rsa.EncryptOAEP
- call: crypto/rsa.DecryptOAEP
- composite: crypto/rsa.OAEPOptions
# Go 1.26 (separate OAEP and MGF1 hashes).
- call: crypto/rsa.EncryptOAEPWithOptions
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.EncryptionAlgorithmRSAOAEP
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.EncryptionAlgorithmRSAOAEP256
# DECISIONS T3-G4 (benchmark-informed in the choice of packages: go-jose, cosign, vault, smallstep, node): JOSE algorithm
# identifiers of go-jose (https://pkg.go.dev/github.com/go-jose/go-jose/v4, v4.1.6; same names in v2/v3) and golang-jwt signing
# methods / PEM key parsers (https://pkg.go.dev/github.com/golang-jwt/jwt/v5, v5.3.1; same names in v3/v4), names per the IANA
# JOSE registry (RFC 7518).
- ref: github.com/go-jose/go-jose/v3.RSA_OAEP
- ref: github.com/go-jose/go-jose/v3.RSA_OAEP_256
- ref: github.com/go-jose/go-jose/v4.RSA_OAEP
- ref: github.com/go-jose/go-jose/v4.RSA_OAEP_256
- ref: gopkg.in/square/go-jose.v2.RSA_OAEP
- ref: gopkg.in/square/go-jose.v2.RSA_OAEP_256
- ref: gopkg.in/go-jose/go-jose.v2.RSA_OAEP
- ref: gopkg.in/go-jose/go-jose.v2.RSA_OAEP_256
