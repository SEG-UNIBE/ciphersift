# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.rsa.oaep
kind: source
language: go
name: RSA-OAEP encryption in Go
description: >-
  Detects crypto/rsa EncryptOAEP / DecryptOAEP and OAEPOptions.
asset:
  type: algorithm
  primitive: pke
  family: RSA
  variant: OAEP
match:
- call: crypto/rsa.EncryptOAEP
- call: crypto/rsa.DecryptOAEP
- composite: crypto/rsa.OAEPOptions
# Go 1.26 (separate OAEP and MGF1 hashes).
- call: crypto/rsa.EncryptOAEPWithOptions
# Third-party Go APIs (DECISIONS T11, benchmark-informed), written from the pkg.go.dev documentation of the
# packages (versions in spec/PROVENANCE.md, "Wrapper propagation").
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.EncryptionAlgorithmRSAOAEP
- ref: github.com/Azure/azure-sdk-for-go/sdk/security/keyvault/azkeys.EncryptionAlgorithmRSAOAEP256
