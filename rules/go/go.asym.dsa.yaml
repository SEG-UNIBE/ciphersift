# Written for CipherSift's Go support from the public API documentation of the Go standard library
# and golang.org/x/crypto (pkg.go.dev); see spec/PROVENANCE.md and SPEC.md section 17.
id: go.asym.dsa
kind: source
language: go
name: DSA key generation / usage in Go
description: >-
  Detects crypto/dsa (parameters, keys, signatures, parameter sizes) and the crypto/x509 DSA algorithms.
asset:
  type: algorithm
  primitive: signature
  family: DSA
match:
- call: crypto/dsa.GenerateParameters
- call: crypto/dsa.GenerateKey
- call: crypto/dsa.Sign
- call: crypto/dsa.Verify
- ref: crypto/dsa.L1024N160
- ref: crypto/dsa.L2048N224
- ref: crypto/dsa.L2048N256
- ref: crypto/dsa.L3072N256
- ref: crypto/x509.DSA
- ref: crypto/x509.DSAWithSHA1
- ref: crypto/x509.DSAWithSHA256
# DECISIONS T3-G10: names as string literals in value positions: the IANA SSH / JOSE / TLS-group names of the Python rules
# (DECISIONS B-P-LIT, spec/PROVENANCE.md) and OpenSSL cipher names as used by OpenVPN --data-ciphers.
- literal: ['pgp-sign-dss', 'spki-sign-dss', 'ssh-dss', 'x509v3-ssh-dss']
  feature: go-literal-names
