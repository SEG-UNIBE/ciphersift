[project]
name = "svc"
dependencies = [
  "cryptography>=41",
  "PyJWT==2.8.0",
]

[project.optional-dependencies]
legacy = ["pycrypto==2.6.1"]

[dependency-groups]
dev = ["tink==1.10.0", "pytest"]

[tool.poetry.dependencies]
python = "^3.11"
pynacl = "1.5.0"
bcrypt = { version = "^4.0" }
asyncssh = { version = "==2.14.2", optional = true }

[tool.poetry.group.test.dependencies]
ecdsa = "0.19.0"
