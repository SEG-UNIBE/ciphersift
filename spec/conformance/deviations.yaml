# Copyright 2026 The CipherSift Authors
#
# Intentional differences between CipherSift and the reference tool (the BF-CBOM
# Crypsy fork). spec/tools/make_expected.py applies them, in the order remove, add,
# change, after it has turned the reference tool's findings into expected.json.
#
# Every entry carries the id of the SPEC.md section that defines the behaviour
# (field "spec") and a reason. "match" selects findings by equality on the given
# fields; "finding" lists the fields of an added finding (asset properties are
# filled in from the rule).
#
# Differences:
#   D1  setup.py is Python source (reference tool: treated as a manifest only).
#   D2  Python function/lambda parameters shadow outer bindings.
#   D3  Java array initialisers reached through a constant are flattened like inline ones.
#   D4  Java text blocks are decoded per the JLS (incidental indentation stripped).
#   D5  Binary files are skipped.
#   D6  --exclude-tests (the reference tool has no test-file detection).
#   D7  More PyPI manifests: requirements*.txt, requirements/*.txt, poetry.lock,
#       PEP 735 [dependency-groups].
#   D9  Integer/char elements of Java array arguments are not strings.
#   D8  Maven / Gradle manifests (the reference tool's pom.xml support is third-party
#       work and not carried over; all Maven expectations are hand-written here).
#
# Added with the evaluation fixes (spec/DECISIONS.md, E-series; the trailing comments of
# the affected input lines still describe the earlier behaviour):
#   D10 Python bare references in value position (tables, class attributes, arguments,
#       aliases) are matched by call patterns (SPEC 8.6.1, DECISIONS E1).
#   D11 verify=False / ssl=False only on HTTP-client calls (SPEC 8.6, DECISIONS E14).
#   D12 A padding object in a variable is attributed to the operation call (PSS, OAEP like
#       PKCS1v15), and method-only patterns with anySymbol are named after the symbol
#       (SPEC 8.6, DECISIONS E13, E17).
#   D13 setup.py install_requires / extras_require are dependency findings (SPEC 9.8,
#       DECISIONS E10).
#   D14 SecureRandom.getInstance reports its algorithm as parameter (DECISIONS E17).
#
# Added with the owner decisions of 2026-10-17 (spec/DECISIONS.md):
#   D15 Weakness indicators (insecure PRNGs) are reported only with --weakness-indicators
#       (SPEC 3.1, DECISIONS E2). Cases about indicators or about the forks' fixtures pass the
#       option in options.json (the reference tool reports them anyway); the others lose them.

cases:
  python/setup-py:
    add:
      - {spec: D1, reason: "setup.py is a Python file and is scanned like any other",
         finding: {file: setup.py, line: 7, rule: python.hash.sha1, name: hashlib.sha1}}
      - {spec: D13, reason: "install_requires of the setup() call",
         finding: {file: setup.py, rule: dep.pypi, package: cryptography, version: null}}
      - {spec: D13, reason: "install_requires of the setup() call, pinned",
         finding: {file: setup.py, rule: dep.pypi, package: pyjwt, version: "2.8.0"}}

  python/name-resolution:
    add:
      - {spec: D10, reason: "H = hl.sha1 is a bare reference to hashlib.sha1 on the right-hand side of an assignment",
         finding: {file: pkg/imports.py, line: 14, rule: python.hash.sha1, name: hashlib.sha1}}

  python/arguments:
    remove:
      - {spec: D11, reason: "some_helper is not an HTTP client; verify=False is reported only for requests/httpx/aiohttp and HTTP-client methods",
         match: {file: args.py, line: 15, rule: python.cert.validation.disabled}}

  python/attribution:
    add:
      - {spec: D12, reason: "pad holds padding.OAEP(...); key.decrypt(msg, pad) is attributed like PKCS1v15 (method + anySymbol)",
         finding: {file: ops.py, line: 17, rule: python.asym.rsa.oaep, name: cryptography.hazmat.primitives.asymmetric.padding.OAEP}}

  python/fork-fixtures:
    add:
      - {spec: D10, reason: "HMAC.new(key, digestmod=SHA256): the module Crypto.Hash.SHA256 is passed as the hash",
         finding: {file: pycryptodome/legacy.py, line: 23, rule: python.hash.sha2, name: Crypto.Hash.SHA256}}
    change:
      - {spec: D12, reason: "method-only pattern: named after the matching symbol, not the receiver",
         match: {file: misc/libs.py, line: 33, rule: python.asym.rsa}, set: {name: OpenSSL.crypto.TYPE_RSA}}
      - {spec: D12, reason: "method-only pattern: named after the matching symbol, not the receiver",
         match: {file: pyca/ciphers.py, line: 34, rule: python.asym.rsa.pkcs1v15.sign},
         set: {name: cryptography.hazmat.primitives.asymmetric.padding.PKCS1v15}}
      - {spec: D12, reason: "method-only pattern: named after the matching symbol, not the receiver",
         match: {file: pyca/ciphers.py, line: 35, rule: python.asym.rsa.pkcs1v15.encrypt},
         set: {name: cryptography.hazmat.primitives.asymmetric.padding.PKCS1v15}}
      - {spec: D12, reason: "method-only pattern: named after the matching symbol, not the receiver",
         match: {file: pyca/operations.py, line: 30, rule: python.asym.rsa.pkcs1v15.sign},
         set: {name: cryptography.hazmat.primitives.asymmetric.padding.PKCS1v15}}

  java/regex-battery:
    change:
      - {spec: D14, reason: "the resolved algorithm argument is the parameter", match: {file: src/battery/Battery.java, line: 137, rule: java.rand.prng.secure}, set: {param: SHA1PRNG}}
      - {spec: D14, reason: "the resolved algorithm argument is the parameter", match: {file: src/battery/Battery.java, line: 138, rule: java.rand.prng.secure}, set: {param: DRBG}}
      - {spec: D14, reason: "the resolved algorithm argument is the parameter", match: {file: src/battery/Battery.java, line: 139, rule: java.rand.prng.secure}, set: {param: NativePRNG}}

  python/constants:
    remove:
      - {spec: D2, reason: "MODULE_ALG is the function's parameter, not the module constant",
         match: {file: consts.py, line: 23, rule: python.hash.md5}}

  java/string-resolution:
    add:
      - {spec: D3, reason: "PROTOCOLS is a static final String[] initialised with literals",
         finding: {file: src/strings/Strings.java, line: 37, rule: java.prot.tls.v1_0}}
      - {spec: D3, reason: "PROTOCOLS is a static final String[] initialised with literals",
         finding: {file: src/strings/Strings.java, line: 37, rule: java.prot.tls.v1_3}}
      - {spec: D4, reason: "the text block's value is \"DESede\"; the reference tool kept the leading line break and indentation",
         finding: {file: src/strings/Strings.java, line: 41, rule: java.sym.3des.ecb, name: DESede}}
    remove:
      - {spec: D4, reason: "replaced by the 3DES-ECB finding",
         match: {file: src/strings/Strings.java, line: 41, rule: java.jca.cipher.unresolved}}

  java/constant-args:
    add:
      - {spec: D9, reason: "the byte array's numbers are not strings; the first string is \"DES\"",
         finding: {file: src/k/Keys.java, line: 14, rule: java.sym.des, name: DES}}

  common/binary:
    remove:
      - {spec: D5, reason: "blob.py is mostly NUL bytes and is classified as binary",
         match: {file: blob.py}}

  common/test-files:
    remove:
      - {spec: D15, reason: "random.random() is a weakness indicator, not reported without --weakness-indicators; the case is about test-file marking (conftest.py marking stays covered by FilesTest)",
         match: {file: app/conftest.py, rule: python.rand.prng.insecure}}

  common/test-files-excluded:
    remove:
      - {spec: D6, reason: "under src/test/", match: {file: src/test/java/t/ProdTest.java}}
      - {spec: D6, reason: "file name test_*.py", match: {file: app/test_util.py}}
      - {spec: D6, reason: "file name conftest.py", match: {file: app/conftest.py}}
      - {spec: D6, reason: "directory tests/", match: {file: tests/helpers.py}}

  deps/pypi:
    add:
      - {spec: D7, reason: "requirements*.txt", finding: {file: requirements-dev.txt, rule: dep.pypi, package: pyopenssl, version: "24.0.0"}}
      - {spec: D7, reason: "*.txt inside a requirements/ directory", finding: {file: requirements/base.txt, rule: dep.pypi, package: passlib, version: "1.7.4"}}
      - {spec: D7, reason: "poetry.lock", finding: {file: svc/poetry.lock, rule: dep.pypi, package: cryptography, version: "42.0.5"}}
      - {spec: D7, reason: "poetry.lock", finding: {file: svc/poetry.lock, rule: dep.pypi, package: pynacl, version: "1.5.0"}}
      - {spec: D7, reason: "PEP 735 dependency group", finding: {file: svc/pyproject.toml, rule: dep.pypi, package: tink, version: "1.10.0"}}

  deps/maven:
    add:
      - {spec: D8, reason: "dependencyManagement, version from <properties>",
         finding: {file: pom.xml, rule: dep.maven, package: "org.bouncycastle:bcprov-jdk18on", version: "1.78.1"}}
      - {spec: D8, reason: "dependencyManagement, version from <properties>",
         finding: {file: pom.xml, rule: dep.maven, package: "io.jsonwebtoken:jjwt-api", version: "0.12.5"}}
      - {spec: D8, reason: "plugin dependency",
         finding: {file: pom.xml, rule: dep.maven, package: "commons-codec:commons-codec", version: "1.16.1"}}
      - {spec: D8, reason: "version managed by the parent; parents are not resolved",
         finding: {file: app/pom.xml, rule: dep.maven, package: "org.bouncycastle:bcprov-jdk18on", version: null}}
      - {spec: D8, reason: "unresolvable property",
         finding: {file: app/pom.xml, rule: dep.maven, package: "org.bouncycastle:bcpkix-jdk18on", version: null}}
      - {spec: D8, reason: "test scope is still a dependency",
         finding: {file: app/pom.xml, rule: dep.maven, package: "org.mindrot:jbcrypt", version: "0.4"}}
      - {spec: D8, reason: "Groovy string coordinate",
         finding: {file: gradle/build.gradle, rule: dep.maven, package: "org.bouncycastle:bcprov-jdk18on", version: "1.77"}}
      - {spec: D8, reason: "double-quoted coordinate",
         finding: {file: gradle/build.gradle, rule: dep.maven, package: "com.nimbusds:nimbus-jose-jwt", version: "9.37.3"}}
      - {spec: D8, reason: "map notation",
         finding: {file: gradle/build.gradle, rule: dep.maven, package: "com.google.crypto.tink:tink", version: "1.12.0"}}
      - {spec: D8, reason: "parenthesised coordinate",
         finding: {file: gradle/build.gradle, rule: dep.maven, package: "org.conscrypt:conscrypt-openjdk-uber", version: "2.5.2"}}
      - {spec: D8, reason: "coordinate without version",
         finding: {file: gradle/build.gradle, rule: dep.maven, package: "com.auth0:java-jwt", version: null}}
      - {spec: D8, reason: "Kotlin DSL, $variable resolved from a val in the same file",
         finding: {file: kts/build.gradle.kts, rule: dep.maven, package: "org.apache.sshd:sshd-core", version: "2.12.1"}}
      - {spec: D8, reason: "Kotlin DSL coordinate",
         finding: {file: kts/build.gradle.kts, rule: dep.maven, package: "at.favre.lib:bcrypt", version: "0.10.2"}}
      - {spec: D8, reason: "Kotlin DSL named arguments",
         finding: {file: kts/build.gradle.kts, rule: dep.maven, package: "de.mkammerer:argon2-jvm", version: "2.11"}}
      - {spec: D8, reason: "version catalog, module + version.ref",
         finding: {file: kts/gradle/libs.versions.toml, rule: dep.maven, package: "org.bitbucket.b_c:jose4j", version: "0.9.6"}}
      - {spec: D8, reason: "version catalog, group + name + version",
         finding: {file: kts/gradle/libs.versions.toml, rule: dep.maven, package: "org.springframework.security:spring-security-crypto", version: "6.2.2"}}
      - {spec: D8, reason: "version catalog, coordinate string",
         finding: {file: kts/gradle/libs.versions.toml, rule: dep.maven, package: "com.password4j:password4j", version: "1.8.1"}}
